<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d9b57e">
<meta name="format-detection" content="telephone=no">
<title>我的水族箱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; overflow: hidden; }

  body {
    position: fixed; inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, #25414f 0%, #14252e 45%, #0a141a 100%);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    touch-action: none;
  }

  /* 舞台：游戏画面的逻辑尺寸。
   * 底色和游戏里缸体外的木色完全一致 —— 手机上地址栏收起时
   * 等比缩放会留出几像素空白，同色才看不出接缝。 */
  #stage {
    position: absolute; left: 50%; top: 50%;
    transform-origin: center center;
    overflow: hidden;
    background: linear-gradient(#d9b57e, #bd9159);
  }

  /* 桌面：给舞台一圈阴影，像把手机放在桌上；手机铺满就不要。 */
  body.desk #stage {
    border-radius: 16px;
    box-shadow: 0 26px 70px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .1);
  }

  /* 手机上地址栏收起/展开会让舞台等比缩放一点点。
   * 露出来的部分用同一种木色，才看不出接缝。 */
  body.phone { background: linear-gradient(#d9b57e, #bd9159); }

  /* 手机横屏：这块是竖屏游戏，与其缩成一条不如直接提示转过来 */
  #rotate {
    position: fixed; inset: 0; z-index: 9;
    display: none; align-items: center; justify-content: center;
    background: #12232c;
    color: #ffd08a;
    padding: 0 40px;
    text-align: center;
    font: 600 15px/1.9 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body.tilt #rotate { display: flex; }
  body.tilt #stage { visibility: hidden; }

  #stage > canvas { display: block; }

  /* 截图模式（?stage=WxH）：左上角对齐、无圆角，便于逐像素核对 */
  body.shot #stage {
    left: 0; top: 0;
    border-radius: 0;
    box-shadow: none;
  }

  #fallback {
    position: absolute; left: 0; right: 0; top: 38%;
    padding: 0 28px;
    text-align: center; white-space: pre-wrap;
    color: #ffd08a;
    font: 600 14px/1.8 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: none;
  }
</style>
</head>
<body class="desk">
<div id="stage"></div>
<div id="fallback"></div>
<div id="rotate">这是竖屏游戏<br>请把手机转回来</div>

<script>
/* 容器页：决定「舞台」多大。
 * 手机竖屏 → 舞台 = 屏幕，一屏铺满；
 * 桌面 / 横屏 → 舞台固定 390×844（和微信里看到的排版逐像素一致），
 *               再用 transform 整体缩放塞进窗口。 */
(function () {
  var vw = window.innerWidth;
  var vh = window.innerHeight;

  /* 调试通道：?stage=390x844 强制一个逻辑尺寸并左上角对齐。
   * 无头浏览器报的 innerWidth 和 --window-size 经常对不上，
   * 有了它截图才能逐像素核对排版。真实用户不会带这个参数。 */
  var q = /[?&]stage=(\d+)x(\d+)/.exec(location.search);
  var forced = q ? { w: parseInt(q[1], 10), h: parseInt(q[2], 10) } : null;

  var phone;
  var W, H;

  if (forced) {
    phone = true;
    W = forced.w;
    H = forced.h;
    document.body.className = 'shot';
  } else {
    phone = vw <= 560 && vh > vw;
    W = phone ? vw : 390;
    H = phone ? vh : 844;
    document.body.className = phone ? 'phone' : 'desk';
  }

  /* platform.viewport() 会优先读这个值：
   * 布局按逻辑尺寸算，缩放到多大都不影响游戏内部排版。 */
  window.__stageSize = { w: W, h: H };

  var stage = document.getElementById('stage');
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';

  function fit() {
    if (forced) {
      stage.style.transform = 'none';
      return;
    }

    /* 横屏手机：竖屏游戏缩小了没法玩，直接改成提示转屏 */
    var tilt = window.innerWidth > window.innerHeight && window.innerHeight < 560;
    document.body.classList.toggle('tilt', tilt);
    if (tilt) return;

    var k = Math.min(window.innerWidth / W, window.innerHeight / H);
    /* 桌面上放大到 1.2 倍就到顶：再大就显得粗糙了 */
    if (!phone) k = Math.min(k, 1.2);
    if (!(k > 0)) k = 1;
    stage.style.transform = 'translate(-50%, -50%) scale(' + k + ')';
  }

  window.__fitStage = fit;

  var pending = 0;
  function later() {
    if (pending) clearTimeout(pending);
    pending = setTimeout(fit, 80);
  }

  window.addEventListener('resize', later);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 320); });
  /* 手机上地址栏收起/展开会改变可视高度，缩放要跟着走 */
  if (window.visualViewport) window.visualViewport.addEventListener('resize', later);

  fit();
})();
</script>

/* ============================================================
 * render/canvas.js · 画布与视口
 *
 * 全工程唯一创建 canvas 的地方。竖屏游戏，尺寸在启动时确定。
 *
 * 竖向分两段（M13 去掉底栏）：
 *   ┌──────────────┐ 0
 *   │  缸盖 · 信息行 │ HEAD_H = 状态栏 + 74
 *   ├──────────────┤ TANK_TOP
 *   │              │
 *   │   水体（玻璃） │   ← 鱼、水草、珊瑚、沙底都在这里面
 *   │              │
 *   │  ⬤ ⬤ ⬤ ⬤ ⬤  │   ← 五个悬浮按钮（圆形图标 + 胶囊标签）
 *   └──────────────┘ TANK_BOTTOM = H
 *
 * 底栏那条木板已经删掉了：缸体一路延伸到屏幕底部，
 * 按钮变成浮在水底的圆形徽章，不再占掉一整条高度。
 * 鱼的可游范围仍按 ground 收口，不会钻到按钮后面去。
 * ============================================================ */

var platform = require('../platform.js');

var info = platform.viewport();

var DPR = Math.min(info.pixelRatio || 2, 3);
var W = info.windowWidth;
var H = info.windowHeight;
var SB = info.statusBarHeight || 20;
var SAFE_BOTTOM = info.safeAreaBottom || 0;

/* ---- 三段的高度 ----
 * M6 起顶部和底部都长高了：上面是「玩家卡 + 两个资源条」，
 * 下面是「图标 + 文字」的方形按钮，都比原来那行小字和扁按钮占地方。
 * 中间的玻璃相应变矮一点，仍然是最宽裕的一块。 */
var HEAD_H = SB + 74;

/* ---- 底部悬浮按钮（M13）----
 * BTN_H 是「圆形徽章 + 胶囊标签」这一整块的高度：
 * 圆半径约 25，标签 22 高，压在圆底部 10px 上。
 * 按钮底边离屏幕底留一点点安全距，剩下的全给鱼缸。 */
var BTN_H = 62;
var BTN_PAD = 12 + Math.min(SAFE_BOTTOM, 16);
var BTN_Y = H - BTN_PAD - BTN_H;                /* 按钮块顶边 */
var TANK_TOP = HEAD_H;
var TANK_BOTTOM = H - 1;                        /* 缸底 = 屏幕底（底栏已删） */

/* 沙底：鱼贴着它游，水草珊瑚从这里长出来。
 * 放在按钮上方一点，按钮就像「站在沙地上」，鱼也不会钻到按钮背后。 */

var FRAME_X = 8;

var canvas = platform.createCanvas(W, H, DPR);
if (!canvas) {
    throw new Error('createCanvas() 返回空（W=' + W + ' H=' + H + ' DPR=' + DPR + '）');

if (!ctx) {
    throw new Error('getContext("2d") 返回空，该机型/基础库不支持 Canvas 2D');

ctx.scale(DPR, DPR);

    canvas: canvas,
    FRAME_X: FRAME_X,
    ctx: ctx,
    W: W,
    H: H,
    SB: SB,
    SAFE_BOTTOM: SAFE_BOTTOM,
    /* 三段分区 */
    HEAD_H: HEAD_H,
    TANK_TOP: TANK_TOP,
    TANK_BOTTOM: TANK_BOTTOM,
    STAND_TOP: TANK_BOTTOM,     /* 旧名：缸底就是按钮带的顶边 */
    BTN_H: BTN_H,

 * core/fish.js · 鱼实体与派生属性
 *

 * 鱼的「数据」与「运行时位置」放在同一个对象里，
 * 但只有 core/sim.js 会改运行时字段，渲染层只读。

var RARITY_NAME = ['R', 'SR', 'SSR'];

var seq = 0;

    return SPECIES_MAP[id] || SPECIES[0];
}

    return SPECIES[0];

    var r = RARITY_RANK[sp.rarity];

function stageOf(growth) {
    var st = cfg.economy.stage;
    if (growth >= st.adultAt) return 'adult';
    if (growth >= st.juvenileAt) return 'juvenile';
    return 'fry';
}

    if (stage === 'juvenile') return '幼鱼';

    return e.stages[evoOf(f)] || e.stages[0];

    var st = evoStageOf(f);
    return st ? st.name : '';
}

function evoMulOf(f) {
    var st = evoStageOf(f);
    return st ? (st.mul || 1) : 1;
}

function evoSizeMulOf(f) {
    var st = evoStageOf(f);
    return st ? (st.sizeMul || 1) : 1;

    if (!f) return false;

    if (!cfg.traits.enabled || !f.traits || !f.traits.length) return 0;
    var sum = 0;
    for (var i = 0; i < f.traits.length; i++) sum += traitLvOf(f.traits[i]);
    return sum;

    if (per == null) per = 0.06;
    return 1 + per * traitSumOf(f);

        var v = def.values[Math.max(0, Math.min(def.values.length - 1, lv - 1))];

/* 状态衰减：饱食 / 心情不满时按比例减产，最低保留 floor */

    var r = Math.random();
    var acc = 0;
    for (var i = 0; i < dist.length; i++) {

    return Math.max(1, Math.min(maxLv, dist[dist.length - 1].lv));

    if (!sp || sp.predator) return [];

    var list = (cfg.economy.sell.shellBonus || [1]);
    var lv = Math.max(0, Math.min(list.length - 1, shellLv || 0));
    return list[lv] || 1;

 * 「每条鱼都带词条」之后，卵价必须把词条的期望加成算进去，
 * 否则「买卵 → 养大 → 卖」会变成 105% 的无风险套利（实测）。
 * 期望 = 槽位数 × E[等级]，E[等级] 按 config/traits.js 的 rollLv 分布算。

    var slots = traitSlotsOf(fake);
    var maxLv = traitMaxLvOf(fake);
    var dist = cfg.traits.rollLv || [{ lv: 1, p: 1 }];
    var e = 0;
    for (var i = 0; i < dist.length; i++) {
        e += (dist[i].p || 0) * Math.min(maxLv, dist[i].lv);

    return slots * e;

    if (!cfg.traits.enabled) return 1;
    if (sp && sp.predator) return 1;
    var per = cfg.traits.sellPerLv;
    if (per == null) per = 0.06;
    return 1 + per * expectedTraitSum(sp && sp.rarity);

     * 两条路都过一遍 normalizeTraits：截到槽位数、补 lv、丢掉未知 id。 */
    var traits = normalizeTraits(opts.traits, sp);

    var sex = opts.sex;

        speciesId: sp.id,
        growth: growth,
        hunger: opts.hunger == null ? 78 : opts.hunger,
        mood: opts.mood == null ? 82 : opts.mood,
        traits: traits,
        sex: sex,
        /* 进化阶（M14）：只有金鲤鱼会 >0，别的鱼恒 0 */

        coinT: 2 + Math.random() * 3,
        belly: 0,
        feedCoin: 0,

        huntT: sp.predator ? 3 + Math.random() * 3 : 0,
        /* 读档时成鱼直接标记，避免一进游戏满缸飘「成鱼啦」 */
        adultMark: growth >= 100
    };

    RARITY_NAME: RARITY_NAME,
    speciesById: speciesById,
    speciesByPalette: speciesByPalette,
    rarityRank: rarityRank,

 * 条目仍然算已发现。这和缸里现有的鱼是两回事。

 * ============================================================ */

var fishLib = require('./fish.js');
var platform = require('../platform.js');

function table(state) {
    if (!state.discovered || typeof state.discovered !== 'object') {
        state.discovered = {};
    }
    return state.discovered;
}

/* 收录一条鱼。返回 true 表示是新发现（首次），false 表示之前已有 */
function mark(state, speciesId) {
    if (!speciesId) return false;
    var t = table(state);
    var rec = t[speciesId];
    if (!rec) {
        t[speciesId] = { n: 1, t: platform.now() };
        return true;
    }
    rec.n = (rec.n || 0) + 1;
    return false;

    for (var i = 0; i < state.fish.length; i++) {

    }
    return added;

    return !!table(state)[speciesId];
}

function foundCount(state) {
    var n = 0;
    var t = table(state);
    for (var i = 0; i < cfg.species.length; i++) {
        if (t[cfg.species[i].id]) n += 1;
    }
    return n;
}

    return cfg.species.length;
}

/* 图鉴条目。未发现的鱼也占位，但名字和资料打码，只留剪影 */
function list(state) {
    var t = table(state);
    var out = [];
    for (var i = 0; i < cfg.species.length; i++) {
        var sp = cfg.species[i];
        var rec = t[sp.id];
        out.push({
            sp: sp,
            index: i + 1,
            found: !!rec,
            count: rec ? (rec.n || 0) : 0,
            firstAt: rec ? rec.t : 0,
            price: fishLib.matureValueOf(sp),
            mature: sp.matureSeconds || 120,
            source: sourceOf(sp)
        });
    }
    return out;

    if (sp.legendOnly) return '传奇鱼卵 10%';
    if (sp.secret) return '普通鱼卵 0.1% · 传奇鱼卵 90%';
    if (sp.rarity === 'R') return '普通鱼卵';
    if (sp.rarity === 'SR') return '稀有鱼卵';
    if (sp.rarity === 'SSR') return '传说鱼卵';
    return '鱼卵';

    var found = foundCount(state);

    mark: mark,
    syncFromFish: syncFromFish,
    isFound: isFound,
    foundCount: foundCount,
    totalCount: totalCount,
    list: list,
    progress: progress,
    sourceOf: sourceOf
};

    /* 先把时间推到现在，无论是否结算，避免重复领取 */
    state.lastSeenAt = nowMs;

    var O = cfg.economy.offline;
    if (rawSeconds < (O.minSeconds || 60)) return null;

    var capHours = storage.offlineHoursOf(state);
    var capSeconds = capHours * 3600;
    var seconds = Math.min(rawSeconds, capSeconds);
    var capped = rawSeconds > capSeconds;

    var eff = O.growthEfficiency == null ? 1 : O.growthEfficiency;
    var effective = seconds * eff;
    var floor = O.hungerFloor == null ? 0 : O.hungerFloor;
    var decay = cfg.economy.feeding.hungerDecay;

    var grown = 0;
    var adult = 0;
    var before = 0;
    var after = 0;

    /* 离开那一刻的全缸身价：等下被吃掉的鱼也要算在「之前」里，
     * 这样弹窗的涨跌才是真的，不会假装它们从来没出现过。 */
    for (var i = 0; i < state.fish.length; i++) {
        before += fishLib.sellPriceOf(state.fish[i], state.shellLv);
    }

    /* 捕食者离线也照样吃鱼，只是频率放慢（默认每 3 分钟一条）。
     * 它不吃鱼饵，所以离线不会因为它而少掉饲料。 */
    var P = cfg.economy.predator || {};
    var mealGap = P.offlineMealSeconds == null ? 180 : P.offlineMealSeconds;
    var meals = Math.max(0, Math.floor(seconds / Math.max(1, mealGap)));
    var hunters = [];
    for (i = 0; i < state.fish.length; i++) {
        if (predation.isPredator(state.fish[i])) hunters.push(state.fish[i]);
    }
    for (var h = 0; h < hunters.length; h++) {
        for (var m = 0; m < meals; m++) {
            var prey = predation.findPrey(state, hunters[h]);
            if (!prey) break;
            predation.eat(state, hunters[h], prey);
        }
    }
    var eaten = predation.removeEaten(state);

    for (i = 0; i < state.fish.length; i++) {
        var f = state.fish[i];
        var sp = fishLib.speciesById(f.speciesId);

        if (f.growth < 100) {
            var perSec = 100 / Math.max(1, sp.matureSeconds || 120);
            var was = f.growth;
            f.growth = Math.min(100, was + perSec * effective);
            if (f.growth > was + 0.5) grown += 1;
            if (was < 100 && f.growth >= 100) adult += 1;
        }

        if (f.hunger > floor) {
            f.hunger = Math.max(floor, f.hunger - decay * seconds);
        }

        after += fishLib.sellPriceOf(f, state.shellLv);
    }

    /* 繁育：离线期间到点的蛋必须孵出来，不能等玩家回来才继续倒数。
     * 培育缸里的子代也按同样的离线效率长大。 */
    var hatched = breed.tick(state, nowMs).length;
    var nursery = state.nursery || [];
    for (i = 0; i < nursery.length; i++) {
        var nf = nursery[i];
        if (nf.growth >= 100) continue;
        var nsp = fishLib.speciesById(nf.speciesId);
        nf.growth = Math.min(100, nf.growth + (100 / Math.max(1, nsp.matureSeconds || 120)) * effective);
    }

    /* 没有鱼长大、没有鱼被吃掉、也没有蛋孵出来，就不打扰玩家 */
    if (grown <= 0 && eaten <= 0 && hatched <= 0) return null;

    var result = {
        seconds: seconds,
        rawSeconds: rawSeconds,
        capped: capped,
        capHours: capHours,
        grown: grown,
        adult: adult,
        eaten: eaten,
        hatched: hatched,
        total: state.fish.length,
        before: before,
        after: after,
        gain: after - before
    };
    state.lastOffline = result;
    return result;
}

module.exports = {
    settle: settle
};

/* ============================================================
 * core/shop.js · 商店（价格计算 / 可买性 / 购买执行）
 *
 * 两个货架：
 *   道具  config/items.js    —— 饲料、摆件、喂食器、仓库、鱼缸
 *   鱼卵  config/species.js  —— 按品质买，随机开出该品质的一条
 *
 * 鱼卵不再「指哪买哪」：只能选 R / SR / SSR，
 * 具体是哪条鱼靠抽。同一档里的卖价差好几倍，
 * 抽到贵的就赚得多 —— 这让「买卵」有赌的成分，
 * 但期望始终是正的（卵价 = 平均卖价 × 0.78）。
 *
 * M8 起多一款「传奇鱼卵」：固定 10 万金币，不受解锁条件影响。
 * M14 起它拆成两档产出：90% 小鲨鱼 / 10% 金鲤鱼（化龙线的起点）。
 *
 * 价格规则：
 *   道具  base × mul ^ 已购次数
 *   鱼卵  该品质平均成鱼卖价 × eggDiscount（不随购买次数上涨）
 * ============================================================ */

var cfg = require('../config/index.js');
var wallet = require('./wallet.js');
var fishLib = require('./fish.js');
var storage = require('./storage.js');
var codex = require('./codex.js');

function itemById(id) {
    for (var i = 0; i < cfg.items.length; i++) {
        if (cfg.items[i].id === id) return cfg.items[i];
    }
    return null;
}

/* 当前等级（只有带 maxLevel 的条目才有意义） */
function levelOf(state, id) {
    if (id === 'feed') return state.foodLv;
    if (id === 'bait') return Math.max(0, (state.bag && state.bag.bait) || 0);
    if (id === 'shell') return state.shellLv || 0;
    if (id === 'warehouse') return storage.levelOf(state);
    if (id === 'tank') return storage.tankCountOf(state);
    return 0;
}

/* 已购次数，用来算价格和判断满级 */
function purchaseCount(state, id) {
    if (id === 'feed') return Math.max(0, state.foodLv - 1);
    /* 消耗品价格恒定：不走 base×mul^n 的涨价格 */
    if (id === 'bait') return 0;
    /* 贝壳从 0 级起买：已购次数 = 当前等级（0→1 花 base，1→2 花 base×mul） */
    if (id === 'shell') return Math.max(0, state.shellLv || 0);
    if (id === 'coral') return state.corals;
    if (id === 'auto') return state.auto ? 1 : 0;
    if (id === 'warehouse') return Math.max(0, storage.levelOf(state) - 1);
    if (id === 'tank') return Math.max(0, storage.tankCountOf(state) - 1);
    return 0;
}

function priceOf(state, item) {
    /* 鱼缸价格单独一张表：开第 N 个缸要多少钱，不看公式看配置 */
    if (item.id === 'tank') {
        var list = (cfg.economy.tanks && cfg.economy.tanks.price) || [];
        return list[storage.tankCountOf(state)] || 0;
    }
    var n = purchaseCount(state, item.id);
    var p = item.price.base * Math.pow(item.price.mul, n);
    var step = item.price.step || 1;
    return Math.round(p / step) * step;
}

/**
 * 新鱼放哪个缸：优先玩家正在看的那个，满了再顺延到还有空位的缸。
 * 全都满了返回 -1（调用方应该已经在 statusOf 里拦掉了）。

    if (storage.roomInTank(state, act) > 0) return act;
    return storage.firstRoomTank(state);
}

function statusOf(state, item) {
    var cur = levelOf(state, item.id);
    var maxed = item.maxLevel != null && cur >= item.maxLevel;
    var owned = item.id === 'auto' && state.auto;
    var price = priceOf(state, item);
    var affordable = wallet.canAfford(state, 'fish', price);

    var label;
    if (maxed) label = '已满级';

    }
    if (item.id === 'shell') {
        var gains = cfg.economy.sell.shellBonus || [1];
        function pct(v) { return Math.round((v - 1) * 100) + '%'; }
        desc = cur > 0 ? ('当前卖鱼 +' + pct(gains[Math.min(cur, gains.length - 1)])) : item.desc;
        if (maxed) desc = '卖鱼价 +' + pct(gains[gains.length - 1]) + ' · 已满级';
        else if (cur > 0) desc += ' → 下一级 +' + pct(gains[Math.min(cur + 1, gains.length - 1)]);
    }
    if (item.id === 'feed' && maxed) desc = '已经是最高等级';
    if (item.id === 'auto' && owned) desc = '运行中：每 ' + cfg.economy.autoFeeder.interval + ' 秒撒一次食';
    if (item.id === 'tank') {
        var tanks = storage.tankCountOf(state);
        var maxTanks = storage.maxTanks();
        if (maxed) {
            desc = '已经有 ' + maxTanks + ' 个缸，鱼位 ' + storage.slotsOf(state) + ' 个';
        } else {
            desc = '鱼位 +' + storage.slotsPerTank(state) + '，可再养一缸';
        }
    }
    if (item.id === 'warehouse') {
        /* 不产币之后「容量」已经没有意义，仓库只剩两个作用：
         * 每个缸能养几条（鱼位）+ 离线能存多久（离线时长）。 */
        var slotList = cfg.economy.storage.slots || [];
        var hourList = cfg.economy.storage.offlineHours || [];
        if (maxed) {

        } else {

            var nextSlots = nextPer * storage.tankCountOf(state);
            var nextHour = hourList[Math.min(hourList.length - 1, cur)] || storage.offlineHoursOf(state);
            desc = '鱼位 +' + (nextSlots - storage.slotsOf(state)) + ' · 离线 ' + nextHour + ' 小时';
        }
    }

    var level = '';
    if (item.id === 'feed') level = maxed ? 'MAX' : 'Lv.' + state.foodLv;
    if (item.id === 'bait') level = '×' + cur;
    if (item.id === 'shell') {

    if (item.id === 'warehouse') {

    }

function list(state) {

}

/**
 * 购买道具。返回 { ok, reason, name }

function buy(state, id) {
    var item = itemById(id);

    var st = statusOf(state, item);

function legendCfg() {

}

function isLegend(rarity) {

function ownedCount(state, speciesId) {

    for (var i = 0; i < state.fish.length; i++) {
        if (state.fish[i].speciesId === speciesId) n += 1;
    }

}

function rankOfRarity(r) {

/* 某品质的鱼池（保留抽取权重，档内也是加权随机）。
 * secret 的彩蛋鱼不在这里：它不走权重，由 eggRate 单独判定。 */
function rarityPool(rarity) {
    var list = [];
    var total = 0;
    for (var i = 0; i < cfg.species.length; i++) {
        var sp = cfg.species[i];
        if (sp.rarity !== rarity || sp.secret) continue;
        list.push(sp);
        total += sp.drawWeight || 1;
    }
    return { list: list, total: total };
}

/* 该品质里按独立概率出的彩蛋鱼（当前只有小鲨鱼） */
function secretPool(rarity) {
    var list = [];
    for (var i = 0; i < cfg.species.length; i++) {
        var sp = cfg.species[i];
        if (sp.rarity === rarity && sp.secret && sp.eggRate > 0) list.push(sp);
    }
    return list;
}

/* 该品质的平均成鱼卖价 —— 卵价的基准。
 * 彩蛋鱼虽然不在常规池里，期望价值仍要算进去，
 * 否则 1% 的高价鱼会变成白送的漏洞。 */
function avgSellOf(rarity) {
    if (isLegend(rarity)) {
        var L = legendCfg();
        var main = fishLib.eggValueOf(fishLib.speciesById(L.speciesId));
        if (L.bonus && L.bonus.speciesId && L.bonus.rate > 0) {
            var b = fishLib.eggValueOf(fishLib.speciesById(L.bonus.speciesId));
            var rate = Math.min(1, Math.max(0, L.bonus.rate));
            return main * (1 - rate) + b * rate;

    if (!pool.total) return 0;
    var sum = 0;
    for (var i = 0; i < pool.list.length; i++) {
        sum += (pool.list[i].drawWeight || 1) * fishLib.eggValueOf(pool.list[i]);

    var used = 0;
    for (var k = 0; k < secrets.length; k++) {

/**
 * 卵价 = 该品质平均卖价 × eggDiscount
 * 不随购买次数上涨：限制玩家的是鱼位，不是价格。
 * 价格通胀只会让低品质卵迅速失效，把玩家卡在「买不起下一档」的死角。

            rarity: rarity,
            price: price,
            avgSell: val,
            minSell: val,
            maxSell: val,
            rep: sp,
            count: names.length,
            names: names,
            secretRate: rate,
            secretHint: hint,
            locked: false,
            full: full,
            need: 0,
            affordable: affordable,
            disabled: full || !affordable,
            label: full ? '鱼位满' : price >= 10000 ? wallet.format(price) : String(price)
        };
    }

    var rank = rankOfRarity(rarity);
    var maxRank = fishLib.unlockedRank(state.fish.length);
    var locked = rank > maxRank;
    var price = eggPriceOf(rarity);
    var pool = rarityPool(rarity);
    var full = storage.roomOf(state) <= 0;
    var affordable = !locked && !full && wallet.canAfford(state, 'fish', price);
    var secrets = secretPool(rarity);
    var secretRate = 0;
    for (var k = 0; k < secrets.length; k++) secretRate += secrets[k].eggRate;

    /* 档内卖价区间：让玩家一眼看出「抽到好的能赚多少」 */
    var minSell = Infinity;
    var maxSell = 0;
    var rep = pool.list[0];
    for (var i = 0; i < pool.list.length; i++) {
        var v = fishLib.eggValueOf(pool.list[i]);
        if (v < minSell) minSell = v;
        if (v > maxSell) { maxSell = v; rep = pool.list[i]; }
    }

    return {
        rarity: rarity,
        price: price,
        avgSell: avgSellOf(rarity),
        minSell: minSell === Infinity ? 0 : minSell,
        maxSell: maxSell,
        rep: rep,
        count: pool.list.length,
        names: pool.list.map(function (s) { return s.name; }),
        /* 只告诉玩家有 0.1% 隐藏款，不剧透是哪条鱼。
         * 原来用 Math.round(rate*100)，0.1% 会被显示成 0%，所以改成保留一位小数。 */
        secretRate: secretRate,
        secretHint: secretRate > 0
            ? (+(secretRate * 100).toFixed(1)) + '% 隐藏款' : '',
        locked: locked,
        full: full,
        need: locked ? eggUnlockAt(rarity) : 0,
        affordable: affordable,
        disabled: locked || full || !affordable,
        label: locked ? '未解锁' : full ? '鱼位满' : price >= 10000 ? wallet.format(price) : String(price)
    };
}

/* 三档卵，固定的先后顺序 */
function eggList(state) {
    var out = [];
    for (var i = 0; i < RARITY_LIST.length; i++) out.push(eggStatusOf(state, RARITY_LIST[i]));
    return out;
}

/* 在该品质池里抽一条：先判彩蛋，再按权重抽常规鱼。
 * 彩蛋用独立概率，不受 drawWeight 总和变化影响 —— 想调 1% 就改 eggRate。 */
function rollInRarity(rarity) {
    if (isLegend(rarity)) {
        var L = legendCfg();
        /* 传奇卵的主产出 + 第二档（金鲤鱼）：先判 bonus，剩下都是主鱼 */
        if (L.bonus && L.bonus.speciesId && Math.random() < (L.bonus.rate || 0)) {
            return fishLib.speciesById(L.bonus.speciesId);
        }
        return fishLib.speciesById(L.speciesId);
    }
    var secrets = secretPool(rarity);
    for (var s = 0; s < secrets.length; s++) {
        if (Math.random() < secrets[s].eggRate) return secrets[s];
    }

    var pool = rarityPool(rarity);
    if (!pool.list.length) return fishLib.speciesById(cfg.species[0].id);
    var r = Math.random() * pool.total;
    var acc = 0;
    for (var i = 0; i < pool.list.length; i++) {
        acc += pool.list[i].drawWeight || 1;
        if (r <= acc) return pool.list[i];
    }
    return pool.list[pool.list.length - 1];
}

/**
 * 买一颗卵：付该品质的钱，随机得到该品质里的一条鱼。
 * 返回 { ok, reason, species, price, need, tank }
 * reason: 'locked' | 'full' | 'poor' | 'unknown' | ''
 */
function buyEgg(state, rarity) {
    if (RARITY_LIST.indexOf(rarity) < 0) return { ok: false, reason: 'unknown' };

    var st = eggStatusOf(state, rarity);

/* ============================================================
 * core/dragon.js · 金鲤鱼吞噬进化（M14）
 *
 * 规则（玩家侧一句话能说清）：
 *   带「龙鳞」词条的金鲤鱼，可以吃掉另一条金鲤鱼，升一阶。
 *   金鲤鱼 → 金纹鲤 → 蛟 → 真龙，吃完第三条就是龙。
 *
 * 为什么允许吃仓库里的鱼：
 *   金鲤鱼只从传奇鱼卵 10% 出，攒 4 条本来就很贵。
 *   如果只能吃缸里的，玩家还得先把鱼一条条放进本来就紧张的鱼位，
 *   等于给一条已经很长的链再加一道手续。
 *   所以吞噬优先吃仓库（不占鱼位、也不心疼），仓库没有才吃缸里的。
 *
 * 吃掉谁：同种、还没进化过（evo 0）的金鲤鱼，优先「成长最低」的那条。
 * 不做二次确认弹窗 —— 吞噬本身就是玩家主动点的按钮，
 * 而且只吃 evo 0 的同族，不会误吃已经养大的进化体。
 *
 * 这里只改数据，不碰 canvas / wx。
 * ============================================================ */

var fishLib = require('./fish.js');

var KOI = 'gold_koi';
var KEY_TRAIT = 'dragon_scale';

function inTank(state, fishId) {
    var act = state.activeTank || 0;
    for (var i = 0; i < state.fish.length; i++) {
        var f = state.fish[i];
        if (f.id === fishId && (f.tank || 0) === act) return f;
    }
    return null;
}

function specOf(f) {
    return fishLib.speciesById(f.speciesId);
}

/** 这条鱼是不是「能进化的金鲤鱼」（带龙鳞 + 还没到顶阶） */
function isDragonLine(f) {
    if (!f || f.speciesId !== KOI) return false;
    return fishLib.hasTrait(f, KEY_TRAIT);
}

/** 还能不能继续吞（带龙鳞且没到顶） */
function canGrow(f) {
    if (!isDragonLine(f)) return false;
    return fishLib.evoOf(f) < fishLib.maxEvoOf(specOf(f));
}

/**
 * 可吞噬的猎物：缸内 + 仓库里所有 evo 0 的金鲤鱼（排除自己）。
 * 排序：仓库优先（不占鱼位）→ 成长从低到高（先吃最弱的）。
 */
function preyListOf(state, fishId) {
    var out = [];
    var i;
    var act = state.activeTank || 0;

    var caught = state.caught || [];
    for (i = 0; i < caught.length; i++) {
        var cf = caught[i];
        if (!cf || cf.speciesId !== KOI) continue;
        if (cf.id === fishId) continue;
        if (fishLib.evoOf(cf) > 0) continue;
        out.push({ fish: cf, where: 'caught' });
    }

    for (i = 0; i < state.fish.length; i++) {
        var f = state.fish[i];
        if (!f || (f.tank || 0) !== act) continue;
        if (f.id === fishId) continue;
        if (f.speciesId !== KOI) continue;
        if (fishLib.evoOf(f) > 0) continue;
        out.push({ fish: f, where: 'tank' });
    }

    out.sort(function (a, b) {
        /* 仓库的排前面：吃仓库里的不动鱼位，玩家更省心 */
        if (a.where !== b.where) return a.where === 'caught' ? -1 : 1;
        return (a.fish.growth || 0) - (b.fish.growth || 0);
    });
    return out;
}

/**
 * 当前状态：能不能吞、还差几条、下一阶叫什么。
 * UI 用它决定按钮文案与是否可点，不在渲染层重算规则。
 */
function statusOf(state, fishId) {
    var f = inTank(state, fishId);
    if (!f) return { ok: false, reason: 'gone' };
    if (f.speciesId !== KOI) return { ok: false, reason: 'not_koi' };
    if (!fishLib.hasTrait(f, KEY_TRAIT)) return { ok: false, reason: 'no_scale' };

    var sp = specOf(f);
    var max = fishLib.maxEvoOf(sp);
    var evo = fishLib.evoOf(f);
    if (evo >= max) {
        return {
            ok: false, reason: 'max', evo: evo, max: max,
            stage: fishLib.evoStageName(f),
            prey: 0
        };
    }

    var prey = preyListOf(state, fishId);
    var nextStage = (sp.evo.stages[evo + 1] || {}).name || '';
    return {
        ok: prey.length > 0,
        reason: prey.length ? '' : 'no_prey',
        evo: evo,
        max: max,
        stage: fishLib.evoStageName(f),
        nextStage: nextStage,
        prey: prey.length,
        /* 每条升一阶，所以「还差几条」= 剩余阶数 */
        need: max - evo
    };
}

/**
 * 吞一条同族。
 * 返回 { ok, evo, stage, becameDragon, preyName, eaten, need }
 */
function devour(state, fishId) {
    var st = statusOf(state, fishId);
    if (!st.ok) return st;

    var f = inTank(state, fishId);
    var list = preyListOf(state, fishId);
    var pick = list[0];
    if (!pick) return { ok: false, reason: 'no_prey' };

    var prey = pick.fish;
    var preyName = fishLib.speciesById(prey.speciesId).name;

    /* 从所在位置移除：仓库 splice caught，缸里 splice fish */
    if (pick.where === 'caught') {
        var ci = state.caught.indexOf(prey);
        if (ci >= 0) state.caught.splice(ci, 1);
    } else {
        var fi = state.fish.indexOf(prey);
        if (fi >= 0) state.fish.splice(fi, 1);
        /* 被吃的那条如果正被选中，顺手清掉选中态 */
        if (state.view && state.view.selFish === prey.id) state.view.selFish = '';
    }

    var max = fishLib.maxEvoOf(specOf(f));
    f.evo = Math.min(max, fishLib.evoOf(f) + 1);
    /* 吃一条鱼等于饱餐一顿：避免进化完立刻饿着 */
    f.hunger = Math.min(100, (f.hunger || 0) + 20);

    state.stats.devoured = (state.stats.devoured || 0) + 1;

    return {
        ok: true,
        evo: f.evo,
        max: max,
        stage: fishLib.evoStageName(f),
        becameDragon: f.evo >= max,
        preyName: preyName,
        eaten: 1,
        need: Math.max(0, max - f.evo)
    };
}

module.exports = {
    KEY_TRAIT: KEY_TRAIT,
    KOI: KOI,
    isDragonLine: isDragonLine,
    canGrow: canGrow,
    preyListOf: preyListOf,
    statusOf: statusOf,
    devour: devour
};

  };

        var px = cx + Math.cos(ang) * rad;
        var py = cy + Math.sin(ang) * rad;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if (ink) {
        ctx.strokeStyle = ink;
        ctx.lineWidth = 1.2;
        ctx.stroke();
    }
}

/* 背景星星：固定位置，不闪，避免整页闪瞎 */
function drawStars(ctx, top, t) {
    var pts = [
        [0.10, 0.10, 5], [0.22, 0.05, 3], [0.36, 0.13, 4], [0.52, 0.06, 3],
        [0.66, 0.11, 5], [0.80, 0.05, 3], [0.92, 0.14, 4], [0.06, 0.55, 3],
        [0.95, 0.62, 4], [0.15, 0.86, 3], [0.86, 0.90, 4]
    ];
    var area = H - top;
    for (var i = 0; i < pts.length; i++) {
        var p = pts[i];
        var twinkle = 0.72 + 0.28 * Math.sin((t || 0) * 1.6 + i * 1.3);
        ctx.globalAlpha = 0.30 * twinkle;
        star(ctx, W * p[0], top + area * p[1], p[2], '#e8d4a0', null);
    }
    ctx.globalAlpha = 1;
}

/* ---------------- 图鉴格子 ---------------- */
function drawCard(ctx, item, r, t, ease) {
    var sp = item.sp;
    var rank = rankOf(sp);
    var found = item.found;

    /* 卡片底板 */
    if (found) {
        Th.jelly(ctx, r.x, r.y, r.w, r.h, {
            top: CARD_TOP, bottom: CARD_BOTTOM,
            deep: 'rgba(6,10,24,0.5)',
            r: 16, depth: 3, ink: 'rgba(200,164,92,0.6)', lw: 2
        });
    } else {
        Th.jelly(ctx, r.x, r.y, r.w, r.h, {
            top: '#1e2740', bottom: '#182035',
            deep: 'rgba(6,10,24,0.4)',
            r: 16, depth: 2, ink: 'rgba(200,164,92,0.3)', lw: 1.6, gloss: false
        });
    }

    /* 缩略图圆框 */
    var box = L.codexThumbRect(r);
    ctx.save();
    ctx.beginPath();
    ctx.arc(box.cx, box.cy, box.r, 0, Math.PI * 2);
    ctx.fillStyle = found ? '#141d33' : '#111828';
    ctx.fill();
    ctx.strokeStyle = found ? rank.ink : 'rgba(200,164,92,0.3)';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.clip();

    if (found) {
        ctx.globalAlpha = ease;
        art.drawThumb(ctx, sp.id, box.cx - box.r, box.cy - box.r, box.r * 2, box.r * 2, {
            t: t || 0, phase: item.index * 1.7
        });
        ctx.globalAlpha = 1;
    } else {
        /* 未发现：灰鱼剪影 + 问号 */
        ctx.globalAlpha = 0.22;
        art.drawThumb(ctx, sp.id, box.cx - box.r, box.cy - box.r, box.r * 2, box.r * 2, {
            t: 0, phase: 0
        });
        ctx.globalAlpha = 1;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        Th.textOutlined(ctx, '?', box.cx, box.cy + 1, 26, '#e8d4a0', '#1a1526', 3);
    }
    ctx.restore();

    /* 文字区 */
    var tx = r.x + 10 + box.r * 2 + 10;
    var tw = r.x + r.w - tx - 10;

    /* 编号 */
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '700 10px sans-serif';
    ctx.fillStyle = TEXT_SOFT;
    ctx.fillText('NO.' + (item.index < 10 ? '0' : '') + item.index, tx, r.y + 15);

    /* 名字：未发现打码，隐藏款发现后才露出 */
    ctx.font = '800 15px sans-serif';
    if (found) {
        Th.textOutlined(ctx, U.fitText(ctx, sp.name, tw), tx, r.y + 35, 15, TEXT, '#141d33', 3);
    } else {
        ctx.fillStyle = '#7a6e50';
        ctx.fillText('???', tx, r.y + 35);
    }

    /* 稀有度：色条 + 星数 */
    var barY = r.y + 50;
    rr(ctx, tx, barY, 46, 16, 8);
    ctx.fillStyle = found ? rank.fill : '#222b44';
    ctx.fill();
    ctx.fillStyle = found ? rank.ink : '#6f6448';
    ctx.font = '800 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(found ? starString(rank.star) : '???', tx + 23, barY + 8.5);

    /* 已获得次数：紧贴稀有度条右侧 */
    ctx.textAlign = 'left';
    ctx.font = '600 10.5px sans-serif';
    ctx.fillStyle = found ? TEXT_SOFT : '#6f6448';
    var tail = found ? '×' + item.count : (sp.secret ? '隐藏' : '');
    ctx.fillText(tail, tx + 54, barY + 8.5);

    /* 底行：发现才公开身价，未发现给一句提示 */
    ctx.font = '700 11px sans-serif';
    ctx.fillStyle = found ? '#e0c170' : '#6f6448';
    var bottom = found
        ? '成鱼 ' + wallet.format(Math.round(item.price))
        : (sp.secret ? '神秘彩蛋' : '待发现');
    ctx.fillText(U.fitText(ctx, bottom, tw), tx, r.y + 71);
}

function starString(n) {
    var s = '';
    for (var i = 0; i < n; i++) s += '★';
    return s;
}

/* ---------------- 图鉴主页 ---------------- */
function drawGrid(ctx, state, ease) {
    var t = state.t || 0;
    var list = codex.list(state);
    for (var i = 0; i < list.length; i++) {
        var r = L.codexRect(i, ease);
        drawCard(ctx, list[i], r, t, ease);
    }
}

/* ---------------- 详情浮层 ---------------- */
function drawDetail(ctx, state, session, ease) {
    var idx = session.codexDetail;
    if (idx == null) return;
    var list = codex.list(state);
    var item = list[idx];
    if (!item) return;
    var sp = item.sp;
    var rank = rankOf(sp);

    ctx.save();
    ctx.globalAlpha = ease;
    ctx.fillStyle = 'rgba(6,10,24,0.72)';
    ctx.fillRect(0, 0, W, H);

    var d = L.codexDetailRect(ease);
    Th.jelly(ctx, d.x, d.y, d.w, d.h, {
        top: '#263150', bottom: '#161f38',
        deep: 'rgba(6,10,24,0.7)', r: 20, depth: 5,
        ink: INK, lw: 2.6
    });

    /* 顶部色带 */
    ctx.save();
    rr(ctx, d.x, d.y, d.w, 54, 20);
    ctx.fillStyle = foundFill(item, rank);
    ctx.fill();
    ctx.restore();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    Th.textOutlined(ctx, item.found ? sp.name : '???', d.x + d.w / 2, d.y + 30, 20,
        '#fff3d2', foundInk(item, rank), 3);

    /* 大图 */
    var box = L.codexDetailThumb(d);
    ctx.save();
    ctx.beginPath();
    ctx.arc(box.cx, box.cy, box.r, 0, Math.PI * 2);
    ctx.fillStyle = '#141d33';
    ctx.fill();
    ctx.clip();
    if (item.found) {
        art.drawThumb(ctx, sp.id, box.cx - box.r, box.cy - box.r, box.r * 2, box.r * 2, {
            t: state.t || 0, phase: idx * 1.7
        });
    } else {
        ctx.globalAlpha = 0.2;
        art.drawThumb(ctx, sp.id, box.cx - box.r, box.cy - box.r, box.r * 2, box.r * 2, { t: 0 });
        ctx.globalAlpha = 1;
        Th.textOutlined(ctx, '?', box.cx, box.cy + 1, 34, '#e8d4a0', '#1a1526', 4);
    }
    ctx.restore();

    /* 资料行 */
    var lines = item.found ? [
        ['稀有度', item.sp.secret ? '隐藏款' : item.sp.rarity + ' · ' + starString(rank.star)],
        ['成鱼身价', wallet.format(Math.round(item.price)) + ' 鱼币'],
        ['成熟时间', Math.round(item.mature / 60) + ' 分钟'],
        ['获得途径', item.source],
        ['累计收集', item.count + ' 条']
    ] : [
        ['稀有度', '???'],
        ['获得途径', item.sp.secret ? '隐藏款 · 继续探索' : item.source],
        ['提示', '开出这条鱼后自动解锁']
    ];

    var ly = d.y + 96;
    var labelW = 62;
    /* 前两行右侧有鱼图，值最多写到鱼图左边；后几行可以放宽 */
    var valueMaxWide = d.w - labelW - 48;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < lines.length; i++) {
        var rowY = ly + i * 26;
        /* 隔行淡底，像图鉴的资料表格 */
        if (i % 2 === 0) {
            rr(ctx, d.x + 16, rowY - 12, d.w - 32, 24, 8);
            ctx.fillStyle = 'rgba(200,164,92,0.10)';
            ctx.fill();
        }
        ctx.font = '700 12px sans-serif';
        ctx.fillStyle = TEXT_SOFT;
        ctx.fillText(lines[i][0], d.x + 26, rowY);
        ctx.font = '600 12px sans-serif';
        ctx.fillStyle = TEXT;
        /* 鱼图占右上角 y≈90~174，这几行把值限制在鱼图左侧 */
        var maxW = (i < 3) ? (d.w - labelW - 130) : valueMaxWide;
        ctx.fillText(U.fitText(ctx, lines[i][1], maxW), d.x + 26 + labelW, rowY);
    }

    /* 描述 */
    if (item.found && sp.desc) {
        ctx.font = '600 11px sans-serif';
        ctx.fillStyle = TEXT_SOFT;
        ctx.fillText(U.fitText(ctx, sp.desc, d.w - 48), d.x + 24, d.y + d.h - 62);
    }

    /* 关闭按钮 */
    var cr = L.codexDetailClose(d);
    Th.jelly(ctx, cr.x, cr.y, cr.w, cr.h, {
        top: '#2a3352', bottom: '#1a2340', deep: 'rgba(6,10,24,0.6)',
        r: cr.w / 2, depth: 2, ink: INK, lw: 2, gloss: false
    });
    ctx.textAlign = 'center';
    ctx.font = '800 18px sans-serif';
    ctx.fillStyle = TT.goldLight;
    ctx.fillText('×', cr.x + cr.w / 2, cr.y + cr.h / 2 + 1);

    ctx.restore();
}

function foundFill(item, rank) {
    if (!item.found) return '#2a3450';
    return rank.fill;
}
function foundInk(item, rank) {
    if (!item.found) return '#6f6448';
    return rank.ink;
}

/* ---------------- 入口 ---------------- */
function draw(ctx, state, session) {
    var ease = session.sheetEase;
    if (ease <= 0.001) return;
    var top = L.sheetTop(ease);

    ctx.save();
    ctx.globalAlpha = ease;

    /* 背景由 sheet.js 统一铺（蓝底），这里只画星星点缀。
     * 星星避开顶部标题/页签区（top + 96 以下）。 */
    drawStars(ctx, top + 96, state.t || 0);

    /* 收集进度条 */
    var pg = codex.progress(state);
    var bar = L.codexProgressRect(ease);
    rr(ctx, bar.x, bar.y, bar.w, bar.h, bar.h / 2);
    ctx.fillStyle = 'rgba(6,10,24,0.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(200,164,92,0.45)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    var fillW = (bar.w - 96) * pg.percent;
    if (fillW > 0) {
        rr(ctx, bar.x + 3, bar.y + 3, Math.max(bar.h - 6, fillW), bar.h - 6, (bar.h - 6) / 2);
        ctx.fillStyle = '#c8a45c';
        ctx.fill();
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '800 12px sans-serif';
    ctx.fillStyle = TEXT;
    ctx.fillText('收集进度', bar.x + 10, bar.y + bar.h / 2 + 1);
    ctx.textAlign = 'right';
    ctx.fillText(pg.found + ' / ' + pg.total, bar.x + bar.w - 10, bar.y + bar.h / 2 + 1);

    drawGrid(ctx, state, ease);
    ctx.restore();

    drawDetail(ctx, state, session, ease);
}

module.exports = {
    draw: draw,
    rankOf: rankOf
};

  defs["render/breed.js"] = function (module, exports, require) {
/* ============================================================
 * render/breed.js · 繁育浮层（M12）
 *
 * 为什么是浮层而不是第 6 个页签：页签已经 5 个、宽度见底（68px），
 * 再塞一个就装不下四个字。繁育是「偶尔进来做一次」的操作，
 * 用一个盖在仓库页上的全屏卡片更合适，也方便把 6 格培育缸排开。
 *
 * 卡内信息层级：
 *   孵化槽（结果）→ 亲本槽（输入）→ 消耗预览 → 繁育按钮 → 培育缸（产物）
 * 玩家从上往下读一遍就知道「还差什么」，不用来回翻页。
 * ============================================================ */

var C = require('./canvas.js');
var L = require('../ui/layout.js');
var cfg = require('../config/index.js');
var fishLib = require('../core/fish.js');
var breed = require('../core/breed.js');
var wallet = require('../core/wallet.js');
var art = require('./fishart.js');
var Th = require('./theme.js');
var TT = Th.T;

var W = C.W;
var H = C.H;

function rr(ctx, x, y, w, h, r) {
    var rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.lineTo(x + w - rad, y);
    ctx.arcTo(x + w, y, x + w, y + rad, rad);
    ctx.lineTo(x + w, y + h - rad);
    ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
    ctx.lineTo(x + rad, y + h);
    ctx.arcTo(x, y + h, x, y + h - rad, rad);
    ctx.lineTo(x, y + rad);
    ctx.arcTo(x, y, x + rad, y, rad);

    ctx.font = '600 9.5px sans-serif';
    ctx.fillStyle = TT.textSoft;
    ctx.fillText(sp.rarity + ' · Σlv ' + fishLib.traitSumOf(f), r.x + 70, r.y + 50);

    ctx.font = '600 9.5px sans-serif';
    if (fatigue > 0) {
        ctx.fillStyle = '#e8a98e';
        ctx.fillText('疲劳 ' + clock(fatigue), r.x + 58, r.y + 66);
    } else {
        ctx.fillStyle = TT.textSoft;
        ctx.fillText('成长 ' + Math.round(f.growth) + '% · 卖 ' + wallet.format(fishLib.sellPriceOf(f, state.shellLv)),
            r.x + 58, r.y + 66);
    }

    /* 词条小条：最多两条，放得下就画 */
    var traits = f.traits || [];
    for (var i = 0; i < traits.length && i < 2; i++) {
        var def = fishLib.traitDef(traits[i].id);
        if (!def) continue;
        var lv = fishLib.traitLvOf(traits[i]);
        var tx = r.x + 58 + i * 54;
        var ty = r.y + r.h - 14;
        rr(ctx, tx, ty - 7, 50, 14, 7);
        ctx.fillStyle = (cfg.traits.lvBg || [])[lv] || 'rgba(200,164,92,0.14)';
        ctx.fill();
        ctx.textAlign = 'center';
        ctx.font = '700 9px sans-serif';
        ctx.fillStyle = (cfg.traits.lvColor || [])[lv] || TT.gold;
        ctx.fillText(def.name + ' L' + lv, tx + 25, ty);
    }
}

/* ---------------- 预览 + 繁育按钮 ---------------- */

function drawPreview(ctx, state, session, c, chk) {
    var r = L.breedPreviewRect();
    rr(ctx, r.x, r.y, r.w, r.h, 10);
    ctx.fillStyle = 'rgba(10,18,36,0.42)';
    ctx.fill();

    ctx.textBaseline = 'middle';

    if (!chk.ok) {
        ctx.textAlign = 'left';
        ctx.font = '700 11px sans-serif';
        ctx.fillStyle = '#e8a98e';
        ctx.fillText(chk.text || '还不能繁育', r.x + 12, r.y + r.h / 2);
        return;
    }

    var sp = chk.species;
    var slots = fishLib.traitSlotsOf(sp);
    var maxLv = fishLib.traitMaxLvOf(sp);

    ctx.textAlign = 'left';
    ctx.font = '800 11.5px sans-serif';
    ctx.fillStyle = TT.goldLight;
    ctx.fillText('预计 ' + sp.name, r.x + 12, r.y + r.h / 2);

    ctx.font = '600 10.5px sans-serif';
    ctx.fillStyle = TT.textSoft;
    ctx.fillText(slots + ' 槽 · 上限 L' + maxLv + ' · ' + chk.seconds + 's', r.x + 12 + 74, r.y + r.h / 2);

    /* 右端消耗 */
    var coinTxt = chk.cost.coin > 0 ? wallet.format(chk.cost.coin) : '免费';
    ctx.textAlign = 'right';
    ctx.font = '700 10.5px sans-serif';
    ctx.fillStyle = chk.cost.coin > 0 ? TT.goldLight : TT.textSoft;
    ctx.fillText(coinTxt + ' · 鱼饵×' + chk.cost.bait, r.x + r.w - 12, r.y + r.h / 2);
}

function drawGo(ctx, session, c, chk) {
    var r = L.breedGoRect();
    var on = chk.ok;

    Th.jelly(ctx, r.x, r.y, r.w, r.h, {
        top: on ? '#e0c170' : '#2a3352',
        bottom: on ? '#a8802f' : '#1a2340',
        deep: on ? '#7d5c18' : TT.cardDeep,
        r: 18, depth: on ? 4 : 2,
        ink: on ? '#6f5220' : 'rgba(200,164,92,0.24)',
        lw: 2.2, gloss: on
    });

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 14px sans-serif';
    ctx.fillStyle = on ? '#fff3d2' : 'rgba(232,212,160,0.4)';
    ctx.fillText(on ? '开始繁育' : (chk.text || '还不能繁育'), r.x + r.w / 2, r.y + r.h / 2 + 0.5);
}

/* ---------------- 培育缸 ---------------- */

function drawNursery(ctx, state, session, c) {
    var slots = breed.nurserySlotsOf(state);
    var list = breed.nurseryList(state);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '700 11px sans-serif';
    ctx.fillStyle = TT.textSoft;
    ctx.fillText('培育缸 ' + list.length + '/' + slots, c.x + 14, c.y + L.BR_NURSERY_LABEL_Y);

    ctx.textAlign = 'right';
    ctx.font = '600 9.5px sans-serif';
    ctx.fillStyle = 'rgba(232,212,160,0.42)';
    ctx.fillText('子代落点 · 点开看词条', c.x + c.w - 14, c.y + L.BR_NURSERY_LABEL_Y);

    for (var i = 0; i < slots; i++) {
        var r = L.nurseryCellRect(i);
        var cell = list[i];

        if (!cell) {
            rr(ctx, r.x, r.y, r.w, r.h, 12);
            ctx.strokeStyle = 'rgba(200,164,92,0.16)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            continue;
        }

        Th.card(ctx, r.x, r.y, r.w, r.h, { r: 12, depth: 2 });

        art.drawThumb(ctx, cell.species.id, r.x + 4, r.y + 3, r.w - 8, 42, {
            t: state.t, phase: i * 1.1
        });

        /* 性别角标 */
        var bx = r.x + r.w - 13;
        var by = r.y + 12;
        ctx.beginPath();
        ctx.arc(bx, by, 7, 0, 6.2832);
        ctx.fillStyle = sexColor(cell.fish.sex);
        ctx.fill();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '700 8.5px sans-serif';
        ctx.fillStyle = '#fff6ea';
        ctx.fillText(sexMark(cell.fish.sex), bx, by + 0.5);

        ctx.textAlign = 'center';
        ctx.font = '700 9.5px sans-serif';
        ctx.fillStyle = TT.textSoft;
        ctx.fillText(cell.growth + '% · Σ' + fishLib.traitSumOf(cell.fish), r.x + r.w / 2, r.y + r.h - 20);

        ctx.font = '800 11px sans-serif';
        ctx.fillStyle = TT.goldLight;
        ctx.fillText(wallet.format(cell.price), r.x + r.w / 2, r.y + r.h - 7);
    }
}

/* ---------------- 选亲本浮层 ---------------- */

function drawPicker(ctx, state, session) {
    var want = session.breedPick === 'mother' ? 'f' : 'm';
    var otherId = session.breedPick === 'mother' ? session.breedFather : session.breedMother;

    var all = breed.candidatesOf(state);
    var pool = [];
    for (var i = 0; i < all.length; i++) {
        var f = all[i].fish;
        if (f.sex !== want) continue;
        if (f.id === otherId) continue;
        pool.push(all[i]);
    }

    /* 卡片高度跟候选条数走 */
    var c = L.pickCardRect(Math.max(1, Math.min(6, pool.length)));

    drawMask(ctx);
    drawCard(ctx, c);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '800 15px sans-serif';
    ctx.fillStyle = TT.goldLight;
    ctx.fillText(want === 'f' ? '选雌鱼（定鱼种）' : '选雄鱼（供词条）', c.x + 16, c.y + 26);

    if (!pool.length) {
        ctx.textAlign = 'center';
        ctx.font = '600 11.5px sans-serif';
        ctx.fillStyle = TT.textSoft;
        ctx.fillText(want === 'f' ? '没有可用的雌鱼 · 去仓库看看' : '没有可用的雄鱼 · 去仓库看看',
            c.x + c.w / 2, c.y + c.h / 2);
        var b = L.pickBtnRect(0, c);
        Th.jelly(ctx, b.x, b.y, b.w * 2 + 10, b.h, {
            top: '#37436a', bottom: '#1f294a', deep: TT.cardDeep,
            r: 16, depth: 3, ink: TT.ink, lw: 2
        });
        Th.textOutlined(ctx, '关闭', b.x + b.w + 5, b.y + b.h / 2, 13, TT.goldLight, '#232c48', 3);
        return;
    }

    var maxShow = 6;
    var n = Math.min(maxShow, pool.length);
    for (var k = 0; k < n; k++) {
        var it = pool[k];
        var fr = L.pickRowRect(k);
        var sp = fishLib.speciesById(it.fish.speciesId);

        Th.card(ctx, fr.x, fr.y, fr.w, fr.h, { r: 12, depth: 2 });

        art.drawThumb(ctx, sp.id, fr.x + 4, fr.y + 3, 40, 40, { t: state.t, phase: k });

        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.font = '800 12px sans-serif';
        ctx.fillStyle = TT.text;
        ctx.fillText(sp.name, fr.x + 52, fr.y + 15);

        ctx.font = '600 9.5px sans-serif';
        ctx.fillStyle = TT.textSoft;
        ctx.fillText(sexMark(it.fish.sex) + ' · ' + sp.rarity + ' · Σlv ' + fishLib.traitSumOf(it.fish) +
            ' · ' + (it.zone === 'tank' ? '缸内' : '仓库'), fr.x + 52, fr.y + 31);

        /* 右端：疲劳或卖价 */
        ctx.textAlign = 'right';
        ctx.font = '700 10px sans-serif';
        if (it.fatigue > 0) {
            ctx.fillStyle = '#e8a98e';
            ctx.fillText('疲劳 ' + clock(it.fatigue), fr.x + fr.w - 10, fr.y + fr.h / 2);
        } else {
            ctx.fillStyle = TT.goldLight;
            ctx.fillText(wallet.format(fishLib.sellPriceOf(it.fish, state.shellLv)),
                fr.x + fr.w - 10, fr.y + fr.h / 2);
        }
    }

    if (pool.length > maxShow) {
        ctx.textAlign = 'center';
        ctx.font = '600 9.5px sans-serif';
        ctx.fillStyle = 'rgba(232,212,160,0.5)';
        ctx.fillText('还有 ' + (pool.length - maxShow) + ' 条未显示', c.x + c.w / 2,
            L.pickRowRect(n - 1).y + 58);
    }

    ctx.textAlign = 'center';
    ctx.font = '600 10px sans-serif';
    ctx.fillStyle = 'rgba(232,212,160,0.46)';
    ctx.fillText('Σlv 越高越值钱 · 同种繁育升级率 33%', c.x + c.w / 2, c.y + c.h - 78);

    /* 底部关闭 */
    var b = L.pickBtnRect(0, c);
    Th.jelly(ctx, b.x, b.y, b.w * 2 + 10, b.h, {
        top: '#37436a', bottom: '#1f294a', deep: TT.cardDeep,
        r: 16, depth: 3, ink: TT.ink, lw: 2
    });
    Th.textOutlined(ctx, '取消', b.x + b.w + 5, b.y + b.h / 2, 13, TT.goldLight, '#232c48', 3);
}

/* ---------------- 子代详情 ---------------- */

function drawDetail(ctx, state, session) {
    var id = session.nurseryDetail;
    if (!id) return;

    var list = state.nursery || [];
    var f = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) f = list[i];
    if (!f) { session.nurseryDetail = ''; return; }

    var c = L.detailCardRect((f.traits || []).length);
    var sp = fishLib.speciesById(f.speciesId);

    drawMask(ctx);
    drawCard(ctx, c);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '800 15px sans-serif';
    ctx.fillStyle = TT.goldLight;
    ctx.fillText(sp.name, c.x + 16, c.y + 26);

    ctx.font = '800 13px sans-serif';
    ctx.fillStyle = sexColor(f.sex);
    ctx.fillText(sexMark(f.sex), c.x + 16 + ctx.measureText(sp.name).width + 40, c.y + 26);

    ctx.font = '600 10px sans-serif';
    ctx.fillStyle = TT.textSoft;
    ctx.fillText(sp.rarity + ' · ' + fishLib.stageName(fishLib.stageOf(f.growth)) + ' · 成长 ' +
        Math.round(f.growth) + '%', c.x + 16, c.y + 46);

    /* 卖价放在第二行右端：第一行右上是关闭按钮，数字放那儿会被盖住 */
    ctx.textAlign = 'right';
    ctx.font = '800 12.5px sans-serif';
    ctx.fillStyle = TT.goldLight;
    ctx.fillText('卖 ' + wallet.format(fishLib.sellPriceOf(f, state.shellLv)), c.x + c.w - 18, c.y + 47);

    /* 词条列表 */
    var traits = f.traits || [];
    ctx.textAlign = 'left';
    ctx.font = '700 10px sans-serif';
    ctx.fillStyle = TT.textSoft;
    ctx.fillText('词条 ' + traits.length + '/' + fishLib.traitSlotsOf(sp), c.x + 16, c.y + 74);

    for (var k = 0; k < traits.length; k++) {
        var def = fishLib.traitDef(traits[k].id);
        if (!def) continue;
        var lv = fishLib.traitLvOf(traits[k]);
        var ry = c.y + 96 + k * 32;

        rr(ctx, c.x + 16, ry - 11, c.w - 32, 26, 10);
        ctx.fillStyle = (cfg.traits.lvBg || [])[lv] || 'rgba(200,164,92,0.14)';
        ctx.fill();

        /* 等级徽章 */
        rr(ctx, c.x + 22, ry - 8, 30, 20, 8);
        ctx.fillStyle = (cfg.traits.lvColor || [])[lv] || TT.gold;
        ctx.globalAlpha = 0.24;
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 10.5px sans-serif';
        ctx.fillStyle = (cfg.traits.lvColor || [])[lv] || TT.gold;
        ctx.fillText('L' + lv, c.x + 37, ry + 2);

        ctx.textAlign = 'left';
        ctx.font = '800 11.5px sans-serif';
        ctx.fillStyle = TT.text;
        ctx.fillText(def.name, c.x + 58, ry + 2);

        ctx.textAlign = 'right';
        ctx.font = '600 10.5px sans-serif';
        ctx.fillStyle = TT.textSoft;
        ctx.fillText(fishLib.traitText(traits[k]), c.x + c.w - 22, ry + 2);
    }

    /* 规则说明：放在词条和按钮之间，既不空也顺手教一遍规则 */
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '600 10px sans-serif';
    ctx.fillStyle = 'rgba(232,212,160,0.46)';
    ctx.fillText('子代鱼种跟随雌鱼 · 性别 50/50 · L5 只能靠繁育', c.x + 16, c.y + c.h - 78);

    /* 两个动作 */
    var b0 = L.pickBtnRect(0, c);
    var b1 = L.pickBtnRect(1, c);

    Th.jelly(ctx, b0.x, b0.y, b0.w, b0.h, {
        top: TT.greenTop, bottom: TT.greenBottom, deep: TT.greenDeep,
        r: 16, depth: 3, ink: '#2f6b45', lw: 2
    });
    Th.textOutlined(ctx, '放入鱼缸', b0.x + b0.w / 2, b0.y + b0.h / 2, 13, '#eafff2', '#2f6b45', 3);

    Th.jelly(ctx, b1.x, b1.y, b1.w, b1.h, {
        top: TT.yellowTop, bottom: TT.yellowBottom, deep: TT.yellowDeep,
        r: 16, depth: 3, ink: '#5f1e18', lw: 2
    });
    Th.textOutlined(ctx, '卖掉 +' + wallet.format(fishLib.sellPriceOf(f, state.shellLv)),
        b1.x + b1.w / 2, b1.y + b1.h / 2, 12.5, '#fff3d2', '#5f1e18', 3);

    /* 关闭：右上角小 ✕ */
    var xr = { x: c.x + c.w - 38, y: c.y + 10, w: 28, h: 28 };
    Th.badge(ctx, xr.x + xr.w / 2, xr.y + xr.h / 2, 14, {
        top: '#37436a', bottom: '#1f294a', ink: TT.ink, lw: 2
    });
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 13px sans-serif';
    ctx.fillStyle = TT.goldLight;
    ctx.fillText('✕', xr.x + xr.w / 2, xr.y + xr.h / 2);
}

/* ---------------- 入口 ---------------- */

function draw(ctx, state, session) {
    if (!session.breedOpen) return;

    var c = L.breedCardRect();
    drawMask(ctx);
    drawCard(ctx, c);
    drawHeader(ctx, c);

    drawHatch(ctx, state, session, c);
    drawParentSlot(ctx, state, session, 0, session.breedMother);
    drawParentSlot(ctx, state, session, 1, session.breedFather);

    var chk = breed.canBreed(state, session.breedMother, session.breedFather);
    drawPreview(ctx, state, session, c, chk);
    drawGo(ctx, session, c, chk);
    drawNursery(ctx, state, session, c);

    if (session.breedPick) drawPicker(ctx, state, session);
    if (session.nurseryDetail) drawDetail(ctx, state, session);
}

    draw: draw,

    /* 仓库「鱼卵」子页也要画同一颗蛋，别在那边再抄一份路径 */
    drawEgg: drawEgg,
    clock: clock
};
