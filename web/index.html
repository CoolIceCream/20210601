        if (st.disabled) {
            Th.jelly(ctx, br.x, br.y, br.w, 38, {
                top: TT.greyTop, bottom: TT.greyBottom, deep: TT.greyDeep,
                r: 12, depth: 2.5, ink: 'rgba(200,164,92,0.3)', lw: 2, gloss: false
            });
        } else {
            Th.jelly(ctx, br.x, br.y, br.w, 38, {
                top: TT.yellowTop, bottom: TT.yellowBottom, deep: TT.yellowDeep,
                r: 12, depth: 3, ink: '#5f1e18', lw: 2.4
            });
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 14px sans-serif';
        ctx.fillStyle = st.disabled ? TT.textSoft : '#fff3d2';
        ctx.fillText(st.label, br.x + br.w / 2, br.y + 19.5);
    }
}

/* ---------------- 鱼卵页 ---------------- */

/* 四种卵都只写中文名，不再显示 R / SR / SSR 字母角标 */
var EGG_NAME = {
    R: '普通鱼卵',
    SR: '稀有鱼卵',
    SSR: '传说鱼卵',
    LEGEND: '传奇鱼卵'
};

function drawEggs(ctx, state, ease) {
    var list = shop.eggList(state);

    for (var i = 0; i < list.length; i++) {
        var st = list[i];
        var r = L.eggRect(i, ease);

        /* 卡片 */
        if (st.locked) {
            Th.card(ctx, r.x, r.y, r.w, r.h, {
                r: 16, depth: 2.5, top: '#202a44', bottom: '#1a2238',
                deep: 'rgba(6,10,24,0.4)', ink: 'rgba(200,164,92,0.28)', lw: 2
            });
        } else {
            Th.card(ctx, r.x, r.y, r.w, r.h, { r: 16, depth: 2.5 });
        }

        /* 左侧：该档卖价最高的那条鱼当「代言人」 */
        var th = L.eggThumbRect(i, ease);
        ctx.globalAlpha = ease * (st.locked ? 0.30 : 1);
        art.drawThumb(ctx, st.rep.id, th.x, th.y - 1, th.w, th.h + 2, {
            t: state.t || 0,
            phase: i * 1.7
        });
        ctx.globalAlpha = ease;

        var tx = r.x + 78;

        /* 标题：只留中文文字名，不再画 R / SR / SSR 字母角标。
         * 传奇卵用一枚小星点做视觉区分，但同样是图形不是字母。 */
        if (st.rarity === 'LEGEND') {
            ctx.save();
            ctx.translate(tx + 6, r.y + 21);
            ctx.fillStyle = '#f5b822';
            ctx.beginPath();
            for (var k = 0; k < 10; k++) {
                var ang = -Math.PI / 2 + k * Math.PI / 5;
                var rr = k % 2 === 0 ? 8 : 3.4;
                var px = Math.cos(ang) * rr;
                var py = Math.sin(ang) * rr;
                if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#5f1e18';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();
        }

        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.font = '800 15px sans-serif';
        ctx.fillStyle = st.locked ? 'rgba(164,149,110,0.55)' : TT.text;
        ctx.fillText(EGG_NAME[st.rarity] || st.rarity,
            tx + (st.rarity === 'LEGEND' ? 20 : 0), r.y + 26);

        /* 副信息：这一档能开出哪些鱼，以及卖价区间 */
        ctx.font = '600 11px sans-serif';
        ctx.fillStyle = st.locked ? 'rgba(164,149,110,0.5)' : TT.textSoft;
        var sub = st.locked
            ? '需 ' + st.need + ' 条鱼解锁'
            : st.rarity === 'LEGEND'
                ? st.secretHint
                : st.count + ' 种' + (st.secretHint ? ' + ' + st.secretHint : '') +
                  ' · 卖 ' + wallet.format(Math.round(st.minSell)) + '~' +
                  wallet.format(Math.round(st.maxSell));
        ctx.fillText(U.fitText(ctx, sub, r.w - 176), tx, r.y + 48);

        /* 第三行：平均能卖多少，帮助判断值不值 */
        ctx.font = '600 10.5px sans-serif';
        ctx.fillStyle = st.locked ? 'rgba(164,149,110,0.45)' : TT.textSoft;
        var tip = st.locked
            ? '鱼越多解锁越快'
            : st.rarity === 'LEGEND'
                ? '固定价 · 成鱼卖 ' + wallet.format(Math.round(st.avgSell))
                : '平均卖 ' + wallet.format(Math.round(st.avgSell)) + ' · 卵价打 ' +
                  Math.round((st.price / Math.max(1, st.avgSell)) * 100) + ' 折';
        ctx.fillText(U.fitText(ctx, tip, r.w - 176), tx, r.y + 74);

        /* 价格按钮 */
        var b = L.eggBuyRect(i, ease);
        if (st.disabled) {
            Th.jelly(ctx, b.x, b.y, b.w, b.h, {
                top: TT.greyTop, bottom: TT.greyBottom, deep: TT.greyDeep,
                r: 12, depth: 2, ink: 'rgba(200,164,92,0.28)', lw: 1.8, gloss: false
            });
        } else {
            Th.jelly(ctx, b.x, b.y, b.w, b.h, {
                top: TT.yellowTop, bottom: TT.yellowBottom, deep: TT.yellowDeep,
                r: 12, depth: 3, ink: '#5f1e18', lw: 2.2
            });
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 13px sans-serif';
        ctx.fillStyle = st.disabled ? TT.textSoft : '#fff3d2';
        ctx.fillText(st.locked ? '未解锁' : st.full ? '鱼位满' : st.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
    }
}

/* ---------------- 入口 ---------------- */

/* ---------------- 鱼塘页 ---------------- */

function rarityName(r) {
    return r === 'SR' ? '稀有' : r === 'SSR' ? '传说' : r === 'LEGEND' ? '传奇' : '普通';
}

function drawPond(ctx, state, ease) {
    var st = pond.statusOf(state);
    var scene = L.pondSceneRect(ease);
    var t = state.t || 0;

    /* 池塘：圆角裁剪内画水、波纹、荷叶、鱼影 */
    ctx.save();
    roundRect(ctx, scene.x, scene.y, scene.w, scene.h, 18);
    ctx.clip();

    var g = ctx.createLinearGradient(0, scene.y, 0, scene.y + scene.h);
    U.stop(g, 0, '#1b3350');
    U.stop(g, 1, '#0e2038');
    ctx.fillStyle = g;
    ctx.fillRect(scene.x, scene.y, scene.w, scene.h);

    /* 水面波纹：几条缓慢起伏的横线 */
    ctx.strokeStyle = 'rgba(200,220,255,0.14)';
    ctx.lineWidth = 1.6;
    for (var w = 0; w < 4; w++) {
        var wy = scene.y + 30 + w * 44;
        ctx.beginPath();
        for (var x = 0; x <= scene.w; x += 8) {
            var yy = wy + Math.sin(x / scene.w * 9.42 + t * 1.1 + w) * 4;
            if (x === 0) ctx.moveTo(scene.x + x, yy);
            else ctx.lineTo(scene.x + x, yy);
        }
        ctx.stroke();
    }

    /* 荷叶：三片深绿椭圆，大小错开，不宜过大否则盖住水面 */
    var pads = [[0.18, 0.26, 21], [0.78, 0.50, 15], [0.44, 0.79, 13]];
    for (var p = 0; p < pads.length; p++) {
        var px = scene.x + scene.w * pads[p][0];
        var py = scene.y + scene.h * pads[p][1];
        var pr = pads[p][2];
        ctx.beginPath();
        U.ellipse(ctx, px, py, pr, pr * 0.52, -0.15);
        ctx.fillStyle = 'rgba(38,92,66,0.85)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(111,191,158,0.5)';
        ctx.lineWidth = 1.4;
        ctx.stroke();
    }

    /* 鱼影：三条剪影慢慢横穿水面 */
    for (var k = 0; k < 3; k++) {
        var span = scene.w + 80;
        var fx = scene.x - 40 + ((t * (14 + k * 6) + k * 150) % span);
        var fy = scene.y + 56 + k * 36 + Math.sin(t * 1.4 + k) * 5;
        /* 池底本身就深，鱼影要比背景更黑才看得见 */
        ctx.fillStyle = 'rgba(2,6,14,0.62)';
        ctx.beginPath();
        U.ellipse(ctx, fx, fy, 17, 9, 0);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(fx - 15, fy);
        ctx.lineTo(fx - 26, fy - 8);
        ctx.lineTo(fx - 26, fy + 8);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();

    /* 池塘边框 */
    roundRect(ctx, scene.x, scene.y, scene.w, scene.h, 18);
    ctx.strokeStyle = 'rgba(200,164,92,0.5)';
    ctx.lineWidth = 2.4;
    ctx.stroke();

    /* 信息行：塘名 + 可钓鱼种；右侧鱼饵余量 */
    var iy = scene.y + scene.h + 18;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '800 15px sans-serif';
    ctx.fillStyle = TT.goldLight;
    ctx.fillText(st.name, 18, iy);
    ctx.font = '600 11.5px sans-serif';
    ctx.fillStyle = TT.textSoft;
    ctx.fillText('可钓 ' + st.poolCount + ' 种' + rarityName(st.rarity) + '鱼', 18, iy + 21);

    itemArt.draw(ctx, 'bait', W - 84, iy + 2, 22);
    ctx.textAlign = 'right';
    ctx.font = '800 15px sans-serif';
    ctx.fillStyle = st.bait > 0 ? TT.text : '#e0847a';
    ctx.fillText('×' + st.bait, W - 18, iy + 3);

    /* 抛竿按钮 */
    var b = L.pondCastRect(ease);
    var on = st.canCast;
    Th.jelly(ctx, b.x, b.y, b.w, b.h, on ? {
        top: TT.yellowTop, bottom: TT.yellowBottom, deep: TT.yellowDeep,
        r: 18, depth: 4, ink: '#5f1e18', lw: 2.6
    } : {
        top: TT.greyTop, bottom: TT.greyBottom, deep: TT.greyDeep,
        r: 18, depth: 3, ink: 'rgba(200,164,92,0.3)', lw: 2, gloss: false
    });

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 18px sans-serif';
    ctx.fillStyle = on ? '#fff3d2' : TT.textSoft;
    ctx.fillText('抛竿钓鱼', b.x + b.w / 2, b.y + b.h / 2 - 7);
    ctx.font = '600 11px sans-serif';
    ctx.fillStyle = on ? 'rgba(255,243,210,0.78)' : TT.textSoft;
    ctx.fillText(on ? '消耗鱼饵 ×1' : '鱼饵不足 · 去商店买', b.x + b.w / 2, b.y + b.h / 2 + 13);

    /* 概率小字 */
    ctx.font = '600 11px sans-serif';
    ctx.fillStyle = TT.textSoft;
    ctx.fillText('约 ' + Math.round((1 - st.oysterRate) * 100) + '% 出鱼 · ' +
        Math.round(st.oysterRate * 100) + '% 出珍珠贝', b.x + b.w / 2, b.y + b.h + 15);
}

/* ---------------- 仓库页（M15 重排） ----------------
 * 照参考游戏改成「网格 + 底部详情卡」：
 *
 *   子页签行（右端钉着「繁育」）
 *   鱼篓 12/20            [批量] [全选]
 *   ┌──┬──┬──┬──┬──┐
 *   ├──┼──┼──┼──┼──┤
 *   └──┴──┴──┴──┴──┘
 *   ┌──────────────────────────────┐
 *   │ [图] 名字 ♀         ¥ 62,000 │
 *   │      说明两行                │
 *   │      [词条][词条][词条]      │
 *   │      [ 放进鱼缸 ] [ 卖出 ]   │
 *   └──────────────────────────────┘
 *
 * 为什么换成这个结构：
 *   以前 3×3 只有 9 格，钓两次就满；而且每条鱼都要在格子里塞
 *   名字 + 阶段 + 成长 + 价格四行，字挤成一团。现在格子里只留
 *   「图 + 价 + 成长」，详情全搬到下面那张卡里，两边都松快了。
 */

var BAG_SUBS = ['鱼卵', '道具', '鱼'];

/* 道具在网格里的固定顺序；key 同时用作选中标识 */
var PROP_DEFS = [
    { key: 'item:oyster', icon: 'oyster', name: '珍珠贝', bg: '#3a3358', color: '#9a8fc4' },
    { key: 'item:pearl', icon: 'pearl', name: '珍珠', bg: '#2f5a72', color: '#7fc2dc' },
    { key: 'item:bait', icon: 'bait', name: '鱼饵', bg: '#3d5a2f', color: '#9cc47a' }
];

/* ---------------- 小零件 ---------------- */

/* 详情卡里的标签胶囊，返回宽度 */
function chipW(ctx, txt, size) {
    return ctx.measureText(txt).width + (size || 9) * 2;
}

function drawChip(ctx, x, y, txt, color, h) {
    h = h || 16;
    ctx.font = '700 9.5px sans-serif';
    var w = Math.min(96, chipW(ctx, txt, 7));
    roundRect(ctx, x, y, w, h, h / 2);
    ctx.fillStyle = U.hexA(color, 0.20);
    ctx.fill();
    ctx.strokeStyle = U.hexA(color, 0.55);
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(U.fitText(ctx, txt, w - 10), x + w / 2, y + h / 2 + 0.5);
    return w;
}

/* 小金币：格子里价格前的那个圆点 */
function coinDot(ctx, cx, cy, rad) {
    var g = ctx.createRadialGradient(cx - rad * 0.3, cy - rad * 0.4, rad * 0.2, cx, cy, rad);
    U.stop(g, 0, '#ffe9ae');
    U.stop(g, 1, '#c08a2c');
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, 6.2832);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(52,34,8,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
}

/* 格子底：选中是金框，平时是稀有度彩线 + 暗金细框 */
function cellFrame(ctx, r, opt) {
    opt = opt || {};
    if (opt.sel) {
        Th.card(ctx, r.x, r.y, r.w, r.h, {
            r: 12, depth: 2.5,
            top: '#3a2f1e', bottom: '#241c12',
            ink: TT.gold, lw: 2.2
        });
        return;
    }
    Th.card(ctx, r.x, r.y, r.w, r.h, {
        r: 12, depth: 1.6,
        ink: opt.ink || 'rgba(200,164,92,0.20)',
        lw: 1.4
    });
    if (opt.line) {
        roundRect(ctx, r.x + 1.2, r.y + 1.2, r.w - 2.4, r.h - 2.4, 10.8);
        ctx.strokeStyle = opt.line;
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }
}

/* 空格子：只画一圈虚线感的淡框，让网格看得出「还有格子」 */
function emptyCell(ctx, r) {
    roundRect(ctx, r.x, r.y, r.w, r.h, 12);
    ctx.strokeStyle = 'rgba(200,164,92,0.13)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
}

/* 选中角标：批量模式下写序号，单选写一枚小勾 */
function selBadge(ctx, r, n) {
    var bx = r.x + r.w - 11;
    var by = r.y + 11;
    ctx.beginPath();
    ctx.arc(bx, by, 9, 0, 6.2832);
    ctx.fillStyle = TT.gold;
    ctx.fill();
    ctx.strokeStyle = 'rgba(6,10,24,0.6)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#2a2110';
    if (n > 0) {
        ctx.font = '800 10.5px sans-serif';
        ctx.fillText(String(n), bx, by + 0.5);
    } else {
        ctx.font = '800 12px sans-serif';
        ctx.fillText('✓', bx, by + 0.5);
    }
}

/* ---------------- 顶部：子页签 + 容量行 ---------------- */

function drawBagTabs(ctx, session, ease) {
    for (var i = 0; i < BAG_SUBS.length; i++) {
        var r = L.bagTabRect(i, ease);
        var on = (session.bagTab || 0) === i;

        if (on) {
            Th.jelly(ctx, r.x, r.y, r.w, r.h, {
                top: TT.greenTop, bottom: TT.greenBottom, deep: TT.greenDeep,
                r: 14, depth: 2.5, ink: '#6f5220', lw: 2
            });
        } else {
            Th.jelly(ctx, r.x, r.y, r.w, r.h, {
                top: '#2c3858', bottom: '#202a44', deep: TT.cardDeep,
                r: 14, depth: 2.5, ink: 'rgba(200,164,92,0.4)', lw: 1.8, gloss: false
            });
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (on) {
            Th.textOutlined(ctx, BAG_SUBS[i], r.x + r.w / 2, r.y + r.h / 2 + 1, 12.5,
                '#fff3d2', '#4a3610', 3);
        } else {
            ctx.font = '700 12.5px sans-serif';
            ctx.fillStyle = TT.textSoft;
            ctx.fillText(BAG_SUBS[i], r.x + r.w / 2, r.y + r.h / 2 + 1);
        }
    }

    /* 繁育：不在页签里，是「进去做一件事」的入口，所以用朱红区分 */
    var br = L.bagBreedRect(ease);
    Th.jelly(ctx, br.x, br.y, br.w, br.h, {
        top: TT.yellowTop, bottom: TT.yellowBottom, deep: TT.yellowDeep,
        r: 14, depth: 2.5, ink: '#5f1e18', lw: 2
    });
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 12.5px sans-serif';
    ctx.fillStyle = '#fff3d2';
    ctx.fillText('繁育', br.x + br.w / 2, br.y + br.h / 2 + 0.5);
}

/* 容量行：「鱼篓 12/20」+ 批量 / 全选两枚小胶囊 */
function drawBagHeader(ctx, session, ease, capText, total, selCount) {
    var top = L.sheetTop(ease);
    var cy = top + L.BAG_HDR_Y + L.BAG_HDR_H / 2;

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '700 12px sans-serif';
    ctx.fillStyle = TT.textSoft;
    ctx.fillText(capText, 18, cy);

    if (selCount > 0) {
        var w = ctx.measureText(capText).width;
        ctx.font = '800 12px sans-serif';
        ctx.fillStyle = TT.goldLight;
        ctx.fillText(' · 选中 ' + selCount, 18 + w, cy);
    }

    /* 批量开关 */
    var c0 = L.bagChipRect(0, ease);
    var mode = !!session.bagMode;
    Th.jelly(ctx, c0.x, c0.y, c0.w, c0.h, mode ? {
        top: TT.yellowTop, bottom: TT.yellowBottom, deep: TT.yellowDeep,
        r: 11, depth: 2, ink: '#5f1e18', lw: 1.8, gloss: true
    } : {
        top: '#2c3858', bottom: '#202a44', deep: TT.cardDeep,
        r: 11, depth: 2, ink: 'rgba(200,164,92,0.42)', lw: 1.6, gloss: false
    });
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 11px sans-serif';
    ctx.fillStyle = mode ? '#fff3d2' : TT.textSoft;
    ctx.fillText(mode ? '批量中' : '批量', c0.x + c0.w / 2, c0.y + c0.h / 2 + 0.5);

    /* 全选 / 清空：只在有东西可选的时候亮起来 */
    var c1 = L.bagChipRect(1, ease);
    var allOn = total > 0 && selCount >= total;
    var can = total > 0;
    Th.jelly(ctx, c1.x, c1.y, c1.w, c1.h, (allOn || (mode && can)) ? {
        top: TT.greenTop, bottom: TT.greenBottom, deep: TT.greenDeep,
        r: 11, depth: 2, ink: '#6f5220', lw: 1.8, gloss: true
    } : {
        top: '#2c3858', bottom: '#202a44', deep: TT.cardDeep,
        r: 11, depth: 2, ink: 'rgba(200,164,92,0.3)', lw: 1.6, gloss: false
    });
    ctx.font = '800 11px sans-serif';
    ctx.fillStyle = can ? '#fff3d2' : TT.textSoft;
    ctx.fillText(allOn ? '清空' : '全选', c1.x + c1.w / 2, c1.y + c1.h / 2 + 0.5);
}

/* ---------------- 详情卡（三页共用同一套版式） ----------------
 * d = {
 *   draw: function(ctx, box) { … }   左侧 64×64 图标框里的画法
 *   name, sub, price, desc: [行1, 行2]
 *   tags: [{txt, color}]
 *   buttons: [{label, sub, on, kind}]
 * }
 * kind: 'green' 主操作（放缸/使用）· 'red' 卖出 · 'grey' 不可用
 */
function drawBagDetail(ctx, d, ease) {
    var c = L.bagDetailRect(ease);
    Th.card(ctx, c.x, c.y, c.w, c.h, { r: 16, depth: 2.5, ink: 'rgba(200,164,92,0.34)', lw: 1.8 });

    var ib = L.bagDetailIconRect(ease);
    roundRect(ctx, ib.x, ib.y, ib.w, ib.h, 14);
    ctx.fillStyle = 'rgba(10,16,32,0.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(200,164,92,0.3)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    if (d.draw) d.draw(ctx, ib);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    /* 名字 */
    ctx.font = '800 15px sans-serif';
    ctx.fillStyle = TT.text;
    ctx.fillText(U.fitText(ctx, d.name || '', c.w - 90 - 90), c.x + 90, c.y + 26);
    var nw = Math.min(c.w - 90 - 90, ctx.measureText(d.name || '').width);

    if (d.sub) {
        ctx.font = '800 11.5px sans-serif';
        ctx.fillStyle = d.subColor || TT.textSoft;
        ctx.fillText(d.sub, c.x + 90 + nw + 8, c.y + 26);
    }

    /* 单价：右上角，金币 + 数字 */
    if (d.price) {
        ctx.textAlign = 'right';
        ctx.font = '800 15px sans-serif';
        var pw = ctx.measureText(d.price).width;
        ctx.fillStyle = TT.goldLight;
        ctx.fillText(d.price, c.x + c.w - 16, c.y + 26);
        coinDot(ctx, c.x + c.w - 16 - pw - 10, c.y + 26, 6);
        ctx.textAlign = 'left';
    }

    /* 说明两行 */
    if (d.desc) {
        ctx.font = '600 11px sans-serif';
        ctx.fillStyle = TT.textSoft;
        for (var i = 0; i < d.desc.length && i < 2; i++) {
            ctx.fillText(U.fitText(ctx, d.desc[i], c.w - 104), c.x + 90, c.y + 48 + i * 18);
        }
    }

    /* 标签行 */
    if (d.tags && d.tags.length) {
        var tx = c.x + 14;
        var ty = c.y + 84;
        for (var k = 0; k < d.tags.length; k++) {
            var tg = d.tags[k];
            ctx.font = '700 9.5px sans-serif';
            var w = Math.min(96, chipW(ctx, tg.txt, 7));
            if (tx + w > c.x + c.w - 14) break;
            drawChip(ctx, tx, ty, tg.txt, tg.color || TT.gold, 16);
            tx += w + 6;
        }
    }

    /* 按钮行 */
    var n = d.buttons ? d.buttons.length : 0;
    for (var b = 0; b < n; b++) {
        var btn = d.buttons[b];
        var r = L.bagDetailBtnRect(b, n, ease);
        if (btn.on) {
            var scheme = btn.kind === 'red' ? {
                top: TT.yellowTop, bottom: TT.yellowBottom, deep: TT.yellowDeep, ink: '#5f1e18'
            } : {
                top: TT.greenTop, bottom: TT.greenBottom, deep: TT.greenDeep, ink: '#6f5220'
            };
            Th.jelly(ctx, r.x, r.y, r.w, r.h, {
                top: scheme.top, bottom: scheme.bottom, deep: scheme.deep,
                r: 14, depth: 3, ink: scheme.ink, lw: 2.2
            });
        } else {
            Th.jelly(ctx, r.x, r.y, r.w, r.h, {
                top: TT.greyTop, bottom: TT.greyBottom, deep: TT.greyDeep,
                r: 14, depth: 2, ink: 'rgba(200,164,92,0.28)', lw: 1.6, gloss: false
            });
        }
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 14px sans-serif';
        ctx.fillStyle = btn.on ? (btn.kind === 'red' ? '#ffe9d0' : '#eafff2') : TT.textSoft;
        ctx.fillText(btn.label, r.x + r.w / 2, r.y + r.h / 2 + (btn.sub ? -5 : 0.5));
        if (btn.sub) {
            ctx.font = '600 9.5px sans-serif';
            ctx.fillStyle = btn.on ? 'rgba(255,255,255,0.72)' : TT.textSoft;
            ctx.fillText(btn.sub, r.x + r.w / 2, r.y + r.h / 2 + 9);
        }
    }
}

/* 没选中任何东西时的空详情卡：给个虚线圆占住图标位，别留一块黑洞 */
function drawBagEmptyDetail(ctx, ease, text) {
    drawBagDetail(ctx, {
        draw: function (c, box) {
            var cx = box.x + box.w / 2;
            var cy = box.y + box.h / 2;
            ctx.beginPath();
            ctx.arc(cx, cy, 17, 0, 6.2832);
            ctx.strokeStyle = 'rgba(200,164,92,0.35)';
            ctx.lineWidth = 1.6;
            ctx.stroke();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '800 16px sans-serif';
            ctx.fillStyle = 'rgba(200,164,92,0.5)';
            ctx.fillText('?', cx, cy + 0.5);
        },
        name: '还没有选中',
        desc: [text],
        buttons: []
    }, ease);
}

/* ---------------- 子页一：鱼（最常用，所以放在最后一位） ---- */

function fishCells(state) {
    var list = pond.caughtList(state);
    var out = [];
    for (var i = 0; i < list.length; i++) out.push({ key: list[i].fish.id, kind: 'fish', cell: list[i] });
    return out;
}

/* 道具格 */
function propCells(state) {
    var st = pond.statusOf(state);
    var counts = { 'item:oyster': st.oyster, 'item:pearl': st.pearl, 'item:bait': st.bait };
    var out = [];
    for (var i = 0; i < PROP_DEFS.length; i++) {
        out.push({ key: PROP_DEFS[i].key, kind: 'prop', def: PROP_DEFS[i], n: counts[PROP_DEFS[i].key] || 0 });
    }
    return out;
}

/* 鱼卵格：孵化槽在前，培育缸在后 */
function eggCells(state) {
    var eggs = breed.hatchList(state);
    var slots = cfg.breed.slots || 3;
    var nursery = state.nursery || [];
    var nSlots = breed.nurserySlotsOf(state);
    var out = [];
    var i;
    for (i = 0; i < slots; i++) {
        out.push(eggs[i]
            ? { key: 'egg:' + i, kind: 'egg', egg: eggs[i] }
            : { key: 'eggslot:' + i, kind: 'empty', label: '空孵化槽' });
    }
    for (i = 0; i < nSlots; i++) {
        out.push(nursery[i]
            ? { key: 'nursery:' + i, kind: 'baby', fish: nursery[i] }
            : { key: 'nurslot:' + i, kind: 'empty', label: '空培育位' });
    }
    return out;
}

/* 当前子页的格子数据：渲染和触摸共用一份，避免两边各写一套顺序 */
function bagCellsOf(state, session) {
    var tab = session.bagTab || 0;
    if (tab === 0) return eggCells(state);
    if (tab === 1) return propCells(state);
    return fishCells(state);
}

/* 当前子页能选的 key（全选按钮用） */
function bagKeysOf(state, session) {
    var cells = bagCellsOf(state, session);
    var out = [];
    for (var i = 0; i < cells.length && out.length < L.BAG_GRID_CAP; i++) {
        if (cells[i].kind === 'empty') continue;
        out.push(cells[i].key);
    }
    return out;
}

/* 详情卡上的按钮：渲染照着画，触摸照着执行，只有这一份真相 */
function bagActionsOf(state, session) {
    var tab = session.bagTab || 0;
    var sels = session.bagSels || [];
    var mode = !!session.bagMode;

    if (!sels.length) return [];

    if (tab === 0) {
        return [{ key: 'breed', label: '去繁育看看', on: true, kind: 'green' }];
    }

    if (tab === 1) {
        var st = pond.statusOf(state);
        var pearlPrice = wallet.format(cfg.pond.pearlPrice || 10000);
        if (sels[0] === 'item:oyster') {
            return [{
                key: 'break', label: '打破一枚', sub: '剩 ' + st.oyster + ' 个',
                on: st.oyster > 0, kind: 'green'
            }];
        }
        if (sels[0] === 'item:pearl') {
            return [{
                key: 'sellPearl', label: '卖一颗', sub: '+' + pearlPrice,
                on: st.pearl > 0, kind: 'red'
            }];
        }
        return [{
            key: 'shop', label: '去商店买', sub: '鱼饵 ×' + st.bait,
            on: true, kind: 'green'
        }];
    }

    var room = storage.roomOf(state);
    var roomText = room === Infinity ? '鱼位无限' : (room > 0 ? '还有 ' + room + ' 个鱼位' : '鱼缸已满');

    if (sels.length === 1 && !mode) {
        var list = pond.caughtList(state);
        var one = null;
        for (var i = 0; i < list.length; i++) {
            if (list[i].fish.id === sels[0]) { one = list[i]; break; }
        }
        if (!one) return [];
        return [
            { key: 'tank', label: '放进鱼缸', sub: roomText, on: room > 0, kind: 'green' },
            { key: 'sell', label: '卖出', sub: '+' + wallet.format(one.price), on: true, kind: 'red' }
        ];
    }

    var all = pond.caughtList(state);
    var total = 0;
    var count = 0;
    for (var k = 0; k < all.length; k++) {
        if (sels.indexOf(all[k].fish.id) >= 0) { total += all[k].price; count += 1; }
    }
    return [
        { key: 'tankMany', label: '批量放缸', sub: '放 ' + count + ' 条', on: count > 0 && room > 0, kind: 'green' },
        { key: 'sellMany', label: '批量卖出', sub: '+' + wallet.format(total), on: count > 0, kind: 'red' }
    ];
}

function drawBagFish(ctx, state, ease, session) {
    var cells = fishCells(state);
    var all = cells.length;
    var sels = session.bagSels || [];
    var cap = pond.bagCapOf ? pond.bagCapOf(state) : 20;
    var mode = !!session.bagMode;

    drawBagHeader(ctx, session, ease, '鱼篓 ' + all + '/' + cap,
        Math.min(all, L.BAG_GRID_CAP), sels.length);

    var maxShow = L.BAG_GRID_CAP;
    for (var i = 0; i < maxShow; i++) {
        var r = L.bagCellRect(i, ease);
        var item = cells[i];
        if (!item) { emptyCell(ctx, r); continue; }

        var at = sels.indexOf(item.key);
        var sel = at >= 0;
        var c = item.cell;
        var rc = RARITY[c.species.rarity] || TT.gold;

        cellFrame(ctx, r, { sel: sel, line: U.hexA(rc, 0.5) });

        art.drawThumb(ctx, c.species.id, r.x + 3, r.y + 2, r.w - 6, r.h - 20, {
            t: state.t || 0, phase: i * 1.1, evo: fishLib.evoOf(c.fish)
        });

        /* 性别：左上角小圆，繁育挑鱼时一眼分公母 */
        if (c.fish.sex) {
            var sx = r.x + 10;
            var sy = r.y + 10;
            ctx.beginPath();
            ctx.arc(sx, sy, 6.5, 0, 6.2832);
            ctx.fillStyle = c.fish.sex === 'f' ? 'rgba(206,110,152,0.95)' : 'rgba(94,146,206,0.95)';
            ctx.fill();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '700 8px sans-serif';
            ctx.fillStyle = '#fff6ea';
            ctx.fillText(c.fish.sex === 'f' ? '♀' : '♂', sx, sy + 0.5);
        }

        /* 成长做成缩略图右下角的小字：
         * 66px 宽的格子放不下「价格 + 成长」并排一行，
         * 挤在一起会读成 6850.0% 这种鬼东西。 */
        /* 成鱼不标成长（满级是常态，标了反而满屏噪声），鱼苗才标 */
        if (c.growth < 100) {
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.font = '800 8.5px sans-serif';
            ctx.fillStyle = 'rgba(12,18,34,0.55)';
            ctx.fillText(c.growth + '%', r.x + r.w - 4.4, r.y + r.h - 25.4);
            ctx.fillStyle = 'rgba(232,212,160,0.92)';
            ctx.fillText(c.growth + '%', r.x + r.w - 5, r.y + r.h - 26);
        }

        /* 底行只留价钱 */
        var by = r.y + r.h - 11;
        coinDot(ctx, r.x + 8, by, 4.5);
        ctx.textAlign = 'left';
        ctx.font = '800 10px sans-serif';
        ctx.fillStyle = TT.goldLight;
        ctx.fillText(wallet.format(c.price), r.x + 15, by + 0.5);

        if (sel) selBadge(ctx, r, mode ? at + 1 : 0);
    }

    if (all > maxShow) {
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.font = '600 10px sans-serif';
        ctx.fillStyle = TT.textSoft;
        ctx.fillText('还有 ' + (all - maxShow) + ' 条装不下 · 卖几条腾地方',
            W - 18, L.bagDetailRect(ease).y - 8);
    }

    /* ---- 详情卡 ---- */
    if (!sels.length) {
        drawBagEmptyDetail(ctx, ease, '点格子选中 · 开「批量」可多选后一起放缸或卖出');
        return;
    }

    if (sels.length === 1 && !mode) {
        var one = null;
        for (var q = 0; q < cells.length; q++) {
            if (cells[q].key === sels[0]) { one = cells[q]; break; }
        }
        if (!one) { drawBagEmptyDetail(ctx, ease, '这条鱼已经不在了'); return; }

        var f = one.cell.fish;
        var sp = one.cell.species;
        var tags = [];
        var tr = f.traits || [];
        for (var k = 0; k < tr.length && k < 3; k++) {
            var def = fishLib.traitDef(tr[k].id);
            if (def) tags.push({ txt: def.name + ' L' + fishLib.traitLvOf(tr[k]), color: TT.gold });
        }
        if (fishLib.evoOf(f) > 0) {
            tags.unshift({ txt: fishLib.evoStageName(f), color: '#f0a86a' });
        }

        drawBagDetail(ctx, {
            draw: function (c2, box) {
                art.drawThumb(ctx, sp.id, box.x, box.y, box.w, box.h, {
                    t: state.t || 0, evo: fishLib.evoOf(f)
                });
            },
            name: sp.name,
            sub: f.sex === 'f' ? '♀' : '♂',
            subColor: f.sex === 'f' ? '#d2799f' : '#6b9ad0',
            price: wallet.format(one.cell.price),
            desc: [
                sp.rarity + ' · ' + one.cell.stage + ' · 成长 ' + one.cell.growth + '%',
                '饱食 ' + Math.round(f.hunger || 0) + '% · 心情 ' + Math.round(f.mood || 0) + '%'
            ],
            tags: tags,
            buttons: bagActionsOf(state, session)
        }, ease);
        return;
    }

    /* 批量汇总 */
    var total = 0;
    var count = 0;
    for (var s2 = 0; s2 < cells.length; s2++) {
        if (sels.indexOf(cells[s2].key) >= 0) { total += cells[s2].cell.price; count += 1; }
    }
    var room2 = storage.roomOf(state);
    drawBagDetail(ctx, {
        draw: function (c3, box) {
            art.drawThumb(ctx, cells[0].cell.species.id, box.x + 4, box.y + 4, box.w - 8, box.h - 8, {
                t: state.t || 0
            });
        },
        name: '已选 ' + count + ' 条',
        price: wallet.format(total),
        desc: [
            '鱼缸还剩 ' + (room2 === Infinity ? '∞' : room2) + ' 个鱼位',
            '批量卖出按单条身价合计，不打折'
        ],
        tags: [],
        buttons: bagActionsOf(state, session)
    }, ease);
}

/* 整段孵化时长，写成 3:00 这种 */
function allClock(sec) {
    var v = Math.max(0, Math.round(sec || 0));
    return Math.floor(v / 60) + ':' + (v % 60 < 10 ? '0' : '') + (v % 60);
}

/* ---------------- 子页二：道具 ---------------- */

function drawBagProps(ctx, state, ease, session) {
    var st = pond.statusOf(state);
    var sels = session.bagSels || [];
    var cells = propCells(state);

    var totalItems = 0;
    for (var q = 0; q < cells.length; q++) {
        if (cells[q].n > 0) totalItems += 1;
    }

    drawBagHeader(ctx, session, ease, '道具 ' + totalItems + '/' + cells.length, totalItems, sels.length);

    for (var i = 0; i < L.BAG_GRID_CAP; i++) {
        var r = L.bagCellRect(i, ease);
        if (i >= cells.length) { emptyCell(ctx, r); continue; }

        var d = cells[i].def;
        var n = cells[i].n;
        var sel = sels.indexOf(cells[i].key) >= 0;

        cellFrame(ctx, r, { sel: sel, line: n > 0 ? U.hexA(d.color, 0.55) : null });

        roundRect(ctx, r.x + 8, r.y + 8, r.w - 16, r.w - 16, 12);
        ctx.fillStyle = n > 0 ? d.bg : 'rgba(10,16,32,0.5)';
        ctx.fill();
        itemArt.draw(ctx, d.icon, r.x + r.w / 2, r.y + 8 + (r.w - 16) / 2, 30, n > 0 ? d.bg : '#2a3352');

        /* 数量角标（右下），没货就压成 0 */
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.font = '800 11px sans-serif';
        ctx.fillStyle = n > 0 ? TT.goldLight : TT.textSoft;
        ctx.fillText('×' + n, r.x + r.w - 5, r.y + r.h - 13);

        ctx.textAlign = 'left';
        ctx.font = '700 9.5px sans-serif';
        ctx.fillStyle = n > 0 ? TT.text : TT.textSoft;
        ctx.fillText(d.name, r.x + 6, r.y + r.h - 13);

        if (sel) selBadge(ctx, r, 0);
    }

    /* 详情卡 */
    var pick = null;
    for (var s = 0; s < PROP_DEFS.length; s++) {
        if (sels.indexOf(PROP_DEFS[s].key) >= 0) { pick = PROP_DEFS[s]; break; }
    }
    if (!pick) {
        drawBagEmptyDetail(ctx, ease, '点道具看说明 · 珍珠贝打破有概率出珍珠');
        return;
    }

    var pearlPrice = wallet.format(cfg.pond.pearlPrice || 10000);
    if (pick.key === 'item:oyster') {
        drawBagDetail(ctx, {
            draw: function (c2, box) {
                itemArt.draw(ctx, 'oyster', box.x + box.w / 2, box.y + box.h / 2, 40, '#3a3358');
            },
            name: '珍珠贝',
            sub: '×' + st.oyster,
            price: pearlPrice,
            desc: [
                '打破后有 ' + Math.round((cfg.pond.oysterBreakRate || 0.5) * 100) + '% 开出一颗珍珠',
                '空壳也照样碎掉，一枚只博一次'
            ],
            tags: [{ txt: '每颗约 ' + pearlPrice + ' 期望', color: '#9a8fc4' }],
            buttons: bagActionsOf(state, session)
        }, ease);
    } else if (pick.key === 'item:pearl') {
        drawBagDetail(ctx, {
            draw: function (c2, box) {
                itemArt.draw(ctx, 'pearl', box.x + box.w / 2, box.y + box.h / 2, 40, '#2f5a72');
            },
            name: '珍珠',
            sub: '×' + st.pearl,
            price: pearlPrice,
            desc: ['每颗固定卖 ' + pearlPrice + ' 金币', '从珍珠贝里开出来，不会自己长'],
            tags: [{ txt: '共 ' + wallet.format(st.pearl * (cfg.pond.pearlPrice || 10000)), color: '#7fc2dc' }],
            buttons: bagActionsOf(state, session)
        }, ease);
    } else {
        drawBagDetail(ctx, {
            draw: function (c2, box) {
                itemArt.draw(ctx, 'bait', box.x + box.w / 2, box.y + box.h / 2, 40, '#3d5a2f');
            },
            name: '鱼饵',
            sub: '×' + st.bait,
            price: wallet.format(cfg.pond.bait.price) + '/个',
            desc: ['抛竿一次用 1 个', '鱼饵见底时去商店补，买多有折扣'],
            tags: [{ txt: '够抛 ' + st.bait + ' 次', color: '#9cc47a' }],
            buttons: bagActionsOf(state, session)
        }, ease);
    }
}

/* ---------------- 子页三：鱼卵（孵化槽 + 培育缸） ---------------- */

function drawBagEggs(ctx, state, ease, session) {
    var top = L.sheetTop(ease);
    var eggs = breed.hatchList(state);
    var slots = cfg.breed.slots || 3;
    var nursery = state.nursery || [];
    var nSlots = breed.nurserySlotsOf(state);
    var t = state.t || 0;
    var sels = session.bagSels || [];

    var cells = eggCells(state);

    var live = 0;
    for (var c0 = 0; c0 < cells.length; c0++) {
        if (cells[c0].kind !== 'empty') live += 1;
    }
    drawBagHeader(ctx, session, ease,
        '孵化 ' + eggs.length + '/' + slots + ' · 培育 ' + nursery.length + '/' + nSlots,
        live, sels.length);

    for (var k = 0; k < L.BAG_GRID_CAP && k < cells.length; k++) {
        var r = L.bagCellRect(k, ease);
        var cell = cells[k];
        var sel = sels.indexOf(cell.key) >= 0;

        if (cell.kind === 'empty') {
            emptyCell(ctx, r);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '600 9px sans-serif';
            ctx.fillStyle = 'rgba(232,212,160,0.28)';
            ctx.fillText(cell.label, r.x + r.w / 2, r.y + r.h / 2);
            continue;
        }

        if (cell.kind === 'egg') {
            var e = cell.egg;
            cellFrame(ctx, r, { sel: sel, line: U.hexA(e.ready ? TT.gold : '#6f9fc4', 0.55) });

            breedRender.drawEgg(ctx, r.x + r.w / 2 - 13, r.y + 8, 26, 32, e.ready, e.twin, t);

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = '800 9.5px sans-serif';
            ctx.fillStyle = e.ready ? TT.goldLight : TT.text;
            ctx.fillText(e.ready ? '可孵' : breedRender.clock(e.left), r.x + 5, r.y + r.h - 13);

            ctx.textAlign = 'right';
            ctx.font = '700 9px sans-serif';
            ctx.fillStyle = e.egg.sex === 'f' ? '#d2799f' : '#6b9ad0';
            ctx.fillText(e.egg.sex === 'f' ? '♀' : '♂', r.x + r.w - 5, r.y + r.h - 13);

            /* 孵化进度条：贴在格子最下沿 */
            roundRect(ctx, r.x + 5, r.y + r.h - 5, r.w - 10, 3, 1.5);
            ctx.fillStyle = 'rgba(8,14,30,0.6)';
            ctx.fill();
            roundRect(ctx, r.x + 5, r.y + r.h - 5, Math.max(2, (r.w - 10) * e.progress), 3, 1.5);
            ctx.fillStyle = e.ready ? TT.gold : '#6f9fc4';
            ctx.fill();
        } else {
            var bf = cell.fish;
            var bsp = fishLib.speciesById(bf.speciesId);
            cellFrame(ctx, r, { sel: sel, line: U.hexA(RARITY[bsp.rarity] || TT.gold, 0.5) });

            art.drawThumb(ctx, bsp.id, r.x + 3, r.y + 3, r.w - 6, r.h - 26, {
                t: t, evo: fishLib.evoOf(bf)
            });

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = '700 9px sans-serif';
            ctx.fillStyle = TT.textSoft;
            ctx.fillText('育', r.x + 5, r.y + r.h - 13);

            ctx.textAlign = 'right';
            ctx.font = '800 9.5px sans-serif';
            ctx.fillStyle = TT.goldLight;
            ctx.fillText(Math.round(bf.growth) + '%', r.x + r.w - 5, r.y + r.h - 13);
        }

        if (sel) selBadge(ctx, r, 0);
    }

    if (cells.length > L.BAG_GRID_CAP) {
        ctx.textAlign = 'right';

 * ui/view.js · 鱼缸缩放 / 滑动
 *
 * 只改变「看」的方式，不改鱼的坐标、成长和碰撞：
 *   screen = center + (world - center) * zoom + offset
 *   world  = center + (screen - center - offset) / zoom
 *
 * M10 起不再有 +/− 按钮：
 *   双指捏合  → 连续缩放（1× ~ 2×）
 *   单指滑动  → 平移，抬手带惯性
 *   双击      → 还原 1×（见 ui/touch.js）
 *
 * 变换只作用在玻璃里的那一层（水、水草、鱼、飘字、选中圈），
 * 顶部信息行和底部按钮永远保持原尺寸 —— 它们不是缸里的东西。
 * ============================================================ */

var C = require('../render/canvas.js');

var MIN_ZOOM = 1;
var MAX_ZOOM = 2;

/* 惯性：抬手时的速度（px/s），按指数衰减；低于阈值直接停 */
var FRICTION = 6.2;
var MIN_SPEED = 6;

var X0 = C.FRAME_X;
var X1 = C.W - C.FRAME_X;
var Y0 = C.TANK_TOP;
var Y1 = C.TANK_BOTTOM;
var CX = (X0 + X1) / 2;
var CY = (Y0 + Y1) / 2;
var GLASS_W = X1 - X0;
var GLASS_H = Y1 - Y0;

var state = {
    zoom: 1,
    x: 0,
    y: 0
};

/* 滑动惯性速度，只存在于内存，不进存档 */
var vel = { x: 0, y: 0 };

/* 浏览器自动化读状态用；小游戏里 window 不存在，这行自然跳过 */
if (typeof window !== 'undefined') window.__zoomState = state;

function clamp() {
    if (!(state.zoom > 0) || !isFinite(state.zoom)) state.zoom = 1;
    if (state.zoom < MIN_ZOOM) state.zoom = MIN_ZOOM;
    if (state.zoom > MAX_ZOOM) state.zoom = MAX_ZOOM;

    /* 放大后可视范围变小，偏移量最多到「多出来的那一半」，
     * 保证玻璃里不会出现没水的空白边。
     * 贴边时把该方向的速度清零，否则会一直撞边「粘住」。 */
    var mx = GLASS_W * (1 - 1 / state.zoom) / 2;
    var my = GLASS_H * (1 - 1 / state.zoom) / 2;
    if (state.x > mx) { state.x = mx; if (vel.x > 0) vel.x = 0; }
    if (state.x < -mx) { state.x = -mx; if (vel.x < 0) vel.x = 0; }
    if (state.y > my) { state.y = my; if (vel.y > 0) vel.y = 0; }
    if (state.y < -my) { state.y = -my; if (vel.y < 0) vel.y = 0; }

    clamp();

    if (!(ratio > 0) || !isFinite(ratio)) return state.zoom;
    state.zoom *= ratio;
    clamp();
    return state.zoom;

    state.x += dx;
    state.y += dy;

        session.bagSels = [];

        if (!mv.ok) session.showToast('鱼缸满了，先清出鱼位');

        return;

    if (key === 'sell') {
        var sid = session.bagSels[0];
        var sc = pondCore.sellCaught(state, sid);
        session.bagSels = [];
        if (!sc.ok) session.showToast('这条鱼已经不在了');
        else session.showToast('卖掉 +' + wallet.format(sc.price));
        return;
    }

    if (key === 'tankMany') {
        var mm = pondCore.moveManyToTank(state, session.bagSels);
        if (!mm.ok) {
            session.showToast('鱼缸满了，先清出鱼位');
        } else if (mm.full > 0) {
            session.bagSels = [];
            session.showToast('放入 ' + mm.moved + ' 条 · 鱼缸满，剩 ' + mm.full + ' 条在仓库');
        } else {
            session.bagSels = [];
            session.showToast('放入鱼缸 ' + mm.moved + ' 条');
        }
        return;
    }

    if (key === 'sellMany') {

        session.bagSels = [];

function handleBag(x, y, env) {
    var session = env.session;
    var state = env.state;
    var ease = session.sheetEase;
    if (!session.bagSels) session.bagSels = [];

    /* 繁育入口：盖在这页之上的独立浮层 */
    if (U.inRect(x, y, L.bagBreedRect(ease))) {
        openBreed(env);
        return;
    }

    /* 批量开关：退出批量时把多选一起清掉，免得下次进来还挂着 */
    if (U.inRect(x, y, L.bagChipRect(0, ease))) {
        session.bagMode = !session.bagMode;
        if (!session.bagMode) session.bagSels = [];
        return;
    }

    /* 全选 / 清空 */
    if (U.inRect(x, y, L.bagChipRect(1, ease))) {
        var keys = sheetRender.bagKeysOf(state, session);
        if (!keys.length) return;
        if (session.bagSels.length >= keys.length) {
            session.bagSels = [];
        } else {
            session.bagSels = keys;
            session.bagMode = true;
        }
        return;
    }

    /* 详情卡按钮 */
    var actions = sheetRender.bagActionsOf(state, session);
    for (var a = 0; a < actions.length; a++) {
        if (!U.inRect(x, y, L.bagDetailBtnRect(a, actions.length, ease))) continue;
        if (actions[a].on) runBagAction(env, actions[a].key);
        else if (actions[a].key === 'tank' || actions[a].key === 'tankMany') {
            session.showToast('鱼缸满了，先升仓库等级');
        }
        return;
    }

    /* 点在卡片上（不是按钮）：吞掉。
     * 少了这一行，手指落在卡片空白处会穿透成「点空白」，把选中清掉。 */
    if (U.inRect(x, y, L.bagDetailRect(ease))) return;

    /* 格子：顺序与渲染完全一致 */
    var cells = sheetRender.bagCellsOf(state, session);
    var maxShow = Math.min(L.BAG_GRID_CAP, cells.length);
    for (var i = 0; i < maxShow; i++) {
        if (!U.inRect(x, y, L.bagCellRect(i, ease))) continue;
        var c = cells[i];
        if (c.kind === 'empty') return;

        var at = session.bagSels.indexOf(c.key);
        if (session.bagMode) {
            if (at >= 0) session.bagSels.splice(at, 1);
            else session.bagSels.push(c.key);
        } else {
            session.bagSels = at >= 0 ? [] : [c.key];
        }
        return;
    }
}

/* 系统弹层：清档 / 关闭 / 点外面关。
 * 清档要连点两次（第一次只是「上膛」，3 秒内有效），避免误触。 */
function handleSys(x, y, env) {
    var session = env.session;

    if (U.inRect(x, y, L.sysBtnRect(1)) || !U.inRect(x, y, L.sysCardRect())) {
        session.sysOpen = false;
        session.sysArmed = 0;
        return;
    }

    if (U.inRect(x, y, L.sysBtnRect(0))) {
        if (session.sysArmed > 0) {
            session.sysOpen = false;
            session.sysArmed = 0;
            env.clearSave();
            return;
        }
        session.sysArmed = 3;
        session.showToast('再点一次「确认清档」');
    }
}

/* ---------------- 繁育浮层（M12） ---------------- */

/** 打开繁育：顺手把「上次选的那条」校验一遍，没选就自动挑第一条合性别的成鱼 */
function openBreed(env) {
    var session = env.session;
    var state = env.state;

    session.breedOpen = true;
    session.breedPick = '';
    session.nurseryDetail = '';

    var cands = breedCore.candidatesOf(state);
    var i;

    var m = session.breedMother ? breedCore.findFish(state, session.breedMother) : null;
    if (!m || m.sex !== 'f') session.breedMother = '';
    var f = session.breedFather ? breedCore.findFish(state, session.breedFather) : null;
    if (!f || f.sex !== 'm') session.breedFather = '';

    for (i = 0; i < cands.length; i++) {
        if (!session.breedMother && cands[i].fish.sex === 'f') session.breedMother = cands[i].fish.id;
        if (!session.breedFather && cands[i].fish.sex === 'm') session.breedFather = cands[i].fish.id;
    }
}

function handleBreed(x, y, env) {
    var session = env.session;
    var state = env.state;

    /* 最上层：子代详情（卡片高度跟着词条数走，命中区必须同源） */
    if (session.nurseryDetail) {
        var dFish = breedCore.findFish(state, session.nurseryDetail);
        if (!dFish) {
            for (var di = 0; di < (state.nursery || []).length; di++) {
                if (state.nursery[di].id === session.nurseryDetail) dFish = state.nursery[di];
            }
        }
        var dc = L.detailCardRect(dFish ? (dFish.traits || []).length : 1);
        var xr = { x: dc.x + dc.w - 38, y: dc.y + 10, w: 28, h: 28 };

        if (U.inRect(x, y, xr)) {
            session.nurseryDetail = '';
            return;
        }
        if (U.inRect(x, y, L.pickBtnRect(0, dc))) {
            var mv = breedCore.moveToTank(state, session.nurseryDetail);
            if (!mv.ok) session.showToast(mv.reason === 'full' ? '鱼缸满了，先清出鱼位' : '这条子代已经不在了');
            else {
                session.nurseryDetail = '';
                session.showToast('已放进鱼缸');
                if (env.saveNow) env.saveNow();
            }
            return;
        }
        if (U.inRect(x, y, L.pickBtnRect(1, dc))) {
            var sc = breedCore.sellNursery(state, session.nurseryDetail);
            if (!sc.ok) session.showToast('这条子代已经不在了');
            else {
                session.nurseryDetail = '';
                session.showToast('卖掉 ' + sc.name + ' +' + wallet.format(sc.price));
                if (env.saveNow) env.saveNow();
            }
            return;
        }
        if (!U.inRect(x, y, dc)) session.nurseryDetail = '';
        return;
    }

    /* 次上层：选亲本列表 */
    if (session.breedPick) {
        var want = session.breedPick === 'mother' ? 'f' : 'm';
        var otherId = session.breedPick === 'mother' ? session.breedFather : session.breedMother;
        var all = breedCore.candidatesOf(state);
        var pool = [];
        for (var i = 0; i < all.length; i++) {
            if (all[i].fish.sex !== want || all[i].fish.id === otherId) continue;
            pool.push(all[i]);
        }
        var pc = L.pickCardRect(Math.max(1, Math.min(6, pool.length)));
        var n = Math.min(6, pool.length);
        for (var k = 0; k < n; k++) {
            if (!U.inRect(x, y, L.pickRowRect(k))) continue;
            if (session.breedPick === 'mother') session.breedMother = pool[k].fish.id;
            else session.breedFather = pool[k].fish.id;
            session.breedPick = '';
            return;
        }
        /* 取消按钮是「两个按钮宽」那一整条 */
        var cb = L.pickBtnRect(0, pc);
        if (U.inRect(x, y, { x: cb.x, y: cb.y, w: cb.w * 2 + 10, h: cb.h })) {
            session.breedPick = '';
            return;
        }
        if (!U.inRect(x, y, pc)) session.breedPick = '';
        return;
    }

    /* 关闭 */
    if (U.inRect(x, y, L.breedCloseRect())) {
        session.breedOpen = false;
        return;
    }

    /* 亲本槽 */
    if (U.inRect(x, y, L.breedParentRect(0))) {
        session.breedPick = 'mother';
        return;
    }
    if (U.inRect(x, y, L.breedParentRect(1))) {
        session.breedPick = 'father';
        return;
    }

    /* 开始繁育 */
    if (U.inRect(x, y, L.breedGoRect())) {
        var r = breedCore.breed(state, session.breedMother, session.breedFather);
        if (!r.ok) {
            session.showToast(r.text || '还不能繁育');
        } else {
            session.showToast('产卵成功 · ' + r.seconds + ' 秒后孵化' + (r.twin ? ' · 双生！' : ''));
            if (env.saveNow) env.saveNow();
        }
        return;
    }

    /* 孵化槽：只做提示，真正的落缸在 sim 每帧的 tick 里 */
    var total = cfg.breed.slots || 3;
    for (var h = 0; h < total; h++) {
        if (!U.inRect(x, y, L.hatchSlotRect(h))) continue;
        var eggs = breedCore.hatchList(state);
        var e = eggs[h];
        if (!e) session.showToast('空槽 · 选好亲本就能产卵');
        else if (e.ready) session.showToast(breedCore.nurseryRoom(state) > 0 ? '正在落缸' : '培育缸满了，先腾位置');
        else session.showToast('还要 ' + e.left + ' 秒');
        return;
    }

    /* 培育缸格子 → 子代详情 */
    var slots = breedCore.nurserySlotsOf(state);
    var list = state.nursery || [];
    for (var c2 = 0; c2 < slots; c2++) {
        if (!U.inRect(x, y, L.nurseryCellRect(c2))) continue;
        if (list[c2]) session.nurseryDetail = list[c2].id;
        else session.showToast('培育缸空着 · 孵出的子代会落在这里');
        return;
    }

    /* 点卡片外面 = 关掉 */
    if (!U.inRect(x, y, L.breedCardRect())) session.breedOpen = false;
}

function tap(x, y, env) {
    var session = env.session;
    var state = env.state;

    /* 1. 弹窗：阻塞一切，优先于调试面板 */
    if (session.modal) {
        if (U.inRect(x, y, modalRender.btnRect(session.modal))) {
            session.modal = null;
            env.saveNow();
        }
        return;
    }

    /* 1.5 系统弹层：同样阻塞一切 */
    if (session.sysOpen) {
        handleSys(x, y, env);
        return;
    }

    /* 1.6 繁育浮层：盖在面板之上，进来之后先吃点击 */
    if (session.breedOpen) {
        handleBreed(x, y, env);
        return;
    }

    /* 2. 调试面板 */
    if (debugPanel.tap(x, y, session, env)) return;

    /* 3. 连点金币胶囊开调试面板 */
    debugPanel.registerTap(x, y, session, L);

    /* 4. 缸内不再有缩放按钮：缩放靠双指、平移靠滑动，这里直接放行。
     *    （M10 删掉了原来的 +/− 命中区，玻璃整块还给鱼） */

    /* 5. 鱼缸切换：标签在顶部，商店面板挡不到，所以放在商店之前 */
    var tankN = storage.tankCountOf(state);
    var tankMax = storage.maxTanks();
    if (tankMax > 1) {
        for (var ti = 0; ti < tankMax; ti++) {
            if (!U.inRect(x, y, L.tankTabRect(ti, tankMax))) continue;
            if (ti >= tankN) {
                session.showToast('还没有这个缸 · 去商店开一个');
                return;
            }
            env.sim.setActiveTank(state, ti, C.viewport);
            return;
        }
    }

    /* 5. 商店 */
    if (session.sheetOpen || session.sheetEase > 0.05) {
        /* 开合动画的第一帧 ease 还是 0，此时 sheetTop() 等于整屏高，
         * 任何点击都会被当成「点在面板外面」而把刚打开的面板关掉。
         * 极快连点时遇到过，这里直接吞掉动画中的点击。 */
        if (session.sheetOpen && session.sheetEase < 0.05) return;
        handleSheet(x, y, env);
        return;
    }

    /* 6. 点鱼：选中并弹出信息卡（捞出 / 吞噬都在卡上） */
    if (handleFish(x, y, env)) return;

    /* 7. 底栏五入口：商店 / 仓库 / 鱼塘 / 图鉴 / 系统。
     *    前四个直接打开面板并对准页签，省掉「先开面板再点页签」的一步；
     *    「系统」开自己的弹层，不再借商店面板当系统入口。 */
    var bar = [
        { r: L.STORE_BTN, tab: 0 },
        { r: L.BAG_BTN, tab: 4 },
        { r: L.POND_BTN, tab: 3 },
        { r: L.CODEX_BTN, tab: 2 }
    ];
    for (var bi = 0; bi < bar.length; bi++) {
        if (!U.inRect(x, y, bar[bi].r)) continue;
        session.sheetOpen = true;
        session.sheetTab = bar[bi].tab;
        session.codexDetail = null;
        session.bagSels = [];
        return;
    }
    if (U.inRect(x, y, L.SYS_BTN)) {
        session.sysOpen = true;
        session.sysArmed = 0;
        return;
    }

    /* 8. 点水面撒食。
     * 缸盖和底座不是水，点在上面的空白处不该凭空掉饲料。 */
    if (y < C.TANK_TOP || y > C.TANK_BOTTOM) return;
    var fw = view.toWorld(x, y);
    env.sim.feed(state, fw.x, Math.min(fw.y, C.ground - 40), env.sim.pelletsFor(state, require('../config/index.js').economy.feeding.pelletsTap), C.viewport);
}

function dist(a, b) {
    var dx = a.clientX - b.clientX;
    var dy = a.clientY - b.clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

function mid(a, b) {
    return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
}

function attach(env) {
    var platform = require('../platform.js');
    var pending = null;   /* 还没决定是「点」还是「拖」 */
    var drag = null;
    var pinch = null;
    var lastTap = null;

    function nowMs() { return platform.now(); }

    platform.onTouchStart(function (e) {
        var ts = e.touches && e.touches.length ? e.touches : [];

        /* 三指同时点屏：切换诊断条。正常游戏里不可能误触 */
        if (ts.length >= 3) {
            var diag = require('./diag.js');
            diag.state.forceShow = !diag.state.forceShow;
            pending = drag = pinch = null;
            hold = null;
            return;
        }

        if (ts.length >= 2) {
            var m = mid(ts[0], ts[1]);
            pinch = { d: dist(ts[0], ts[1]), x: m.x, y: m.y };
            pending = null;
            drag = null;
            hold = null;
            view.stop();
            return;
        }

        if (ts.length === 1) {
            var x = ts[0].clientX;
            var y = ts[0].clientY;
            pending = { x: x, y: y };
            drag = { x: x, y: y, t: nowMs(), lastMoveAt: 0, vx: 0, vy: 0 };

            /* 按住鱼饵购买键 = 准备连买，计时由 step() 推进 */
            press(x, y, env);
        }
    });

    platform.onTouchMove(function (e) {
        var ts = e.touches && e.touches.length ? e.touches : [];

        if (pinch) {
            if (ts.length < 2) return;
            var d = dist(ts[0], ts[1]);
            if (pinch.d > 0) view.pinch(d / pinch.d);
            var c = mid(ts[0], ts[1]);
            view.pan(c.x - pinch.x, c.y - pinch.y);
            pinch.d = d;
            pinch.x = c.x;
            pinch.y = c.y;
            return;
        }

        if (!drag || !ts.length) return;
        var p = ts[0];

        /* 长按中手指滑出按钮太远：取消这次长按，交给普通拖动 */
        if (hold) {
            hold.x = p.clientX;
            hold.y = p.clientY;
            if (Math.abs(p.clientX - hold.ox) > 14 || Math.abs(p.clientY - hold.oy) > 14) hold = null;
        }

        var moved = dist(p, { clientX: drag.x, clientY: drag.y });
        if (moved < 8) return;

        /* 单指在玻璃里滑动 = 平移（放大后才有实际位移，clamp 会兜住）。
         * 一旦判定为拖动，这次抬手就不再当成点击（不会误撒食/误卖鱼）。 */
        var dx = p.clientX - drag.x;
        var dy = p.clientY - drag.y;
        var canPan = view.inGlass(drag.x, drag.y);
        if (canPan) view.pan(dx, dy);

        /* 记录速度给抬手后的惯性用，做一次平滑免得单帧抖动把画面甩飞 */
        var t = nowMs();
        var dms = Math.max(1, t - drag.t);
        drag.vx = drag.vx * 0.3 + (dx / dms * 1000) * 0.7;
        drag.vy = drag.vy * 0.3 + (dy / dms * 1000) * 0.7;
        drag.t = t;
        drag.lastMoveAt = t;
        drag.x = p.clientX;
        drag.y = p.clientY;
        pending = null;
    });

    platform.onTouchEnd(function (e) {
        if (pinch) {
            if (!(e.touches && e.touches.length >= 2)) pinch = null;
            pending = null;
            drag = null;
            return;
        }

        /* 长按连买已经出过手：这次抬手不再当成一次点击，避免多买一个 */
        if (release()) {
            pending = null;
            drag = null;
            return;
        }

        if (!pending) {
            /* 这是一次拖动：把最后的余速交给惯性，让画面再滑一小段 */
            if (drag && drag.lastMoveAt && nowMs() - drag.lastMoveAt < 140) {
                var cap = 2400;
                var vx = Math.max(-cap, Math.min(cap, drag.vx));
                var vy = Math.max(-cap, Math.min(cap, drag.vy));
                if (Math.abs(vx) > 120 || Math.abs(vy) > 120) view.fling(vx, vy);
            }
            drag = null;
            return;
        }

        var p = pending;
        pending = null;
        drag = null;

        /* 放大状态下双击鱼缸还原；未放大时仍走正常点击，不影响连续撒食。 */
        var nowT = Date.now();
        if (view.state.zoom > 1.001 && lastTap && nowT - lastTap.t < 350 &&
            Math.abs(p.x - lastTap.x) < 28 && Math.abs(p.y - lastTap.y) < 28) {
            lastTap = null;
            view.reset();
            env.session.showToast('鱼缸已还原');
            return;
        }
        lastTap = { x: p.x, y: p.y, t: nowT };
        tap(p.x, p.y, env);
    });
}

module.exports = {
    attach: attach,
    tap: tap,
    step: step,
    press: press,
    release: release
};

  };

  defs["render/decor.js"] = function (module, exports, require) {
/* ============================================================
 * render/decor.js · 场景装饰（纯视觉，不参与玩法）
 *
 * 水草、碎石、悬浮微粒、珊瑚。这些都是「看起来怎样」的东西，
 * 全部放在渲染层，逻辑层完全不感知。
 * ============================================================ */

var U = require('./util.js');

function makeCoral(x, hue) {
    var n = 4 + Math.floor(Math.random() * 3);
    var br = [];
    for (var i = 0; i < n; i++) {
        var a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.44;
        br.push({ a: a, len: U.rand(22, 46), w: U.rand(4, 7) });
    }
    return { x: x, hue: hue, br: br, s: U.rand(0.85, 1.2) };
}

function build(W, H, ground, corals, top) {
    var d = { plants: [], pebbles: [], motes: [], corals: [] };

    var n = Math.round(W / 38) + 10;
    for (var i = 0; i < n; i++) {
        var front = Math.random() > 0.42;
        d.plants.push({
            x: (i + U.rand(0.1, 0.9)) * (W / n),
            /* Q 版水草要粗一点、胖一点，细长条在明亮背景上会显得脏 */
            h: front ? U.rand(90, 190) : U.rand(60, 135),
            w: front ? U.rand(12, 22) : U.rand(7, 12),
            sway: U.rand(0, 6.28),
            spd: U.rand(0.5, 1.05),
            layer: front ? 1 : 0,
            hue: U.rand(150, 180) + (front ? 0 : 10)
        });
    }

    for (var p = 0; p < 18; p++) {
        d.pebbles.push({ x: U.rand(0, W), r: U.rand(9, 26), dy: U.rand(-2, 12) });
    }

    /* 微粒只在玻璃里面飘：缸盖和底座上面不该有小白点 */
    var mTop = top || 0;
    for (var m = 0; m < 34; m++) {
        d.motes.push({
            x: U.rand(0, W),
            y: U.rand(mTop, H),
            r: U.rand(0.6, 2.1),
            vy: U.rand(-6, -1.5),
            vx: U.rand(-4, 4),
            a: U.rand(0.05, 0.22)
        });
    }

    d.corals = buildCorals(W, corals);
    return d;
}

function buildCorals(W, corals) {
    var list = [];
    for (var i = 0; i < corals; i++) {
        var hue = 8 + i * 47;
        list.push(makeCoral(W * ((i + 0.6) / (corals + 0.6)) + U.rand(-20, 20), hue));
    }
    return list;
}

/* 微粒缓慢上浮，纯视觉效果 */
function updateMotes(d, dt, W, H, top) {
    var mTop = top || 0;
    for (var i = 0; i < d.motes.length; i++) {
        var m = d.motes[i];
        m.y += m.vy * dt;
        m.x += m.vx * dt + Math.sin(m.r * 9 + m.y * 0.01) * 2.6 * dt;
        if (m.y < mTop - 12) {
            m.y = H + 12;
            m.x = U.rand(0, W);
        }
        if (m.x < -12) m.x = W + 12;
        if (m.x > W + 12) m.x = -12;
    }
}

module.exports = {
    build: build,
    buildCorals: buildCorals,
    updateMotes: updateMotes
};

  };

  defs["render/fish.js"] = function (module, exports, require) {
/* ============================================================
 * render/fish.js · 缸里游动的鱼
 *
 * 只负责「把一条鱼的数据翻译成绘制参数」，
 * 具体长什么样在 render/fishart.js（Q 版矢量，和商店卡片共用）。

 * render/frame.js · 鱼缸的缸体（细线勾出来的那只缸）
 *
 * 造型按手绘稿走：一条外轮廓把整块屏幕框住，
 * 上面一条横带放读数，下面一条横带放按钮，

var BOT = C.TANK_BOTTOM;

    U.stop(g, 0.5, '#18213c');
    U.stop(g, 1, '#111a30');

    ctx.lineWidth = 2.4;
    ctx.stroke();

    ctx.strokeStyle = LINE + alpha + ')';
    ctx.lineWidth = 1.7;

    U.stop(g, 1, 'rgba(6,10,28,0)');

    U.stop(g2, 0, 'rgba(6,10,28,0)');
    U.stop(g2, 1, 'rgba(6,10,28,0.26)');

    U.stop(g3, 1, 'rgba(6,10,28,0)');
    ctx.fillStyle = g3;
    ctx.fillRect(FX, TOP, 9, BOT - TOP);

    U.stop(g4, 0, 'rgba(6,10,28,0.22)');
    U.stop(g4, 1, 'rgba(6,10,28,0)');

module.exports = {
    base: base,
    draw: draw
};

 *   · 顶部左边一张「玩家卡」（头像 + 缸名 + 鱼位进度条），
 *     右边上下两条白色资源胶囊（鱼币 / 鱼数）
 *   · 底部三个方形按钮，卡面浅米色，靠上面那枚彩色圆形
 *     徽章里的图标区分功能，文字在徽章下面
 * 形状与配色全部走 render/theme.js，这里只管布局。
 * ============================================================ */

var C = require('./canvas.js');
var U = require('./util.js');
var L = require('../ui/layout.js');
var wallet = require('../core/wallet.js');
var storage = require('../core/storage.js');
var Th = require('./theme.js');
var itemArt = require('./itemart.js');
var fishArt = require('./fishart.js');
var view = require('../ui/view.js');

var W = C.W;
var H = C.H;
var roundRect = U.roundRect;
var TT = Th.T;

/* ---------------- 小图标 ---------------- */

/* 币：金色圆片，带一圈深棕描边 */
function drawCoin(ctx, cx, cy, r) {
    var g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.4, 1, cx, cy, r);
    U.stop(g, 0, '#fff3a8');
    U.stop(g, 0.55, '#f7c22c');
    U.stop(g, 1, '#d18f0c');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 6.2832);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#a9740a';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(cx - 1.1, cy - r * 0.45, 2.2, r * 0.9);
    ctx.fillRect(cx - r * 0.45, cy - 1.1, r * 0.9, 2.2);
}

function drawCoinBlue(ctx, cx, cy, r) {
    var g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.4, 1, cx, cy, r);
    U.stop(g, 0, '#cfe4f2');
    U.stop(g, 0.55, '#6f9fc4');
    U.stop(g, 1, '#2c5677');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 6.2832);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#24486a';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.fillStyle = '#e8f2fa';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 9px sans-serif';
    ctx.fillText('S', cx, cy + 0.5);
}

/* 小鱼图标：鱼数用它当标签。
 * 只有 8px 高的时候会糊成一个点，所以尾巴做缺口、眼睛留白点。 */
function drawFishIcon(ctx, cx, cy, s, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.moveTo(-s * 0.7, 0);
    ctx.lineTo(-s * 2.0, -s * 0.85);
    ctx.lineTo(-s * 1.55, 0);
    ctx.lineTo(-s * 2.0, s * 0.85);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    U.ellipse(ctx, 0, 0, s, s * 0.74, 0);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.arc(s * 0.42, -s * 0.16, s * 0.26, 0, 6.2832);
    ctx.fill();
    ctx.restore();
}

/* ---------------- 顶部：玩家卡 ---------------- */

function drawPlayerCard(ctx, state) {
    var c = L.CARD;

    Th.jelly(ctx, c.x, c.y, c.w, c.h, {
        top: TT.cardTop,
        bottom: TT.cardBottom,
        deep: TT.cardDeep,
        r: 18,
        depth: 3,
        ink: TT.ink,
        lw: 2.2,
        gloss: false
    });

    /* 头像：白圈 + 一条 Q 版小鱼，用圆形裁掉多余的部分 */
    var a = L.AVATAR;
    ctx.beginPath();
    ctx.arc(a.cx, a.cy, a.r + 3, 0, 6.2832);
    ctx.fillStyle = '#2a3352';
    ctx.fill();
    ctx.strokeStyle = TT.ink;
    ctx.lineWidth = 2.2;
    ctx.stroke();

    ctx.save();
    ctx.beginPath();
    ctx.arc(a.cx, a.cy, a.r, 0, 6.2832);
    ctx.clip();
    /* 鱼尾巴比身体长，缩略图那个居中偏移在圆里会显得贴左边，
     * 这里自己再往右挪 2px 补回来 */
    var fs = a.r * 1.46;
    fishArt.drawThumb(ctx, 'gold_fish', a.cx - fs / 2 + 2, a.cy - fs / 2, fs, fs);
    ctx.restore();

    /* 缸号徽章：挂在头像右下角，形状照手游里那颗等级章 */
    var tk = storage.activeTankOf(state) + 1;
    ctx.beginPath();
    ctx.arc(a.cx + a.r - 3, a.cy + a.r - 3, 9, 0, 6.2832);
    ctx.fillStyle = TT.vermilion;
    ctx.fill();
    ctx.strokeStyle = TT.goldLight;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 11px sans-serif';
    ctx.fillStyle = '#fff3d2';
    ctx.fillText(String(tk), a.cx + a.r - 3, a.cy + a.r - 2.5);

    /* 名字 + 鱼位数字 */
    var act = storage.activeTankOf(state);
    var here = storage.fishCountInTank(state, act);
    var perTank = storage.slotsPerTank(state);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '800 12.5px sans-serif';
    ctx.fillStyle = TT.text;
    ctx.fillText('水族箱', c.x + 66, c.y + 18);

    ctx.textAlign = 'right';
    ctx.font = '800 10.5px sans-serif';
    ctx.fillStyle = perTank > 0 && here >= perTank ? '#e06a55' : TT.textSoft;
    ctx.fillText(perTank > 0 ? here + '/' + perTank : String(here), c.x + c.w - 10, c.y + 18);

    /* 鱼位进度：槽 + 填充 */
    var b = L.BAR;
    var p = perTank > 0 ? Math.min(1, here / perTank) : 0;

    roundRect(ctx, b.x, b.y, b.w, b.h, b.h / 2);
    ctx.fillStyle = 'rgba(6,10,24,0.5)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(200,164,92,0.4)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    if (p > 0) {
        var fw = Math.max(b.h, b.w * p);
        var g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
        U.stop(g, 0, p >= 1 ? '#e07a55' : '#e0c170');
        U.stop(g, 1, p >= 1 ? '#a6332e' : '#9a7a35');
        roundRect(ctx, b.x, b.y, fw, b.h, b.h / 2);
        ctx.fillStyle = g;
        ctx.fill();

        /* 前半截一点淡金，做出牌匾的高光 */
        roundRect(ctx, b.x + 2, b.y + 2, Math.max(0, fw - 4), b.h * 0.34, b.h * 0.17);
        ctx.fillStyle = 'rgba(232,212,160,0.30)';
        ctx.fill();
    }
}

/* ---------------- 顶部：资源胶囊 ---------------- */

function pillBase(ctx, r) {
    Th.jelly(ctx, r.x, r.y, r.w, r.h, {
        top: TT.cardTop,
        bottom: TT.cardBottom,
        deep: TT.cardDeep,
        r: r.h / 2,
        depth: 2.5,
        ink: TT.ink,
        lw: 2.1,
        gloss: true
    });
}

/* 胶囊的左右内边距：图标贴左、数值贴右，两端各留 10px，
 * 不靠「左对齐 + 目测留白」—— 数值位数一变就会歪。 */
var PILL_PAD = 10;

function drawCoinPill(ctx, state) {
    var r = L.COIN_PILL;
    var cy = r.y + r.h / 2;
    pillBase(ctx, r);

    /* 金币半径 8，圆心离左内边距 8 → 左边缘正好落在 pad 上，
     * 27 高的胶囊里上下也各有 5.5 的空间，不会顶到描边。 */
    drawCoin(ctx, r.x + PILL_PAD + 8, cy, 8);

    var val = wallet.display(state, 'fish');
    var s = wallet.display(state, 's');

    ctx.textBaseline = 'middle';
    var right = r.x + r.w - PILL_PAD;

    /* S 币极少出现，有余额时才在最右端占一小块，主数值往左让位 */
    if (s > 0) {
        var st = wallet.format(s);
        ctx.textAlign = 'right';
        ctx.font = '800 11px sans-serif';
        ctx.fillStyle = TT.sky;
        ctx.fillText(st, right, cy + 0.5);
        var sw = ctx.measureText(st).width;
        drawCoinBlue(ctx, right - sw - 7, cy, 6.5);
        right = right - sw - 16;
    }

    ctx.textAlign = 'right';
    ctx.font = '800 15px sans-serif';
    ctx.fillStyle = TT.text;
    ctx.fillText(wallet.format(val), right, cy + 0.5);
}

function drawFishPill(ctx, state) {
    var r = L.FISH_PILL;
    var cy = r.y + r.h / 2;
    pillBase(ctx, r);

    /* 当前缸的鱼位进度已经在左边的玩家卡里了，
     * 这条胶囊读的是「所有缸加起来一共有几条鱼」。 */
    var total = (state.fish && state.fish.length) || 0;

    /* 鱼形尾巴向左伸到 -2.0s，所以 s 必须收小、圆心必须右移：
     * s=6.5 / 圆心在 pad+9 时，左边缘 = pad + 9 - 13 = pad - 4，
     * 仍可能碰到圆角描边，于是再往里推 4px。 */
    drawFishIcon(ctx, r.x + PILL_PAD + 13, cy, 6.5, '#6fbf9e');

    var right = r.x + r.w - PILL_PAD;

    ctx.textBaseline = 'middle';
    ctx.textAlign = 'right';
    ctx.font = '700 11px sans-serif';
    ctx.fillStyle = TT.textSoft;
    ctx.fillText('条', right, cy + 1);
    var uw = ctx.measureText('条').width;

    ctx.font = '800 15px sans-serif';
    ctx.fillStyle = TT.text;
    ctx.fillText(String(total), right - uw - 2, cy + 0.5);
}

function drawTopBar(ctx, state) {
    drawPlayerCard(ctx, state);
    drawCoinPill(ctx, state);
    drawFishPill(ctx, state);
}

/* ---------------- 鱼缸切换（圆点） ---------------- */

function drawTankTabs(ctx, state) {
    /* 只有一个缸时不显示：新手期少一个视觉噪点 */
    var n = storage.tankCountOf(state);
    if (n <= 1) return;
    var total = storage.maxTanks();
    var act = storage.activeTankOf(state);

    ctx.save();
    for (var i = 0; i < total; i++) {
        var r = L.tankTabRect(i, total);
        var cx = r.x + r.w / 2;
        var cy = r.y + r.h / 2;
        var owned = i < n;
        var on = i === act;

        Th.badge(ctx, cx, cy, 9.5, {
            top: on ? '#e0c170' : (owned ? TT.cardTop : '#232c46'),
            bottom: on ? '#a8802f' : (owned ? TT.cardBottom : '#1a2238'),
            ink: owned ? TT.ink : 'rgba(200,164,92,0.3)',
            lw: 2,
            gloss: on
        });

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 10px sans-serif';
        ctx.fillStyle = on ? '#fff3d2' : (owned ? TT.text : 'rgba(200,164,92,0.4)');
        ctx.fillText(String(i + 1), cx, cy + 0.5);
    }
    ctx.restore();
}

/* ---------------- 底部悬浮按钮 ----------------
 * M13 换了一版造型（照玩家给的参考图）：
 *   上面一枚厚木圈的圆形徽章，奶油底 + 手画图标；
 *   下面压一张胶囊标签，木棕色底 + 浅木色描边 + 奶油字。
 * 原来那条底栏木板删掉了，五枚按钮直接浮在水底，
 * 鱼缸一路延伸到底部，按钮像「站在沙地上」的路牌。
 */

var DOCK_DEFS = [
    { key: 'STORE_BTN', icon: 'shop', label: '商店' },
    { key: 'BAG_BTN', icon: 'warehouse', label: '仓库' },
    { key: 'POND_BTN', icon: 'tank', label: '鱼塘' },
    { key: 'CODEX_BTN', icon: 'book', label: '图鉴' },
    { key: 'SYS_BTN', icon: 'menu', label: '系统' }
];

/* 木色系（和描金主线同族，但更暖，压得住水底那层深蓝） */
var DOCK_INK = '#43280f';       /* 木框描边 */
var DOCK_RING_TOP = '#f4dfb9';
var DOCK_RING_BOT = '#c9a067';
var DOCK_FACE_TOP = '#fffbea';
var DOCK_FACE_BOT = '#ecd0a2';
var DOCK_PILL_TOP = '#c47e42';
var DOCK_PILL_BOT = '#8c5124';
var DOCK_PILL_EDGE = '#f7e2bd';
var DOCK_ICON = '#8d5a2b';      /* 奶油底上的图标色：木棕 */

var DOCK_TXT = '#fff8ea';

function drawDockButton(ctx, i, r, o) {
    var rad = L.BTN_R;
    var cx = r.x + r.w / 2;
    var cy = r.y + rad + 1;

    /* 投影：按钮是浮在水上的，底下压一团软阴影才不飘 */
    ctx.beginPath();
    ctx.arc(cx, cy + 4, rad + 3, 0, 6.2832);
    ctx.fillStyle = 'rgba(4,8,20,0.42)';
    ctx.fill();

    /* 外圈：厚木环 */
    var rg = ctx.createLinearGradient(cx, cy - rad - 3, cx, cy + rad + 3);
    U.stop(rg, 0, DOCK_RING_TOP);
    U.stop(rg, 1, DOCK_RING_BOT);
    ctx.beginPath();
    ctx.arc(cx, cy, rad + 2.5, 0, 6.2832);
    ctx.fillStyle = rg;
    ctx.fill();
    ctx.strokeStyle = DOCK_INK;
    ctx.lineWidth = 2.2;
    ctx.stroke();

    /* 里圈：奶油底，图标画在上面 */
    var fg = ctx.createRadialGradient(cx - rad * 0.3, cy - rad * 0.45, 2, cx, cy, rad);
    U.stop(fg, 0, DOCK_FACE_TOP);
    U.stop(fg, 1, DOCK_FACE_BOT);
    ctx.beginPath();
    ctx.arc(cx, cy, rad - 3.4, 0, 6.2832);
    ctx.fillStyle = fg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,82,38,0.45)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    /* 图标：往上抬 3px，给下面的胶囊让位。
     * 奶油底上不能用白图标（会糊掉），切成木棕色，和参考图一致。 */
    itemArt.draw(ctx, o.icon, cx, cy - 3, rad * 1.12, null, DOCK_ICON);

    /* 胶囊标签：压在圆底上，像挂在徽章下面的木牌 */
    var p = L.dockPillRect(i);

    U.roundRect(ctx, p.x, p.y + 2.5, p.w, p.h, p.h / 2);
    ctx.fillStyle = 'rgba(48,24,6,0.42)';
    ctx.fill();

    var pg = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    U.stop(pg, 0, DOCK_PILL_TOP);
    U.stop(pg, 1, DOCK_PILL_BOT);
    U.roundRect(ctx, p.x, p.y, p.w, p.h, p.h / 2);
    ctx.fillStyle = pg;
    ctx.fill();
    ctx.strokeStyle = DOCK_PILL_EDGE;
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 牌子上沿一点高光，木牌才有厚度 */
    U.roundRect(ctx, p.x + 4, p.y + 2.5, p.w - 8, p.h * 0.32, p.h * 0.16);
    ctx.fillStyle = 'rgba(255,240,210,0.22)';
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + (p.w < 50 ? 11 : 12) + 'px sans-serif';
    ctx.fillStyle = DOCK_TXT;
    ctx.fillText(o.label, p.x + p.w / 2, p.y + p.h / 2 + 0.5);
}

function drawButtons(ctx) {
    for (var i = 0; i < DOCK_DEFS.length; i++) {
        var d = DOCK_DEFS[i];
        drawDockButton(ctx, i, L[d.key], d);
    }
}

/* ---------------- 其它 ---------------- */

function drawFloaters(ctx, state) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 16px sans-serif';
    ctx.lineJoin = 'round';
    var list = state.view.floaters;
    for (var i = 0; i < list.length; i++) {
        var fl = list[i];
        var p = fl.t / fl.life;
        var y = fl.y - 42 * p;
        ctx.globalAlpha = Math.max(0, 1 - p * p);
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(6,10,24,0.8)';
        ctx.strokeText(fl.text, fl.x, y);
        ctx.fillStyle = fl.color;
        ctx.fillText(fl.text, fl.x, y);
    }
    ctx.restore();
}

function drawHint(ctx, state) {
    if (state.hint <= 0) return;

    var txt = '点鱼查看 · 捞出到仓库';
    ctx.save();
    ctx.globalAlpha = Math.min(1, state.hint);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 13px sans-serif';

    /* 直接压白字在水里，鱼游过来就糊成一团；
     * 做成一张浮在水里的半透明小卡片，和底部按钮是同一套语言 */
    var tw = ctx.measureText(txt).width;
    var bw = tw + 34;
    var by = C.TANK_TOP + 26;

    Th.jelly(ctx, (W - bw) / 2, by, bw, 34, {
        top: 'rgba(38,49,80,0.92)',
        bottom: 'rgba(26,35,64,0.92)',
        deep: 'rgba(6,10,24,0.5)',
        r: 17,
        depth: 2.5,
        ink: 'rgba(200,164,92,0.6)',
        lw: 1.8,
        gloss: false
    });

    ctx.fillStyle = TT.text;
    ctx.fillText(txt, W / 2, by + 17.5);
    ctx.restore();
}

/* Q 版不要暗角，保留函数让调用方不用改 */
function drawVignette() {
    /* 有意留空：卡通风格压暗会显脏 */
}

function drawToast(ctx, session) {
    if (!session.toast) return;
    ctx.save();
    var a = Math.min(1, session.toast.t * 3);
    ctx.globalAlpha = a;
    ctx.font = '700 14px sans-serif';
    var tw = ctx.measureText(session.toast.text).width + 36;

    Th.jelly(ctx, (W - tw) / 2, H * 0.36, tw, 42, {
        top: '#263150',
        bottom: '#1a2340',
        deep: TT.cardDeep,
        r: 21,
        depth: 3,
        ink: TT.ink,
        lw: 2.4
    });

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = TT.text;
    ctx.font = '700 14px sans-serif';
    ctx.fillText(session.toast.text, W / 2, H * 0.36 + 21.5);
    ctx.restore();
}

/* ---------------- 鱼缸缩放（M10：只留倍率角标） ----------------
 * +/− 按钮已删除，玻璃整块还给鱼。放大后只在右上角留一个
 * 小角标显示当前倍率，顺便提醒「双击还原」，不拦截任何点击。 */
function drawZoom(ctx) {
    var z = view.state.zoom;
    if (!(z > 1.001)) return;

    var r = L.ZOOM_BADGE;
    Th.jelly(ctx, r.x, r.y, r.w, r.h, {
        top: 'rgba(38,49,80,0.86)',
        bottom: 'rgba(26,35,64,0.86)',
        deep: 'rgba(6,10,24,0.45)',
        r: 10,
        depth: 2,
        ink: 'rgba(200,164,92,0.5)',
        lw: 1.6,
        gloss: false
    });

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 11px sans-serif';
    ctx.fillStyle = TT.goldLight;
    ctx.fillText(view.label(), r.x + r.w / 2, r.y + r.h / 2 + 0.5);
}

module.exports = {
    drawTopBar: drawTopBar,
    drawTankTabs: drawTankTabs,
    drawButtons: drawButtons,
    drawZoom: drawZoom,
    drawFloaters: drawFloaters,
    drawHint: drawHint,
    drawVignette: drawVignette,
    drawToast: drawToast
};

  };

  defs["render/sysmenu.js"] = function (module, exports, require) {
/* ============================================================
 * render/sysmenu.js · 系统弹层（底栏「系统」按钮打开）
 *
 * 原来底栏那枚 menu 按钮直接开商店面板，名字却叫「系统」，
 * 玩家找不到存档 / 清档这些真正的系统操作。
 * 现在商店有自己的按钮，这枚就只做系统的事：
 *   版本号、存档说明、收集进度、清档重开。
 *
 * 清档是危险操作，所以做二次确认：第一次点击只是「上膛」，
 * 按钮变红并在 3 秒内再点一次才会执行。
 * ============================================================ */

var C = require('./canvas.js');
var L = require('../ui/layout.js');
var cfg = require('../config/index.js');
var storage = require('../core/storage.js');
var codexLib = require('../core/codex.js');
var Th = require('./theme.js');
var TT = Th.T;

var W = C.W;
var H = C.H;

function line(ctx, x0, y0, x1, y1, color) {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.stroke();
}

function row(ctx, c, y, label, value, color) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '600 12.5px sans-serif';
    ctx.fillStyle = TT.textSoft;
    ctx.fillText(label, c.x + 26, y);

    ctx.textAlign = 'right';

  if (document.querySelector('#stage canvas')) return;   /* 已经跑起来了就不打扰 */
  var fb = document.getElementById('fallback');
  fb.style.display = 'block';
  fb.textContent = '启动失败：' + (e && e.message ? e.message : '未知错误');
});
</script>
</body>
</html>
