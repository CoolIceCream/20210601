<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d9b57e">
<meta name="format-detection" content="telephone=no">
<title>我的水族箱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; overflow: hidden; }

  body {
    position: fixed; inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, #25414f 0%, #14252e 45%, #0a141a 100%);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    touch-action: none;
  }

  /* 舞台：游戏画面的逻辑尺寸。
   * 底色和游戏里缸体外的木色完全一致 —— 手机上地址栏收起时
   * 等比缩放会留出几像素空白，同色才看不出接缝。 */
  #stage {
    position: absolute; left: 50%; top: 50%;
    transform-origin: center center;
    overflow: hidden;
    background: linear-gradient(#d9b57e, #bd9159);
  }

  /* 桌面：给舞台一圈阴影，像把手机放在桌上；手机铺满就不要。 */
  body.desk #stage {
    border-radius: 16px;
    box-shadow: 0 26px 70px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .1);
  }

  /* 手机上地址栏收起/展开会让舞台等比缩放一点点。
   * 露出来的部分用同一种木色，才看不出接缝。 */
  body.phone { background: linear-gradient(#d9b57e, #bd9159); }

  /* 手机横屏：这块是竖屏游戏，与其缩成一条不如直接提示转过来 */
  #rotate {
    position: fixed; inset: 0; z-index: 9;
    display: none; align-items: center; justify-content: center;
    background: #12232c;
    color: #ffd08a;
    padding: 0 40px;
    text-align: center;
    font: 600 15px/1.9 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body.tilt #rotate { display: flex; }
  body.tilt #stage { visibility: hidden; }

  #stage > canvas { display: block; }

  /* 截图模式（?stage=WxH）：左上角对齐、无圆角，便于逐像素核对 */
  body.shot #stage {
    left: 0; top: 0;
    border-radius: 0;
    box-shadow: none;
  }

  #fallback {
    position: absolute; left: 0; right: 0; top: 38%;
    padding: 0 28px;
    text-align: center; white-space: pre-wrap;
    color: #ffd08a;
    font: 600 14px/1.8 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: none;
  }
</style>
</head>
<body class="desk">
<div id="stage"></div>
<div id="fallback"></div>
<div id="rotate">这是竖屏游戏<br>请把手机转回来</div>

<script>
/* 容器页：决定「舞台」多大。
 * 手机竖屏 → 舞台 = 屏幕，一屏铺满；
 * 桌面 / 横屏 → 舞台固定 390×844（和微信里看到的排版逐像素一致），
 *               再用 transform 整体缩放塞进窗口。 */
(function () {
  var vw = window.innerWidth;
  var vh = window.innerHeight;

  /* 调试通道：?stage=390x844 强制一个逻辑尺寸并左上角对齐。
   * 无头浏览器报的 innerWidth 和 --window-size 经常对不上，
   * 有了它截图才能逐像素核对排版。真实用户不会带这个参数。 */
  var q = /[?&]stage=(\d+)x(\d+)/.exec(location.search);
  var forced = q ? { w: parseInt(q[1], 10), h: parseInt(q[2], 10) } : null;

  var phone;
  var W, H;

  if (forced) {
    phone = true;
    W = forced.w;
    H = forced.h;
    document.body.className = 'shot';
  } else {
    phone = vw <= 560 && vh > vw;
    W = phone ? vw : 390;
    H = phone ? vh : 844;
    document.body.className = phone ? 'phone' : 'desk';
  }

  /* platform.viewport() 会优先读这个值：
   * 布局按逻辑尺寸算，缩放到多大都不影响游戏内部排版。 */
  window.__stageSize = { w: W, h: H };

  var stage = document.getElementById('stage');
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';

  function fit() {
    if (forced) {
      stage.style.transform = 'none';
      return;
    }

    /* 横屏手机：竖屏游戏缩小了没法玩，直接改成提示转屏 */
    var tilt = window.innerWidth > window.innerHeight && window.innerHeight < 560;
    document.body.classList.toggle('tilt', tilt);
    if (tilt) return;

    var k = Math.min(window.innerWidth / W, window.innerHeight / H);
    /* 桌面上放大到 1.2 倍就到顶：再大就显得粗糙了 */
    if (!phone) k = Math.min(k, 1.2);
    if (!(k > 0)) k = 1;
    stage.style.transform = 'translate(-50%, -50%) scale(' + k + ')';
  }

  window.__fitStage = fit;

  var pending = 0;
  function later() {
    if (pending) clearTimeout(pending);
    pending = setTimeout(fit, 80);
  }

  window.addEventListener('resize', later);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 320); });
  /* 手机上地址栏收起/展开会改变可视高度，缩放要跟着走 */
  if (window.visualViewport) window.visualViewport.addEventListener('resize', later);

  fit();
})();
</script>

    /* 抽取（买鱼）：按缸内鱼数逐步放开品质池 */
    gacha: {
        /* 下标 = 品质档位（R=0 / SR=1 / SSR=2），值 = 需要多少条鱼才解锁 */
        unlockAt: [0, 5, 10],

        pity: 20

     * 鱼不产币之后，价格必须锚在「鱼的养育成本」上，否则会出现两种崩坏：
     *   · 卖价 >> 卵价  → 买卵卖鱼无限套利
     *   · 卖价 << 卵价  → 没人愿意养，经济停摆
     *
     * 锚点选「这条鱼从鱼苗养到成鱼要多久」：
     *   卖价 = 成鱼满额产出 × 成鱼耗时 × factor
     * 因为卖价与耗时成正比，而同一档里「收益 ÷ 耗时」只跟 incomeMul 有关，
     * 于是稀有度越高、单位时间赚得越多，玩家有稳定的升级动力，
     * 又不会因为多养几条就指数爆炸（上限由鱼位卡死）。

    sell: {
        /* 卖价 = baseRate × incomeMul × matureSeconds × factor
         * 0.8 的含义：这条鱼「一生总产出」的八成 */

        /* 成长折价：鱼苗只值 22%，成鱼 100%。
         * 曲线略凸（exp 1.15），中期涨得比线性快，鼓励养大而不是倒手。 */
        minRatio: 0.22,
        curveExp: 1.15,

        /* 带词条的鱼额外值钱（每条 +60%），抽到词条有惊喜 */
        traitBonus: 0.6,

        /* 卵价 = 该品质加权平均卖价 × 这个系数。

/* ============================================================
 * render/canvas.js · 画布与视口
 *
 * 全工程唯一创建 canvas 的地方。竖屏游戏，尺寸在启动时确定。
 *
 * 竖向分三段（M4 起「做出鱼缸的样子」）：
 *   ┌──────────────┐ 0
 *   │  缸盖 · 信息行 │ HEAD_H = 状态栏 + 44
 *   ├──────────────┤ TANK_TOP
 *   │              │
 *   │   水体（玻璃） │   ← 鱼、水草、珊瑚、沙底都在这里面
 *   │              │
 *   ├──────────────┤ TANK_BOTTOM
 *   │  底座 · 按钮  │   ← 撒食 / 商店 / 卖掉
 *   └──────────────┘ H
 *
 * 这样按钮永远不会压到水草和珊瑚，顶部信息也有一条自己的横条，
 * 而不是浮在水面上的两个胶囊。
 * ============================================================ */

var platform = require('../platform.js');

var info = platform.viewport();

var DPR = Math.min(info.pixelRatio || 2, 3);
var W = info.windowWidth;
var H = info.windowHeight;
var SB = info.statusBarHeight || 20;
var SAFE_BOTTOM = info.safeAreaBottom || 0;

/* ---- 三段的高度 ----
 * M6 起顶部和底部都长高了：上面是「玩家卡 + 两个资源条」，
 * 下面是「图标 + 文字」的方形按钮，都比原来那行小字和扁按钮占地方。
 * 中间的玻璃相应变矮一点，仍然是最宽裕的一块。 */
var HEAD_H = SB + 74;

var BTN_H = 74;
var BTN_Y = H - SAFE_BOTTOM - 10 - BTN_H;      /* 按钮顶边 */
var TANK_TOP = HEAD_H;
var TANK_BOTTOM = BTN_Y - 18;                  /* 缸底 = 按钮带上方 18px */

/* 沙底：鱼贴着它游，水草珊瑚从这里长出来 */
var GROUND = TANK_BOTTOM - 58;

/* 玻璃左右各留 8px 作为缸壁（细线勾出来的那种，不是厚框） */
var FRAME_X = 8;

var canvas = platform.createCanvas(W, H, DPR);
if (!canvas) {
    throw new Error('createCanvas() 返回空（W=' + W + ' H=' + H + ' DPR=' + DPR + '）');
}

/* ============================================================
 * core/offline.js · 离线结算（M3：结算成长，不结算金币）
 *
 * 鱼不再自动产币之后，离线能给的只有「时间」本身：
 *   鱼在缸里照常长大，回来一看能卖得更贵。

 *   有效秒数 = 时长 × growthEfficiency（默认 50%）；

var storage = require('./storage.js');

    state.lastSeenAt = nowMs;

    var O = cfg.economy.offline;
    if (rawSeconds < (O.minSeconds || 60)) return null;

    var capHours = storage.offlineHoursOf(state);
    var capSeconds = capHours * 3600;
    var seconds = Math.min(rawSeconds, capSeconds);
    var capped = rawSeconds > capSeconds;

    var eff = O.growthEfficiency == null ? 1 : O.growthEfficiency;
    var effective = seconds * eff;
    var floor = O.hungerFloor == null ? 0 : O.hungerFloor;
    var decay = cfg.economy.feeding.hungerDecay;

    var grown = 0;
    var adult = 0;
    var before = 0;
    var after = 0;

     * 这样弹窗的涨跌才是真的，不会假装它们从来没出现过。 */

     * 它不吃鱼饵，所以离线不会因为它而少掉饲料。 */

        adult: adult,
        eaten: eaten,
        total: state.fish.length,
        before: before,
        after: after,
        gain: after - before

    return result;
}

    settle: settle
};

    yellowBottom: '#ffb524',
    yellowDeep: 'rgba(176,105,20,0.42)',

    greenBottom: '#57b93c',
    greenDeep: 'rgba(38,104,30,0.4)',

    greyBottom: '#d8c9ab',

        ctx.lineWidth = opt.lw || 2.4;

    rr: rr,
    jelly: jelly,
    badge: badge,
    card: card,
    textOutlined: textOutlined,
    text: text

    line(ctx, 0.075);

    /* 三颗颗粒落在标签带上，错开摆才不会读成「三个点」 */
    var dots = [[-0.13, 0.08], [0.14, 0.08], [0.00, 0.08]];
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (var i = 0; i < dots.length; i++) {
        ctx.beginPath();
        ctx.arc(dots[i][0], dots[i][1], 0.062, 0, 6.2832);
        ctx.fill();
    }
}

/* 珊瑚摆件：礁石 + 三根粗细不同的圆头指枝
 * 这一格试错最多，记下来省得再走一遍：
 *   v1 三根细枝 → 读成字母「Y」；
 *   v2 三个圆球 + 礁石 → 读成雪人 / 熊猫头（球一叠就有眼睛的错觉）。
 * 结论：小尺寸要靠「粗细 + 高低差」，所以改成三根圆头柱，
 * 长短错开、宽窄错开，剪影就只可能是珊瑚丛。 */
function coral(ctx) {
    /* 每根从礁石里「长」出来：以根部为轴转一点角度，向外张开 */
    var arms = [
        [-0.26, 0.40, 0.165, -0.18],   /* 左矮，往左倒 */
        [0.24, 0.46, 0.160, 0.16],     /* 右中，往右倒 */
        [0.00, 0.70, 0.200, 0.00]      /* 中间最高最粗，直立 */
    ];
    for (var i = 0; i < arms.length; i++) {
        var a = arms[i];
        ctx.save();
        ctx.translate(a[0], 0.30);
        ctx.rotate(a[3]);
        U.roundRect(ctx, -a[2] / 2, -a[1], a[2], a[1] + 0.10, a[2] / 2);
        white(ctx, 1);
        line(ctx, 0.07);
        ctx.restore();
    }

    /* 礁石压在最下面，遮住枝根 */
    U.roundRect(ctx, -0.42, 0.27, 0.84, 0.21, 0.10);
    white(ctx, 0.95);
    line(ctx, 0.07);
}

/* 自动喂食器：齿轮（八齿 + 轴孔） */
function auto(ctx, bg) {
    for (var i = 0; i < 8; i++) {
        ctx.save();
        ctx.rotate(i * Math.PI / 4);
        U.roundRect(ctx, -0.10, -0.49, 0.20, 0.21, 0.05);
        white(ctx, 1);
        line(ctx, 0.06);
        ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(0, 0, 0.34, 0, 6.2832);
    white(ctx, 1);
    line(ctx, 0.075);

    /* 轴孔填底色才像「洞」；用半透明墨色在深色块上会发灰 */
    ctx.beginPath();
    ctx.arc(0, 0, 0.145, 0, 6.2832);
    ctx.fillStyle = bg || '#8a6d1f';
    ctx.fill();
}

/* 仓库扩容：木箱（外框 + 内框 + 交叉板条） */
function warehouse(ctx) {
    U.roundRect(ctx, -0.46, -0.42, 0.92, 0.85, 0.10);
    white(ctx, 1);
    line(ctx, 0.08);

    U.roundRect(ctx, -0.32, -0.28, 0.64, 0.57, 0.05);
    line(ctx, 0.062);

    ctx.beginPath();
    ctx.moveTo(-0.32, -0.28);
    ctx.lineTo(0.32, 0.29);
    ctx.moveTo(0.32, -0.28);
    ctx.lineTo(-0.32, 0.29);
    line(ctx, 0.062);
}

/* 新鱼缸：圆口玻璃缸（水 + 一条小鱼 + 缸口 + 底座）
 * 方缸试了两版都读成「显示器」—— 方框 + 一条横的水位线，
 * 和屏幕太像了。换成金鱼缸的圆肚剪影，一眼就不会认错。 */
function tank(ctx) {
    var R = 0.38;          /* 缸肚半径 */
    var CY = 0.02;         /* 缸肚中心 */

    ctx.save();
    ctx.beginPath();
    ctx.arc(0, CY, R, 0, 6.2832);
    ctx.clip();

    /* 水面：两条反向二次曲线，才是「晃着的水」 */
    ctx.beginPath();
    ctx.moveTo(-R - 0.02, CY - 0.04);
    ctx.quadraticCurveTo(-R * 0.42, CY - 0.12, 0, CY - 0.04);
    ctx.quadraticCurveTo(R * 0.42, CY + 0.04, R + 0.02, CY - 0.05);
    ctx.lineTo(R + 0.02, CY + R + 0.05);
    ctx.lineTo(-R - 0.02, CY + R + 0.05);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fill();

    /* 小鱼：缸里唯一的深色块，视线先落这儿 */
    ctx.fillStyle = INK_SOFT;
    ctx.beginPath();
    U.ellipse(ctx, 0.05, CY + 0.19, 0.135, 0.09, 0);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-0.05, CY + 0.19);
    ctx.lineTo(-0.20, CY + 0.10);
    ctx.lineTo(-0.20, CY + 0.28);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    /* 缸肚轮廓 */
    ctx.beginPath();
    ctx.arc(0, CY, R, 0, 6.2832);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 0.085;
    ctx.stroke();

    /* 缸口：一圈扁椭圆，缸才「开口」了 */
    ctx.beginPath();
    U.ellipse(ctx, 0, CY - R * 0.80, R * 0.86, 0.072, 0);
    white(ctx, 0.9);
    line(ctx, 0.065);

    /* 冒到水面上的两颗气泡 */
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(0.19, CY - 0.14, 0.05, 0, 6.2832);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0.09, CY - 0.24, 0.034, 0, 6.2832);
    ctx.fill();

    /* 底座 */
    U.roundRect(ctx, -0.25, CY + R - 0.06, 0.50, 0.15, 0.06);
    white(ctx, 1);
    line(ctx, 0.065);
}

/* 金币：唯一一个「不白」的图标 —— 白圆加内圈在 28px 下会读成靶心，
 * 金币本身就该是金的，干脆直接上金色渐变，放在任何色底上都成立。 */
function coin(ctx) {
    var g = ctx.createLinearGradient(0, -0.4, 0, 0.4);
    g.addColorStop(0, '#ffe680');
    g.addColorStop(0.55, '#f8c62e');
    g.addColorStop(1, '#e09a12');

    ctx.beginPath();
    ctx.arc(0, 0, 0.40, 0, 6.2832);
    ctx.fillStyle = g;
    ctx.fill();
    line(ctx, 0.075);

    ctx.beginPath();
    ctx.arc(0, 0, 0.255, 0, 6.2832);
    ctx.strokeStyle = 'rgba(140,84,6,0.6)';
    ctx.lineWidth = 0.05;
    ctx.stroke();

    ctx.beginPath();
    var R = 0.155, r = 0.05;
    for (var i = 0; i < 8; i++) {
        var a = -Math.PI / 2 + i * Math.PI / 4;
        var rad = (i % 2 === 0) ? R : r;
        var px = Math.cos(a) * rad;
        var py = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(150,90,8,0.85)';
    ctx.fill();

    /* 左上角一点高光，金色才有金属感 */
    ctx.beginPath();
    ctx.arc(-0.13, -0.15, 0.075, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fill();
}

/* 商店：遮阳棚 + 店面 + 门
 * 棚上两条深色条纹是必需的 —— 没有条纹，梯形会被读成「屋顶」。 */
function shop(ctx) {
    ctx.beginPath();
    ctx.moveTo(-0.46, -0.44);
    ctx.lineTo(0.46, -0.44);
    ctx.lineTo(0.40, -0.16);
    ctx.lineTo(-0.40, -0.16);
    ctx.closePath();
    white(ctx, 1);
    line(ctx, 0.07);

    /* 条纹裁进棚里，四角不会戳出来 */
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-0.46, -0.44);
    ctx.lineTo(0.46, -0.44);
    ctx.lineTo(0.40, -0.16);
    ctx.lineTo(-0.40, -0.16);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = INK_SOFT;
    ctx.fillRect(-0.13, -0.46, 0.10, 0.32);
    ctx.fillRect(0.15, -0.46, 0.10, 0.32);
    ctx.restore();

    U.roundRect(ctx, -0.36, -0.13, 0.72, 0.55, 0.08);
    white(ctx, 1);
    line(ctx, 0.075);

    U.roundRect(ctx, -0.13, 0.10, 0.26, 0.32, 0.05);
    ctx.fillStyle = INK_SOFT;
    ctx.fill();
}

var ART = {
    feed: feed,
    coral: coral,
    auto: auto,
    warehouse: warehouse,
    tank: tank,
    coin: coin,
    shop: shop
};

/* ---------------- 入口 ---------------- */

/**
 * 在 (cx, cy) 画一个边长 size 的图标。
 * bg 是所在色块的底色，只在「需要挖洞」的图标（齿轮轴孔）里用到。
 */
function draw(ctx, id, cx, cy, size, bg) {
    var fn = ART[id] || ART.feed;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(size, size);
    fn(ctx, bg);
    ctx.restore();
}

module.exports = {
    draw: draw
};

  };

  defs["render/sell.js"] = function (module, exports, require) {
/* ============================================================
 * render/sell.js · 选中鱼与「卖掉」按钮（M3）
 *
 * 为什么不「点一下就卖」：
 *   点水面是撒食，是最高频的操作。鱼又总在手指底下游，
 *   一次误触就把养了十分钟的成鱼卖掉，玩家会砸手机。
 *
 * 所以拆成两步：点鱼 → 高亮选中（鱼身光圈 + 头顶价签），
 * 底部浮出「卖掉 +350」，点这个按钮才成交。
 * 点空白处取消选中，顺便撒食，两个操作互不干扰。
 * ============================================================ */

var C = require('./canvas.js');
var U = require('./util.js');
var L = require('../ui/layout.js');
var Th = require('./theme.js');
var TT = Th.T;
var itemArt = require('./itemart.js');
var fishLib = require('../core/fish.js');
var wallet = require('../core/wallet.js');

var W = C.W;

/* 当前选中的鱼；被卖掉/切缸后自动失效 */
function selectedOf(state) {
    var id = state.view && state.view.selFish;
    if (!id) return null;
    var act = state.activeTank || 0;
    for (var i = 0; i < state.fish.length; i++) {
        var f = state.fish[i];
        if (f.id === id && (f.tank || 0) === act) return f;
    }
    return null;
}

/* 光圈 + 头顶价签 */
function drawSelection(ctx, state) {
    var f = selectedOf(state);
    if (!f) return;

    var size = fishLib.sizeOf(f);
    var r = size * 0.82;
    var pulse = 0.75 + Math.sin((state.t || 0) * 4) * 0.18;

    /* 选中光圈：一圈金色，外带一层柔光，别用虚线（部分机型 lineDash 支持不稳） */
    ctx.save();
    ctx.beginPath();
    ctx.arc(f.x, f.y, r, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,214,110,0.16)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(f.x, f.y, r, 0, 6.2832);
    ctx.strokeStyle = 'rgba(255,198,70,' + pulse.toFixed(2) + ')';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();

    /* 价签 */
    var sp = fishLib.speciesById(f.speciesId);
    var price = fishLib.sellPriceOf(f);
    var txt = sp.name + ' · 卖 ' + wallet.format(price);

    ctx.save();
    ctx.font = '800 12px sans-serif';
    var tw = ctx.measureText(txt).width;
    var bw = Math.min(W - 20, tw + 24);
    var bx = U.clamp(f.x - bw / 2, 8, W - 8 - bw);
    var by = f.y - r - 32;

    Th.jelly(ctx, bx, by, bw, 24, {
        top: '#fffdf6', bottom: '#ffe6b0',
        deep: 'rgba(150,100,40,0.30)',
        r: 12, depth: 2, ink: TT.ink, lw: 2, gloss: false
    });

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = TT.text;
    ctx.font = '800 12px sans-serif';
    ctx.fillText(U.fitText(ctx, txt, bw - 12), bx + bw / 2, by + 12.5);
    ctx.restore();
}

/* 底部中间那格：「卖掉」常驻，颜色跟选中状态走。
 * 卡面跟着 M6 那套按钮走（浅米卡面 + 圆形徽章），
 * 没选鱼时整颗徽章是灰的、点了给一句提示；
 * 选中后卡面转暖橙、徽章里的金币亮起来，标签直接换成价格。 */
function drawSellButton(ctx, state) {
    var b = L.SELL_BTN;
    var f = selectedOf(state);
    var cx = b.x + b.w / 2;
    var cy = b.y + 27;

    if (!f) {
        Th.jelly(ctx, b.x, b.y, b.w, b.h, {
            top: '#fbf7ee',
            bottom: '#efe5d2',
            deep: 'rgba(140,98,52,0.2)',
            r: 22,
            depth: 5,
            ink: 'rgba(107,68,35,0.32)',
            lw: 2.4,
            gloss: false
        });

        Th.badge(ctx, cx, cy, 19, {
            top: '#f3ebdb',
            bottom: '#d9cbb2',
            ink: 'rgba(107,68,35,0.34)',
            lw: 2.2,
            gloss: false
        });

        itemArt.draw(ctx, 'coin', cx, cy, 28);

        /* 金币是金色的，放在灰徽章里会跳出来破坏「不可用」的感觉。
         * 用一层同色蒙版压暗，比调 globalAlpha 稳（那只影响透明度，会透出底色）。 */
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, 18.4, 0, 6.2832);
        ctx.clip();
        ctx.fillStyle = 'rgba(244,238,226,0.74)';
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 13px sans-serif';
        ctx.fillStyle = '#b6a486';
        ctx.fillText('卖掉', cx, b.y + 61);
        ctx.restore();
        return;
    }

    var price = fishLib.sellPriceOf(f);

    Th.jelly(ctx, b.x, b.y, b.w, b.h, {
        top: '#ffe6a8',
        bottom: '#ffc266',
        deep: 'rgba(160,88,10,0.38)',
        r: 22,
        depth: 5,
        ink: '#8a4a10',
        lw: 2.6,
        gloss: false
    });

    /* 徽章用浅米底而不是橙色：金色金币压在橙底上会糊成一团，
     * 换成浅底，金币的轮廓和中间的星才立得住。 */
    Th.badge(ctx, cx, cy, 19, {
        top: '#fffdf2',
        bottom: '#ffe7b8',
        ink: '#8a4a10',
        lw: 2.4
    });

    itemArt.draw(ctx, 'coin', cx, cy, 28);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 14px sans-serif';
    ctx.fillStyle = '#7d3f08';
    ctx.fillText('+' + wallet.format(price), cx, b.y + 61);
    ctx.restore();
}

module.exports = {
    selectedOf: selectedOf,
    drawSelection: drawSelection,
    drawSellButton: drawSellButton
};

  };

  defs["ui/debug-panel.js"] = function (module, exports, require) {
/* ============================================================
 * ui/debug-panel.js · 调试面板（M0 交付项 T0-5）
 *
 * 打开方式：连续点左上角金币胶囊 5 次。
 * 作用：不靠反复玩就能验数值 —— 加币、加鱼、快进时间、清档。
 * 发布前把 config.debug.enabled 设为 false 即整体失效。
 * ============================================================ */

var C = require('../render/canvas.js');
var U = require('../render/util.js');
var cfg = require('../config/index.js');
var wallet = require('../core/wallet.js');
var fishLib = require('../core/fish.js');
var storage = require('../core/storage.js');
var offline = require('../core/offline.js');
var platform = require('../platform.js');

var W = C.W;
var H = C.H;
var roundRect = U.roundRect;

var PW = Math.min(W - 40, 336);
var PX = (W - PW) / 2;
var PY = H * 0.2;
var BTN_H = 44;
var BTN_GAP = 10;
var COLS = 2;

var ITEMS = [
    { id: 'coin', label: '+1000 鱼币' },
    { id: 'sc', label: '+100 S币' },
    { id: 'fish', label: '加一条鱼' },
    { id: 'skip', label: '快进 1 小时' },
    { id: 'save', label: '立即存档' },
    { id: 'clear', label: '清档重开' }
];

var ROWS = Math.ceil(ITEMS.length / COLS);
var PH = 66 + ROWS * (BTN_H + BTN_GAP) + 24;

function panelRect() {
    return { x: PX, y: PY, w: PW, h: PH };
}

function btnRect(i) {
    var col = i % COLS;
    var row = Math.floor(i / COLS);
    var gapX = 12;
    var bw = (PW - 24 - gapX) / 2;
    return {
        x: PX + 12 + col * (bw + gapX),
        y: PY + 56 + row * (BTN_H + BTN_GAP),
        w: bw,
        h: BTN_H
    };
}

function closeRect() {
    return { x: PX + PW - 42, y: PY + 12, w: 30, h: 30 };
}

function draw(ctx, session, state) {
    if (!session.debug.open) return;

    var p = panelRect();
    roundRect(ctx, p.x, p.y, p.w, p.h, 18);
    ctx.fillStyle = 'rgba(6,24,36,0.95)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,220,255,0.28)';
    ctx.lineWidth = 1;
    ctx.stroke();

    /* 标题 */
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '700 15px sans-serif';
    ctx.fillStyle = '#eaf6ff';
    ctx.fillText('调试面板', p.x + 14, p.y + 27);

    ctx.font = '400 11px sans-serif';
    ctx.fillStyle = '#6d94a6';
    var tag = 'FPS ' + session.fps.toFixed(0) + ' · Q版';
    ctx.fillText(tag, p.x + 88, p.y + 28);

    /* 关闭 */
    var cr = closeRect();
    ctx.textAlign = 'center';
    ctx.font = '400 18px sans-serif';
    ctx.fillStyle = '#a9d6ea';
    ctx.fillText('×', cr.x + 15, cr.y + 15);

    /* 按钮 */
    for (var i = 0; i < ITEMS.length; i++) {
        var b = btnRect(i);
        roundRect(ctx, b.x, b.y, b.w, b.h, 11);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(120,220,255,0.12)';
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '600 13px sans-serif';
        ctx.fillStyle = '#cfeeff';

        var label = ITEMS[i].label;
        if (ITEMS[i].id === 'skip') {
            label = '快进 1 小时';
        }
        ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1);
    }

    /* 状态行 */
    ctx.textAlign = 'left';
    ctx.font = '400 11px sans-serif';
    ctx.fillStyle = '#5f8497';
    var value = 0;
    for (var i = 0; i < state.fish.length; i++) value += fishLib.sellPriceOf(state.fish[i]);
    ctx.fillText('全缸身价 ' + wallet.format(value) + ' · 鱼 ' + state.fish.length +
        ' 条 · 账本 ' + state.ledger.length + ' 条', p.x + 14, p.y + PH - 12);
}

/* 返回 true 表示这次点击被面板吃掉了 */
function tap(x, y, session, env) {
    if (!session.debug.open) return false;

    var p = panelRect();
    if (!U.inRect(x, y, p)) {
        session.debug.open = false;
        return true;
    }

    if (U.inRect(x, y, closeRect())) {
        session.debug.open = false;
        return true;
    }

    for (var i = 0; i < ITEMS.length; i++) {
        if (!U.inRect(x, y, btnRect(i))) continue;
        run(ITEMS[i].id, session, env);
        return true;
    }
    return true;
}

function run(id, session, env) {
    var state = env.state;

    if (id === 'coin') {
        wallet.add(state, 'fish', 1000, 'debug');
        session.showToast('鱼币 +1000');
    } else if (id === 'sc') {
        wallet.add(state, 's', 100, 'debug');
        session.showToast('S币 +100');
    } else if (id === 'fish') {
        /* 调试加鱼也守鱼位，否则会造出 16/15 这种自相矛盾的界面 */
        if (storage.roomOf(state) <= 0) {
            session.showToast('鱼位满了');
            return;
        }
        var sp = fishLib.randomSpecies();
        state.fish.push(fishLib.create(sp.id, { growth: 30, tank: storage.activeTankOf(state) }));
        env.sim.ensurePlacement(state, env.viewport);
        session.showToast('加了一条 ' + sp.name);
    } else if (id === 'skip') {
        state.lastSeenAt -= 3600 * 1000;
        var r = offline.settle(state, platform.now());
        if (r && r.grown > 0) {
            session.modal = {
                type: 'offline',
                seconds: r.seconds,
                rawSeconds: r.rawSeconds,
                grown: r.grown,
                adult: r.adult,

    if (y < C.TANK_TOP || y > C.TANK_BOTTOM) return;
    var fw = view.toWorld(x, y);
    env.sim.feed(state, fw.x, Math.min(fw.y, C.ground - 40), env.sim.pelletsFor(state, require('../config/index.js').economy.feeding.pelletsTap), C.viewport);
}

function dist(a, b) {
    var dx = a.clientX - b.clientX;
    var dy = a.clientY - b.clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

function mid(a, b) {
    return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
}

function attach(env) {
    var platform = require('../platform.js');
    var pending = null;   /* 还没决定是「点」还是「拖」 */
    var drag = null;
    var pinch = null;
    var lastTap = null;

    platform.onTouchStart(function (e) {
        var ts = e.touches && e.touches.length ? e.touches : [];

        /* 三指同时点屏：切换诊断条。正常游戏里不可能误触 */
        if (ts.length >= 3) {
            var diag = require('./diag.js');
            diag.state.forceShow = !diag.state.forceShow;
            pending = drag = pinch = null;
            return;
        }

        if (ts.length >= 2) {
            var m = mid(ts[0], ts[1]);
            pinch = { d: dist(ts[0], ts[1]), x: m.x, y: m.y };
            pending = null;
            drag = null;
            return;
        }

        if (ts.length === 1) {

            if (pinch.d > 0) view.pinch(d / pinch.d);
            var c = mid(ts[0], ts[1]);
            view.pan(c.x - pinch.x, c.y - pinch.y);
            pinch.d = d;
            pinch.x = c.x;
            pinch.y = c.y;
            return;

         * 一旦判定为拖动，这次抬手就不再当成点击（不会误撒食/误卖鱼）。 */
        var canPan = view.state.zoom > 1 && view.inGlass(drag.x, drag.y) &&
            !U.inRect(drag.x, drag.y, L.ZOOM_IN) &&
            !U.inRect(drag.x, drag.y, L.ZOOM_OUT);
        if (canPan) view.pan(p.clientX - drag.x, p.clientY - drag.y);

        drag.y = p.clientY;

            if (!(e.touches && e.touches.length >= 2)) pinch = null;

            drag = null;
            return;

        var p = pending;
        pending = null;
        drag = null;

        /* 放大状态下双击鱼缸还原；未放大时仍走正常点击，不影响连续撒食。

        var onZoomBtn = U.inRect(p.x, p.y, L.ZOOM_IN) || U.inRect(p.x, p.y, L.ZOOM_OUT);
        var nowT = Date.now();
        if (!onZoomBtn && view.state.zoom > 1 && lastTap && nowT - lastTap.t < 350 &&
            Math.abs(p.x - lastTap.x) < 28 && Math.abs(p.y - lastTap.y) < 28) {
            lastTap = null;
            view.reset();
            env.session.showToast('鱼缸已还原');

        tap(p.x, p.y, env);
    });

module.exports = {
    attach: attach,
    tap: tap
};

  defs["render/decor.js"] = function (module, exports, require) {
/* ============================================================
 * render/decor.js · 场景装饰（纯视觉，不参与玩法）
 *
 * 水草、碎石、悬浮微粒、珊瑚。这些都是「看起来怎样」的东西，
 * 全部放在渲染层，逻辑层完全不感知。
 * ============================================================ */

var U = require('./util.js');

function makeCoral(x, hue) {
    var n = 4 + Math.floor(Math.random() * 3);
    var br = [];
    for (var i = 0; i < n; i++) {
        var a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.44;
        br.push({ a: a, len: U.rand(22, 46), w: U.rand(4, 7) });
    }
    return { x: x, hue: hue, br: br, s: U.rand(0.85, 1.2) };
}

function build(W, H, ground, corals, top) {
    var d = { plants: [], pebbles: [], motes: [], corals: [] };

    var n = Math.round(W / 38) + 10;
    for (var i = 0; i < n; i++) {
        var front = Math.random() > 0.42;
        d.plants.push({
            x: (i + U.rand(0.1, 0.9)) * (W / n),
            /* Q 版水草要粗一点、胖一点，细长条在明亮背景上会显得脏 */
            h: front ? U.rand(90, 190) : U.rand(60, 135),
            w: front ? U.rand(12, 22) : U.rand(7, 12),
            sway: U.rand(0, 6.28),
            spd: U.rand(0.5, 1.05),
            layer: front ? 1 : 0,
            hue: U.rand(150, 180) + (front ? 0 : 10)
        });
    }

    for (var p = 0; p < 18; p++) {
        d.pebbles.push({ x: U.rand(0, W), r: U.rand(9, 26), dy: U.rand(-2, 12) });
    }

    /* 微粒只在玻璃里面飘：缸盖和底座上面不该有小白点 */
    var mTop = top || 0;
    for (var m = 0; m < 34; m++) {
        d.motes.push({
            x: U.rand(0, W),
            y: U.rand(mTop, H),
            r: U.rand(0.6, 2.1),
            vy: U.rand(-6, -1.5),
            vx: U.rand(-4, 4),
            a: U.rand(0.05, 0.22)
        });
    }

    d.corals = buildCorals(W, corals);
    return d;
}

function buildCorals(W, corals) {
    var list = [];
    for (var i = 0; i < corals; i++) {
        var hue = 8 + i * 47;
        list.push(makeCoral(W * ((i + 0.6) / (corals + 0.6)) + U.rand(-20, 20), hue));
    }
    return list;
}

/* 微粒缓慢上浮，纯视觉效果 */
function updateMotes(d, dt, W, H, top) {
    var mTop = top || 0;
    for (var i = 0; i < d.motes.length; i++) {
        var m = d.motes[i];
        m.y += m.vy * dt;
        m.x += m.vx * dt + Math.sin(m.r * 9 + m.y * 0.01) * 2.6 * dt;
        if (m.y < mTop - 12) {
            m.y = H + 12;
            m.x = U.rand(0, W);
        }
        if (m.x < -12) m.x = W + 12;
        if (m.x > W + 12) m.x = -12;
    }
}

module.exports = {
    build: build,
    buildCorals: buildCorals,
    updateMotes: updateMotes
};

  };

  defs["render/fishart.js"] = function (module, exports, require) {
/* ============================================================
 * render/fishart.js · Q 版小鱼（纯矢量，无贴图）
 *
 * 换成 Q 版界面后，水彩贴图和果冻按钮放一起太「写实」，
 * 这里用贝塞尔手绘一套卡通鱼：圆胖身体、大眼、腮红、小嘴、
 * 顶光高光、心形尾鳍 —— 和 theme.js 的果冻按钮同一种语言。
 *
 * 坐标约定：+x 是鱼头方向，原点在身体中心。
 * dir = -1 时整体水平镜像，tilt 也跟着镜像（和原来贴图一致）。
 *
 * 体型差异靠 LOOK 表参数化（半长/半高/尾长/尾型/花纹），
 * 九个物种共用一套画法，只改比例，包体几乎不增。
 * ============================================================ */

var U = require('./util.js');
var fishLib = require('../core/fish.js');

/* 8 套配色：[主色, 暗部色]，索引对应 config/species.js 的 palette */
var PALETTE = [
    ['#ffd479', '#ef7d34'],   /* 0 金 */
    ['#a8ecf7', '#2f9fc4'],   /* 1 蓝 */
    ['#ffc2da', '#e86b9e'],   /* 2 粉 */
    ['#ffe97a', '#e3a018'],   /* 3 亮黄 */
    ['#c3b4ff', '#7256d6'],   /* 4 紫 */
    ['#8ff2c8', '#18a97a'],   /* 5 青绿 */
    ['#ff9e94', '#d8443c'],   /* 6 红 */
    ['#eaf2f7', '#8fa9b8'],   /* 7 白 */
    ['#b9ccd8', '#54768e']    /* 8 鲨鱼灰蓝 */
];

/* 每个物种的外形参数
 *   a/b    半长、半高（相对体型基准 L 的倍率）
 *   len    尾鳍长度系数
 *   spread 尾鳍张开度
 *   notch  尾鳍凹口深度（0 = 平尾，0.5 = 燕尾）
 *   pat    花纹：null / 'spot' / 'stripe'
 *   barbel 龙须
 */
var LOOK = {
    gold_fish: { a: 0.46, b: 0.40, len: 0.58, spread: 1.00, notch: 0.46, pat: null },
    blue_zebra: { a: 0.46, b: 0.40, len: 0.60, spread: 1.04, notch: 0.46, pat: 'stripe' },
    peach_koi: { a: 0.50, b: 0.36, len: 0.56, spread: 0.96, notch: 0.44, pat: 'spot' },
    gold_lamp: { a: 0.44, b: 0.43, len: 0.56, spread: 1.00, notch: 0.46, pat: null },
    violet: { a: 0.46, b: 0.41, len: 0.58, spread: 1.00, notch: 0.46, pat: null },
    jade: { a: 0.50, b: 0.37, len: 0.58, spread: 1.00, notch: 0.46, pat: 'spot' },
    dusk_betta: { a: 0.44, b: 0.44, len: 0.95, spread: 1.24, notch: 0.52, pat: null },
    red_arrow: { a: 0.54, b: 0.31, len: 0.64, spread: 0.76, notch: 0.30, pat: null },
    gold_dragon: { a: 0.56, b: 0.33, len: 0.92, spread: 1.10, notch: 0.50, pat: 'stripe', barbel: true },
    reef_shark: { a: 0.60, b: 0.31, len: 0.62, spread: 0.86, notch: 0.60, pat: null, shark: true }
};

var EYE_INK = '#3a2418';
var CREAM = '#fffdf3';

/* ---------------- 颜色小工具 ---------------- */

function rgbOf(hex) {
    var s = hex.replace('#', '');
    return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
}

/* c1 向 c2 混合，t=0 全 c1 */
function mix(c1, c2, t) {
    if (c1 === c2 || t <= 0) return c1;
    var x = rgbOf(c1);
    var y = rgbOf(c2);
    return 'rgb(' +
        Math.round(x[0] + (y[0] - x[0]) * t) + ',' +
        Math.round(x[1] + (y[1] - x[1]) * t) + ',' +
        Math.round(x[2] + (y[2] - x[2]) * t) + ')';
}

/* 描边色：往暖棕压暗，比纯黑柔和，和界面描边同一族 */
function inkOf(c) {
    return mix(c, '#2e1a0c', 0.62);
}

/* ---------------- 形状 ---------------- */

/* 蛋形鱼身：头在 +x，吻部竖直相切成圆头，尾根收成一小段竖面（被尾鳍盖住） */
function bodyPath(ctx, a, b) {
    ctx.beginPath();
    ctx.moveTo(a, 0);
    ctx.bezierCurveTo(a * 1.00, -b * 0.36, a * 0.84, -b * 0.88, a * 0.28, -b * 1.02);
    ctx.bezierCurveTo(-a * 0.26, -b * 1.02, -a * 0.76, -b * 0.52, -a * 0.86, -b * 0.08);
    ctx.lineTo(-a * 0.86, b * 0.08);
    ctx.bezierCurveTo(-a * 0.76, b * 0.52, -a * 0.26, b * 1.02, a * 0.28, b * 1.02);
    ctx.bezierCurveTo(a * 0.84, b * 0.88, a * 1.00, b * 0.36, a, 0);
    ctx.closePath();
}

/* 尾鳍：心形/燕尾，根深尖浅，叶尖随 wag 上下摆 */
function drawTail(ctx, a, b, lk, wag, c2, ink) {
    var len = lk.len;
    var sp = lk.spread;
    var x0 = -a * 0.50;
    var xTip = -a * (1 + len);
    var yTip = b * sp;
    var xN = -a * (1 + len * lk.notch);
    var w = wag;

    ctx.beginPath();
    ctx.moveTo(x0, 0);
    ctx.bezierCurveTo(-a * 0.92, -b * 0.50 + w * 0.30, -a * (1 + len * 0.55), -yTip * 0.80 + w * 0.75, xTip + w * 0.45, -yTip + w);
    ctx.bezierCurveTo(xN + a * 0.10, -yTip * 0.52 + w * 0.70, xN + a * 0.14, -yTip * 0.18 + w * 0.45, xN, w * 0.30);
    ctx.bezierCurveTo(xN + a * 0.14, yTip * 0.18 + w * 0.45, xN + a * 0.10, yTip * 0.52 + w * 0.70, xTip + w * 0.45, yTip + w);
    ctx.bezierCurveTo(-a * (1 + len * 0.55), yTip * 0.80 + w * 0.75, -a * 0.92, b * 0.50 + w * 0.30, x0, 0);
    ctx.closePath();

    var tg = ctx.createLinearGradient(-a * 0.5, 0, xTip, 0);
    U.stop(tg, 0, c2);
    U.stop(tg, 0.5, mix(c2, '#ffffff', 0.20));
    U.stop(tg, 1, mix(c2, '#ffffff', 0.46));
    ctx.fillStyle = tg;
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.lineWidth = Math.max(1.4, a * 0.10);
    ctx.lineJoin = 'round';
    ctx.stroke();
}

/* 背鳍：矮而宽的圆扇形，长在背线中后段 */
function drawDorsal(ctx, a, b, wag, fill, ink) {
    ctx.beginPath();
    ctx.moveTo(-a * 0.02, -b * 0.99);
    ctx.bezierCurveTo(-a * 0.14, -b * 1.42 + wag * 0.2, -a * 0.42, -b * 1.36 + wag * 0.2, -a * 0.56, -b * 0.84);
    ctx.quadraticCurveTo(-a * 0.28, -b * 0.94, -a * 0.02, -b * 0.99);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.lineWidth = Math.max(1.3, a * 0.075);
    ctx.lineJoin = 'round';
    ctx.stroke();
}

/* ---- 鲨鱼的三个特征件：新月尾、尖背鳍、胸鳍 ----
 * 都在小鱼尺寸（L≈40）下画的，宁可形状夸张也别堆细节。 */
function drawSharkTail(ctx, a, b, lk, wag, c2, ink) {
    var x0 = -a * 0.48;
    var xt = -a * (1 + lk.len);
    var xn = -a * (1 + lk.len * 0.34);
    var top = -b * 1.62 + wag;
    var bot = b * 1.12 + wag * 0.7;

    ctx.beginPath();
    ctx.moveTo(x0, 0);
    ctx.quadraticCurveTo(-a * 0.90, -b * 0.52, xt, top);
    ctx.quadraticCurveTo(xn + a * 0.08, -b * 0.20 + wag * 0.25, xn, wag * 0.12);
    ctx.quadraticCurveTo(xn + a * 0.06, b * 0.38 + wag * 0.25, xt * 0.93, bot);
    ctx.quadraticCurveTo(-a * 0.90, b * 0.48, x0, 0);
    ctx.closePath();

    var g = ctx.createLinearGradient(x0, 0, xt, 0);
    U.stop(g, 0, c2);
    U.stop(g, 1, mix(c2, '#ffffff', 0.26));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.lineWidth = Math.max(1.4, a * 0.085);
    ctx.lineJoin = 'round';
    ctx.stroke();
}

function drawSharkDorsal(ctx, a, b, wag, fill, ink) {
    ctx.beginPath();
    ctx.moveTo(-a * 0.04, -b * 0.96);
    ctx.quadraticCurveTo(-a * 0.16, -b * 1.50 + wag * 0.16,
        -a * 0.42, -b * 1.92 + wag * 0.12);
    ctx.lineTo(-a * 0.60, -b * 0.86);
    ctx.quadraticCurveTo(-a * 0.32, -b * 0.96, -a * 0.04, -b * 0.96);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.lineWidth = Math.max(1.3, a * 0.07);
    ctx.lineJoin = 'round';
    ctx.stroke();
}

function drawSharkPectoral(ctx, a, b, wag, fill, ink) {
    ctx.beginPath();
    ctx.moveTo(a * 0.12, b * 0.30);
    ctx.lineTo(-a * 0.38, b * 1.46 + wag * 0.16);
    ctx.lineTo(-a * 0.12, b * 0.36);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.lineWidth = Math.max(1.2, a * 0.065);
    ctx.lineJoin = 'round';
    ctx.stroke();
}

/* 词条鱼身后的金色光晕 */
function traitGlow(ctx, a) {
    var r = a * 1.75;
    var g = ctx.createRadialGradient(0, 0, a * 0.15, 0, 0, r);
    U.stop(g, 0, 'rgba(255,226,122,0.34)');
    U.stop(g, 0.55, 'rgba(255,214,106,0.15)');
    U.stop(g, 1, 'rgba(255,214,106,0)');
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, 6.2832);
    ctx.fillStyle = g;
    ctx.fill();
}

/* ---------------- 主绘制 ---------------- */

/**
 * opt:
 *   speciesId  物种 id
 *   L          体型基准（约等于鱼苗到成鱼的 38~68）
 *   t          全局时间（秒）
 *   phase      个体相位，避免整缸同步摆尾
 *   dir        1 朝右 / -1 朝左
 *   tilt       俯仰（弧度）
 *   wag        摆尾幅度 0~1.2
 *   belly      饱腹 0~1，越饱肚子越白
 *   growth     成长 0~100，越小眼睛越大
 *   hunger     饱食度，低于 20 显得没精神
 *   glow       词条光晕
 */
function draw(ctx, o) {
    var sp = fishLib.speciesById(o.speciesId);
    var lk = LOOK[sp.id] || LOOK.gold_fish;
    var pair = PALETTE[sp.palette] || PALETTE[0];
    var c1 = pair[0];
    var c2 = pair[1];
    var ink = inkOf(c2);

    var L = o.L || 44;
    var a = L * lk.a;
    var b = L * lk.b;
    var t = o.t || 0;
    var ph = o.phase || 0;
    var belly = U.clamp(o.belly == null ? 0.35 : o.belly, 0, 1);
    var growth = o.growth == null ? 100 : o.growth;
    var hungry = o.hunger != null && o.hunger < 20;

    /* 摆尾：幅度小一点，太快像抽筋 */
    var amp = (o.wag == null ? 0.55 : o.wag);
    var wag = Math.sin(t * 7.2 + ph) * b * 0.42 * amp;

    /* 鱼苗眼睛占比更大，更萌 */
    var eyeK = 1.16 - growth * 0.0016;

    ctx.save();
    ctx.globalAlpha = hungry ? 0.78 : 1;
    ctx.rotate((o.dir || 1) * (o.tilt || 0));
    ctx.scale(o.dir || 1, 1);

    if (o.glow) traitGlow(ctx, a);

    /* 1. 尾鳍 / 胸鳍 / 背鳍：都压在身体下面 */
    if (lk.shark) {
        drawSharkTail(ctx, a, b, lk, wag, c2, ink);
        drawSharkPectoral(ctx, a, b, wag, mix(c2, '#ffffff', 0.06), ink);
        drawSharkDorsal(ctx, a, b, wag, mix(c2, '#ffffff', 0.12), ink);
    } else {
        drawTail(ctx, a, b, lk, wag, c2, ink);
        drawDorsal(ctx, a, b, wag, mix(c2, '#ffffff', 0.12), ink);
    }

    /* 3. 身体 */
    var bg = ctx.createLinearGradient(0, -b * 1.12, 0, b * 1.12);
    U.stop(bg, 0, mix(c1, '#ffffff', 0.30));
    U.stop(bg, 0.46, c1);
    U.stop(bg, 1, c2);
    bodyPath(ctx, a, b);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.lineWidth = Math.max(1.8, L * 0.048);
    ctx.strokeStyle = ink;
    ctx.lineJoin = 'round';
    ctx.stroke();

    /* 4. 肚子、高光、花纹：裁在身体里画，不会溢出轮廓 */
    ctx.save();
    bodyPath(ctx, a, b);
    ctx.clip();

    /* 奶白肚皮 */
    ctx.globalAlpha = 0.34 + belly * 0.40;
    ctx.fillStyle = CREAM;
    ctx.beginPath();
    U.ellipse(ctx, a * 0.12, b * 0.68, a * 0.72, b * 0.44, 0);
    ctx.fill();
    ctx.globalAlpha = 1;

    /* 鱼苗在缸里只有 40px 上下，花纹和高光点看不出来，按体型砍掉省绘制量 */
    var detail = o.detail == null ? L >= 46 : o.detail;

    /* 顶部果冻高光 */
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.beginPath();
    U.ellipse(ctx, a * 0.12, -b * 0.62, a * 0.32, b * 0.18, -0.22);

 *

        ctx.beginPath();
        ctx.moveTo(x, TOP);
        ctx.lineTo(x, BOT);
        ctx.strokeStyle = 'rgba(107,68,35,0.62)';
        ctx.lineWidth = 1.7;
        ctx.stroke();
    }
}

/* ---------------- 玻璃里的暗影 ---------------- */

/* 水面被缸盖压住、沙底被缸底托住，两道影让水看着是「装在里面」的 */
function drawGlassShade(ctx) {
    var g = ctx.createLinearGradient(0, TOP, 0, TOP + 14);
    U.stop(g, 0, 'rgba(16,64,84,0.19)');
    U.stop(g, 1, 'rgba(16,64,84,0)');
    ctx.fillStyle = g;
    ctx.fillRect(FX, TOP, W - FX * 2, 14);

    var g2 = ctx.createLinearGradient(0, BOT - 16, 0, BOT);
    U.stop(g2, 0, 'rgba(16,64,84,0)');
    U.stop(g2, 1, 'rgba(16,64,84,0.15)');
    ctx.fillStyle = g2;
    ctx.fillRect(FX, BOT - 16, W - FX * 2, 16);

    /* 贴着缸壁的一窄条暗，玻璃厚度就出来了 */
    var g3 = ctx.createLinearGradient(FX, 0, FX + 9, 0);
    U.stop(g3, 0, 'rgba(16,64,84,0.14)');
    U.stop(g3, 1, 'rgba(16,64,84,0)');
    ctx.fillStyle = g3;
    ctx.fillRect(FX, TOP, 9, BOT - TOP);

    var g4 = ctx.createLinearGradient(W - FX, 0, W - FX - 9, 0);
    U.stop(g4, 0, 'rgba(16,64,84,0.14)');
    U.stop(g4, 1, 'rgba(16,64,84,0)');
    ctx.fillStyle = g4;
    ctx.fillRect(W - FX - 9, TOP, 9, BOT - TOP);
}

/* 一道很淡的斜反光：像手绘稿里玻璃上随手画的那道高光 */
function drawGlare(ctx) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(FX + 16, TOP);
    ctx.lineTo(FX + 44, TOP);
    ctx.lineTo(FX + 6, BOT);
    ctx.lineTo(FX - 22, BOT);
    ctx.closePath();
    var g = ctx.createLinearGradient(FX + 16, 0, FX + 44, 0);
    U.stop(g, 0, 'rgba(255,255,255,0)');
    U.stop(g, 0.5, 'rgba(255,255,255,0.16)');
    U.stop(g, 1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
}

/* 底色要先铺：水画在它上面，所以分成 base / draw 两步。
 * 外圈那道木色是必须的 —— 水面只画在玻璃里，
 * 屏幕边缘这几个像素不铺满，真机上会留下上一帧的残影。 */
function base(ctx) {
    var wall = ctx.createLinearGradient(0, 0, 0, H);
    U.stop(wall, 0, '#f3e0ba');
    U.stop(wall, 1, '#dcbe8e');
    ctx.fillStyle = wall;
    ctx.fillRect(0, 0, W, H);

    drawCard(ctx);
}

function draw(ctx) {
    drawGlassShade(ctx);
    drawGlare(ctx);
    drawWalls(ctx);
    hair(ctx, TOP, 0.7);
    hair(ctx, BOT, 0.7);
}

module.exports = {
    base: base,
    draw: draw
};

  };

  defs["render/hud.js"] = function (module, exports, require) {
/* ============================================================
 * render/hud.js · 常驻界面（顶部信息、按钮、飘字、提示）
 *
 * M6 换风格：参考的是那种明亮的手游界面 ——
 *   · 顶部左边一张「玩家卡」（头像 + 缸名 + 鱼位进度条），
 *     右边上下两条白色资源胶囊（鱼币 / 鱼数）
 *   · 底部三个方形按钮，卡面浅米色，靠上面那枚彩色圆形
 *     徽章里的图标区分功能，文字在徽章下面
 * 形状与配色全部走 render/theme.js，这里只管布局。
 * ============================================================ */

var C = require('./canvas.js');
var U = require('./util.js');
var L = require('../ui/layout.js');
var wallet = require('../core/wallet.js');
var storage = require('../core/storage.js');
var Th = require('./theme.js');
var itemArt = require('./itemart.js');
var fishArt = require('./fishart.js');
var view = require('../ui/view.js');

var W = C.W;
var H = C.H;
var roundRect = U.roundRect;
var TT = Th.T;

/* ---------------- 小图标 ---------------- */

/* 币：金色圆片，带一圈深棕描边 */
function drawCoin(ctx, cx, cy, r) {
    var g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.4, 1, cx, cy, r);
    U.stop(g, 0, '#fff3a8');
    U.stop(g, 0.55, '#f7c22c');
    U.stop(g, 1, '#d18f0c');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 6.2832);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#a9740a';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(cx - 1.1, cy - r * 0.45, 2.2, r * 0.9);
    ctx.fillRect(cx - r * 0.45, cy - 1.1, r * 0.9, 2.2);
}

function drawCoinBlue(ctx, cx, cy, r) {
    var g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.4, 1, cx, cy, r);
    U.stop(g, 0, '#d9f6ff');
    U.stop(g, 0.55, '#4dc1ea');
    U.stop(g, 1, '#1b7ba3');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 6.2832);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#12658a';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.fillStyle = '#eafaff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 9px sans-serif';
    ctx.fillText('S', cx, cy + 0.5);
}

/* 小鱼图标：鱼数用它当标签。
 * 只有 8px 高的时候会糊成一个点，所以尾巴做缺口、眼睛留白点。 */
function drawFishIcon(ctx, cx, cy, s, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.moveTo(-s * 0.7, 0);
    ctx.lineTo(-s * 2.0, -s * 0.85);
    ctx.lineTo(-s * 1.55, 0);
    ctx.lineTo(-s * 2.0, s * 0.85);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    U.ellipse(ctx, 0, 0, s, s * 0.74, 0);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.arc(s * 0.42, -s * 0.16, s * 0.26, 0, 6.2832);
    ctx.fill();
    ctx.restore();
}

/* ---------------- 顶部：玩家卡 ---------------- */

function drawPlayerCard(ctx, state) {
    var c = L.CARD;

    Th.jelly(ctx, c.x, c.y, c.w, c.h, {
        top: '#ffffff',
        bottom: '#f8ead1',
        deep: 'rgba(140,98,52,0.24)',
        r: 18,
        depth: 3,
        ink: TT.ink,
        lw: 2.2,
        gloss: false
    });

    /* 头像：白圈 + 一条 Q 版小鱼，用圆形裁掉多余的部分 */
    var a = L.AVATAR;
    ctx.beginPath();
    ctx.arc(a.cx, a.cy, a.r + 3, 0, 6.2832);
    ctx.fillStyle = '#fff6e2';
    ctx.fill();
    ctx.strokeStyle = TT.ink;
    ctx.lineWidth = 2.2;
    ctx.stroke();

    ctx.save();
    ctx.beginPath();
    ctx.arc(a.cx, a.cy, a.r, 0, 6.2832);
    ctx.clip();
    /* 鱼尾巴比身体长，缩略图那个居中偏移在圆里会显得贴左边，
     * 这里自己再往右挪 2px 补回来 */
    var fs = a.r * 1.46;
    fishArt.drawThumb(ctx, 'gold_fish', a.cx - fs / 2 + 2, a.cy - fs / 2, fs, fs);
    ctx.restore();

    /* 缸号徽章：挂在头像右下角，形状照手游里那颗等级章 */
    var tk = storage.activeTankOf(state) + 1;
    ctx.beginPath();
    ctx.arc(a.cx + a.r - 3, a.cy + a.r - 3, 9, 0, 6.2832);
    ctx.fillStyle = '#ff9f3d';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 11px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(String(tk), a.cx + a.r - 3, a.cy + a.r - 2.5);

    /* 名字 + 鱼位数字 */
    var act = storage.activeTankOf(state);
    var here = storage.fishCountInTank(state, act);
    var perTank = storage.slotsPerTank(state);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '800 12.5px sans-serif';
    ctx.fillStyle = TT.text;
    ctx.fillText('水族箱', c.x + 66, c.y + 18);

    ctx.textAlign = 'right';
    ctx.font = '800 10.5px sans-serif';
    ctx.fillStyle = perTank > 0 && here >= perTank ? '#c8441c' : TT.textSoft;
    ctx.fillText(perTank > 0 ? here + '/' + perTank : String(here), c.x + c.w - 10, c.y + 18);

    /* 鱼位进度：槽 + 填充 */
    var b = L.BAR;
    var p = perTank > 0 ? Math.min(1, here / perTank) : 0;

    roundRect(ctx, b.x, b.y, b.w, b.h, b.h / 2);
    ctx.fillStyle = 'rgba(140,98,52,0.32)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,98,52,0.28)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    if (p > 0) {
        var fw = Math.max(b.h, b.w * p);
        var g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
        U.stop(g, 0, p >= 1 ? '#ffb35c' : '#a8ea74');
        U.stop(g, 1, p >= 1 ? '#ef7a24' : '#4cae30');
        roundRect(ctx, b.x, b.y, fw, b.h, b.h / 2);
        ctx.fillStyle = g;
        ctx.fill();

        roundRect(ctx, b.x + 2, b.y + 2, Math.max(0, fw - 4), b.h * 0.34, b.h * 0.17);
        ctx.fillStyle = 'rgba(255,255,255,0.42)';
        ctx.fill();
    }
}

/* ---------------- 顶部：资源胶囊 ---------------- */

function pillBase(ctx, r) {
    Th.jelly(ctx, r.x, r.y, r.w, r.h, {
        top: '#ffffff',
        bottom: '#fff1d6',
        deep: 'rgba(150,105,50,0.24)',
        r: r.h / 2,
        depth: 2.5,
        ink: TT.ink,
        lw: 2.1,
        gloss: true
    });
}

function drawCoinPill(ctx, state) {
    var r = L.COIN_PILL;
    var cy = r.y + r.h / 2;
    pillBase(ctx, r);

    drawCoin(ctx, r.x + 15, cy, 9);

    var val = wallet.display(state, 'fish');
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '800 15px sans-serif';
    ctx.fillStyle = TT.text;
    ctx.fillText(wallet.format(val), r.x + 29, cy + 0.5);

    /* S 币极少出现，有余额才在右端冒一个小蓝章 */
    var s = wallet.display(state, 's');
    if (s > 0) {
        var st = wallet.format(s);
        ctx.textAlign = 'right';
        ctx.font = '800 11px sans-serif';
        ctx.fillStyle = '#12658a';
        ctx.fillText(st, r.x + r.w - 9, cy + 0.5);
        var sw = ctx.measureText(st).width;
        drawCoinBlue(ctx, r.x + r.w - 9 - sw - 8, cy, 7);

}

function drawFishPill(ctx, state) {
    var r = L.FISH_PILL;
    var cy = r.y + r.h / 2;
    pillBase(ctx, r);

    /* 当前缸的鱼位进度已经在左边的玩家卡里了，
     * 这条胶囊读的是「所有缸加起来一共有几条鱼」。 */
    var total = (state.fish && state.fish.length) || 0;

    drawFishIcon(ctx, r.x + 16, cy, 8.5, '#38b06a');

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '800 15px sans-serif';
    ctx.fillStyle = TT.text;
    ctx.fillText(String(total), r.x + 29, cy + 0.5);

    ctx.font = '700 11px sans-serif';
    ctx.fillStyle = TT.textSoft;
    var nw = ctx.measureText(String(total)).width;
    ctx.fillText('条', r.x + 31 + nw, cy + 0.5);
}

function drawTopBar(ctx, state) {
    drawPlayerCard(ctx, state);
    drawCoinPill(ctx, state);
    drawFishPill(ctx, state);
}

/* ---------------- 鱼缸切换（圆点） ---------------- */

function drawTankTabs(ctx, state) {
    /* 只有一个缸时不显示：新手期少一个视觉噪点 */
    var n = storage.tankCountOf(state);
    if (n <= 1) return;
    var total = storage.maxTanks();
    var act = storage.activeTankOf(state);

    ctx.save();
    for (var i = 0; i < total; i++) {
        var r = L.tankTabRect(i, total);
        var cx = r.x + r.w / 2;
        var cy = r.y + r.h / 2;
        var owned = i < n;
        var on = i === act;

        Th.badge(ctx, cx, cy, 9.5, {
            top: on ? '#c4f59a' : (owned ? '#ffffff' : '#e6dac4'),
            bottom: on ? '#5cc23f' : (owned ? '#f2e5c9' : '#cfc1a9'),
            ink: owned ? TT.ink : 'rgba(107,68,35,0.4)',
            lw: 2,
            gloss: on
        });

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 10px sans-serif';
        ctx.fillStyle = on ? '#ffffff' : (owned ? TT.text : 'rgba(107,68,35,0.45)');
        ctx.fillText(String(i + 1), cx, cy + 0.5);
    }
    ctx.restore();
}

/* ---------------- 底部按钮 ----------------
 * 一拍三格：撒食 / 卖掉（sell.js）/ 商店。
 * 卡面统一浅米色，功能靠上面那枚彩色徽章区分 ——
 * 这是参考图的做法，比整块染成彩色更像一套按钮，也不会互相抢眼。
 */

function drawIconButton(ctx, r, o) {
    Th.jelly(ctx, r.x, r.y, r.w, r.h, {
        top: '#ffffff',
        bottom: '#fbeccf',
        deep: 'rgba(140,98,52,0.3)',
        r: 22,
        depth: 5,
        ink: TT.ink,
        lw: 2.6,
        gloss: false
    });

    var cx = r.x + r.w / 2;
    var cy = r.y + 27;

    Th.badge(ctx, cx, cy, 19, {
        top: o.top,
        bottom: o.bottom,
        ink: o.ink,
        lw: 2.4
    });

    itemArt.draw(ctx, o.icon, cx, cy, 28);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 13px sans-serif';
    ctx.fillStyle = TT.text;
    ctx.fillText(o.label, cx, r.y + 61);
}

function drawButtons(ctx) {
    drawIconButton(ctx, L.FEED_BTN, {
        icon: 'feed',
        label: '撒食',
        top: '#b6ec7d',
        bottom: '#57b93c',
        ink: '#2f7a25'
    });

    drawIconButton(ctx, L.SHOP_BTN, {
        icon: 'shop',
        label: '商店',
        top: '#9adaf8',
        bottom: '#3f9fd4',
        ink: '#1c6a94'
    });
}

/* ---------------- 其它 ---------------- */

function drawFloaters(ctx, state) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 16px sans-serif';
    ctx.lineJoin = 'round';
    var list = state.view.floaters;
    for (var i = 0; i < list.length; i++) {
        var fl = list[i];
        var p = fl.t / fl.life;
        var y = fl.y - 42 * p;
        ctx.globalAlpha = Math.max(0, 1 - p * p);
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(90,58,26,0.7)';
        ctx.strokeText(fl.text, fl.x, y);
        ctx.fillStyle = fl.color;
        ctx.fillText(fl.text, fl.x, y);
    }
    ctx.restore();
}

function drawHint(ctx, state) {
    if (state.hint <= 0) return;

    var txt = '点鱼选中，再点「卖掉」换钱';
    ctx.save();
    ctx.globalAlpha = Math.min(1, state.hint);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 13px sans-serif';

    /* 直接压白字在水里，鱼游过来就糊成一团；
     * 做成一张浮在水里的半透明小卡片，和底部按钮是同一套语言 */
    var tw = ctx.measureText(txt).width;
    var bw = tw + 34;
    var by = C.TANK_TOP + 26;

    Th.jelly(ctx, (W - bw) / 2, by, bw, 34, {
        top: 'rgba(255,255,255,0.92)',
        bottom: 'rgba(255,241,214,0.92)',
        deep: 'rgba(20,90,110,0.26)',
        r: 17,
        depth: 2.5,
        ink: 'rgba(107,68,35,0.55)',
        lw: 1.8,
        gloss: false
    });

    ctx.fillStyle = TT.text;
    ctx.fillText(txt, W / 2, by + 17.5);
    ctx.restore();
}

/* Q 版不要暗角，保留函数让调用方不用改 */
function drawVignette() {
    /* 有意留空：卡通风格压暗会显脏 */
}

function drawToast(ctx, session) {
    if (!session.toast) return;
    ctx.save();
    var a = Math.min(1, session.toast.t * 3);
    ctx.globalAlpha = a;
    ctx.font = '700 14px sans-serif';
    var tw = ctx.measureText(session.toast.text).width + 36;

    Th.jelly(ctx, (W - tw) / 2, H * 0.36, tw, 42, {
        top: '#fffdf4',
        bottom: '#ffe7b8',
        deep: 'rgba(140,96,46,0.34)',
        r: 21,
        depth: 3,
        lw: 2.4
    });

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = TT.text;
    ctx.font = '700 14px sans-serif';
    ctx.fillText(session.toast.text, W / 2, H * 0.36 + 21.5);
    ctx.restore();
}

/* ---------------- 鱼缸缩放（M8） ---------------- */

function drawZoom(ctx) {
    var z = view.state.zoom;

    function one(r, txt, on) {
        var cx = r.x + r.w / 2;
        var cy = r.y + r.h / 2;
        Th.badge(ctx, cx, cy, r.w / 2, {
            top: on ? '#ffffff' : '#e8ddc7',
            bottom: on ? '#d7f3e2' : '#cbb99b',
            ink: on ? '#2b7a5a' : '#9b8a70',
            lw: 2,
            gloss: on
        });
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 18px sans-serif';
        ctx.fillStyle = on ? '#216e50' : '#9b8a70';
        ctx.fillText(txt, cx, cy + 0.5);
    }

    one(L.ZOOM_OUT, '−', z > 1);
    one(L.ZOOM_IN, '+', z < 2);

    /* 档位读数放在两枚按钮下方，不写字幕挡鱼 */
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 10px sans-serif';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.lineWidth = 3;
    var lx = (L.ZOOM_OUT.x + L.ZOOM_IN.x + L.ZOOM_IN.w) / 2;
    var ly = L.ZOOM_OUT.y + L.ZOOM_OUT.h + 9;
    ctx.strokeText(view.label(), lx, ly);
    ctx.fillStyle = '#2b6b76';
    ctx.fillText(view.label(), lx, ly);
}

module.exports = {
    drawTopBar: drawTopBar,
    drawTankTabs: drawTankTabs,
    drawButtons: drawButtons,
    drawZoom: drawZoom,
    drawFloaters: drawFloaters,
    drawHint: drawHint,
    drawVignette: drawVignette,
    drawToast: drawToast
};

  };

  defs["render/sheet.js"] = function (module, exports, require) {
/* ============================================================
 * render/sheet.js · 商店面板（两页）
 *
 *   道具页  数据来自 core/shop.js · list()（价格、满级、买得起吗）
 *   鱼卵页  数据来自 core/shop.js · eggList()（按品种定价、品质锁）
 *
 * 这一层只负责画，不判断能不能买 —— disable 状态由 core 给。
 * ============================================================ */

var C = require('./canvas.js');
var U = require('./util.js');
var art = require('./fishart.js');
var itemArt = require('./itemart.js');
var L = require('../ui/layout.js');
var cfg = require('../config/index.js');
var shop = require('../core/shop.js');
var wallet = require('../core/wallet.js');
var Th = require('./theme.js');
var TT = Th.T;

var W = C.W;
var H = C.H;
var roundRect = U.roundRect;

var RARITY = cfg.rarityColor;
var TAB_NAME = ['道具', '鱼卵'];

/* ---------------- 页签 ---------------- */

function drawTabs(ctx, session, ease) {
    for (var i = 0; i < TAB_NAME.length; i++) {
        var r = L.tabRect(i, ease);
        var on = session.sheetTab === i;

        if (on) {
            Th.jelly(ctx, r.x, r.y, r.w, r.h, {
                top: TT.greenTop, bottom: TT.greenBottom, deep: TT.greenDeep,
                r: 15, depth: 3, ink: '#2f7a25', lw: 2.4
            });
        } else {
            Th.jelly(ctx, r.x, r.y, r.w, r.h, {
                top: TT.cardTop, bottom: '#f3e3c4', deep: 'rgba(150,110,60,0.22)',
                r: 15, depth: 3, ink: 'rgba(107,68,35,0.5)', lw: 2, gloss: false

    if (!e || !e.stack) return '';

    var out = [];
    for (var i = 0; i < lines.length && out.length < 8; i++) {
        var l = lines[i].replace(/^\s+/, '');
        if (!l || l.indexOf('at ') !== 0) continue;
        /* at http://... (game.js:12:5) → at game.js:12:5 */
        l = l.replace(/\(([^()]*)\)$/, function (m, inner) {
            var tail = inner.split('/').pop();
            return '(' + tail + ')';
        });
        out.push(l);
    }
    return out.join('\n');
}

function fatal(e) {
    var text = e ? (String(e.message || e)) : '未知错误';
    var stack = shortStack(e);

    /* 控制台也留一份，方便真机调试时复制 */
    try {
        if (typeof console !== 'undefined' && console.error) console.error(text);
    } catch (e0) { /* 忽略 */ }

    try {
        var api = (typeof wx !== 'undefined') ? wx : null;
        if (!api || !api.createCanvas) return;

        /* 屏幕画布此前若已被创建，这里拿到的就是同一张 */
        var cv = api.createCanvas();
        if (!cv) return;
        var ctx = cv.getContext('2d');
        if (!ctx) return;

        /* 崩在 canvas 初始化之前时，画布还是 300x150 的默认尺寸。
         * 这里自己问一次屏幕大小并重设，保证错误页能铺满整屏。
         * 注意：设置 width/height 会重置画布状态（含之前的 scale），正合适。 */
        var info = null;
        try {
            if (api.getWindowInfo) info = api.getWindowInfo();
        } catch (eA) { info = null; }
        if (!info || !(info.windowWidth > 0)) {
            try {
                if (api.getSystemInfoSync) info = api.getSystemInfoSync();
            } catch (eB) { info = null; }
        }

        var lw = (info && info.windowWidth > 0) ? info.windowWidth : 375;
        var lh = (info && info.windowHeight > 0) ? info.windowHeight : 667;
        var dpr = (info && info.pixelRatio > 0) ? Math.min(info.pixelRatio, 3) : 2;

        cv.width = Math.floor(lw * dpr);
        cv.height = Math.floor(lh * dpr);

        var cw = cv.width;
        var ch = cv.height;
        var s = lw / 375;                 /* 以 375 逻辑宽为基准换算字号 */
        if (!(s > 0.5 && s < 4)) s = 1;

        ctx.fillStyle = '#061a26';
        ctx.fillRect(0, 0, cw, ch);

        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';

        ctx.fillStyle = '#ff8f8f';
        ctx.font = 'bold ' + Math.round(14 * s * dpr) + 'px sans-serif';
        ctx.fillText('启动失败 · 请截图给开发者', 12 * s * dpr, 18 * s * dpr);

        /* 第一段：错误消息（最能说明问题的就是这一行） */
        ctx.fillStyle = '#ffd08a';
        ctx.font = Math.round(11 * s * dpr) + 'px sans-serif';

        var x0 = 12 * s * dpr;
        var wMax = cw - 24 * s * dpr;
        var lineH = 15 * s * dpr;
        var y = 46 * s * dpr;
        var maxLines = Math.floor((ch - y - 12) / lineH);

        y = drawWrapped(ctx, text, x0, y, wMax, lineH, Math.min(maxLines, 8));

        /* 第二段：堆栈（函数名 + 行号），帮开发者定位到具体位置 */
        if (stack) {
            ctx.fillStyle = '#8fa6b4';
            ctx.font = Math.round(9 * s * dpr) + 'px sans-serif';
            var lh2 = 12 * s * dpr;
            var left = Math.floor((ch - y - 12) / lh2);
            if (left > 0) drawWrapped(ctx, stack, x0, y + 6 * s * dpr, wMax, lh2, left);
        }
    } catch (e2) {
        /* 连带错误页都画不出来，只能听天由命 */
    }
}

/** 按宽度自动换行绘制，返回绘制结束后的 y */
function drawWrapped(ctx, str, x, y, maxW, lineH, maxLines) {
    var lines = String(str).split('\n');
    var n = 0;

    for (var s = 0; s < lines.length && n < maxLines; s++) {
        var src = lines[s];
        var line = '';
        for (var i = 0; i < src.length; i++) {
            var c = src.charAt(i);
            if (ctx.measureText(line + c).width > maxW && line) {
                ctx.fillText(line, x, y + n * lineH);
                n += 1;
                line = c;
                if (n >= maxLines) {
                    ctx.fillText('…', x, y + n * lineH);
                    return y + (n + 1) * lineH;
                }
            } else {
                line += c;
            }
        }
        if (line) {
            ctx.fillText(line, x, y + n * lineH);
            n += 1;
        }
    }
    return y + n * lineH;
}

  };

  req("game.js");
})();</script>

<script>
/* 画布是游戏自己创建的，所以要等它挂上来之后再量一次尺寸 */
(function () {
  function again() { if (window.__fitStage) window.__fitStage(); }
  requestAnimationFrame(again);
  setTimeout(again, 60);
  setTimeout(again, 400);

  /* 调试通道：?tap=195,774 在加载后点一下这个**逻辑坐标**。
   * 用来验证缩放后的触摸换算有没有偏 —— 手机上点不到的地方，
   * 自动化也没法点，只能靠它。 */
  var tm = /[?&]tap=([^&]+)/.exec(location.search);
  if (tm) {
    /* 支持 ?tap=x,y 与 ?tap=x,y;x2,y2 —— 后者用来验证「选中→卖掉」这类两步操作 */
    var pairs = decodeURIComponent(tm[1]).split(';');
    for (var pi = 0; pi < pairs.length; pi++) {
      var xy = /^(\d+),(\d+)$/.exec(pairs[pi].trim());
      if (!xy) continue;
      (function (px, py, delay) {
        setTimeout(function () {
          var cv = document.querySelector('#stage canvas');
          var st = window.__stageSize;
          if (!cv || !st) return;
          var r = cv.getBoundingClientRect();
          var sx = r.left + px * (r.width / st.w);
          var sy = r.top + py * (r.height / st.h);
          var E = window.PointerEvent ? PointerEvent : MouseEvent;
          var opt = {
            clientX: sx, clientY: sy, bubbles: true, cancelable: true, pointerId: 7
          };
          cv.dispatchEvent(new E('pointerdown', opt));
          /* 真正的点击现在在抬手时分发（按下要先判断是不是拖动），
           * 只发 pointerdown 会被当成「还没决定」而不触发。 */
          cv.dispatchEvent(new E('pointerup', opt));
        }, delay);
      })(+xy[1], +xy[2], 900 + pi * 1400);
    }
  }

  /* 兜底：两秒后还没有画布，说明启动链断了，别让用户对着空屏 */
  setTimeout(function () {
    if (document.querySelector('#stage canvas')) return;
    var fb = document.getElementById('fallback');
    fb.style.display = 'block';
    fb.textContent = '启动失败：画布没有创建出来\n请换一个浏览器或重新打开本页';
  }, 2000);
})();

window.addEventListener('error', function (e) {
  if (document.querySelector('#stage canvas')) return;   /* 已经跑起来了就不打扰 */
  var fb = document.getElementById('fallback');
  fb.style.display = 'block';
  fb.textContent = '启动失败：' + (e && e.message ? e.message : '未知错误');
});
</script>
